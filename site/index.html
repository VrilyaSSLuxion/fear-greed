" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>Other heatmap sources – what works, what does not</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: also shows an <b>estimate</b> (several models, many exchanges). There is no public interface and no data download – so only as a link.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: heatmap data via the official interface only in the “Professional” plan (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ per month ↗</a>) – too expensive; the website itself is protected against automated reading.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: no official interface; the website has bot protection which this page does not bypass. There is a paid third-party wrapper on <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ per 1,000 calls, unofficial, may stop at any time).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: free heatmap only as a picture on the website (Hyperliquid data), no interface.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: heatmap from Hyperliquid data via an interface, only in paid plans with a key.</li><li><b>MEXC</b>: publicly only provides the current open interest, no hourly history – so not (yet) in the estimate.</li></ul></div><div class=\"ibox\"><h3>Alerts – where and how</h3><ul><li><b>Where to set them:</b> gear → <b>Alerts</b> (browser: sound, notification, which alerts, <b>sound and repeat per alert type</b>) · <b>Heatmap &amp; alerts</b> · <b>Pivot alerts</b> · <b>Telegram</b>.</li><li><b>Alert windows</b> stay at the top right until you close them: <b>✕</b> = just close (reminders continue), <b>OK, done</b> = close and no more reminders. Several alerts stack. The <b>🔔</b> button at the top shows open alerts and opens the <b>alert history</b> (time, type, direction, full text).</li><li><b>Repeat</b> per alert type: interval (5 min … 4 h) and at most how often – default for pivot alerts every 2 hours, at most 5 times; off for the others. Pivot reminders also come via Telegram as long as the level stays broken. <b>Sounds</b>: bell, double tone, rising, falling, alarm, soft – per type with ▶ to preview.</li><li><b>Pivot alerts</b> (on by default for 1, 3 and 6 months): low broken, high broken, approach (± %). Levels come from completed days (up to yesterday), same calculation as the pivot lines.</li><li><b>What the pivot message contains:</b> which level broke; a <b>look back</b> since 2020 – how often price closed back on the other side within 7 days after such a break (false break / liquidity sweep) and where it stood 30 days later; the <b>assessment</b> derived from it: from 60 % returns “historically mostly a false break → rather a counter-move, only after confirmation”, up to 40 % “historically mostly continuation”, in between “mixed”; plus scenario A (sweep) and B (breakout → next pivot or cluster). The assessment comes only from real numbers – no made-up probability.</li><li><b>Own alert lines</b> (A1 …): red above price, green below (or a fixed colour, gear → own lines). Alert when crossed.</li><li>Browser alerts only arrive while the page is open. <b>Telegram</b> comes from the program on the PC – even when the page is closed.</li></ul><p><b>Candle patterns (V17):</b> own alert as soon as a daily candle with a pattern in an extreme has closed – in the browser (gear → alerts, sound “chime”, repeat selectable) and via Telegram (tick “Candle patterns in extremes”).</p></div><div class=\"ibox\"><h3>More features</h3><ul><li><b>Bitcoin in the next 24 hours:</b> average of the Polymarket price ladder and the own zone evaluation (how often price was higher the next day); font size in the gear.</li><li><b>What this means now:</b> action from the zone as in the video, next to it the <b>tendency</b> of recent weeks.</li><li><b>The last 7 days</b> one by one with index, daily value, official indices and price.</li><li><b>Spot &amp; futures recommendation</b> per zone (template, texts editable in the gear) and <b>liquidity assessment</b> (are longs or shorts closer and denser to price?).</li><li><b>⛶ Fullscreen</b> on every window (Esc = back). <b>L/S labels</b> at the dots, <b>layers menu</b> for all chart elements, chart end shift and auto-scroll like MT4.</li><li><b>Ticker:</b> drag the grip to resize (double-click = default), use the tab on the right to <b>collapse completely</b> and expand again, the <b>⇅</b> tab next to it switches <b>top/bottom</b> (also in the gear).</li><li><b>Status line</b> at the top next to SMC · SMC 2 · VrilyaSS: shows the current view; in SMC/SMC 2 a click on the hint switches to VrilyaSS. If a newer version runs, “New version – reload” appears at the top.</li><li><b>What this means now:</b> action and tendency in two equally sized buttons – the same in all languages. In the header $ and € use equally wide digits and stay aligned.</li><li><b>Frames and colours:</b> “Frames” button, colour/width, heading colours, chart colours in the gear. The top control bar sits in its own box.</li><li><b>Program on the PC:</b> starts with Windows, fetches new data every minute, publishes the online link every 10 minutes; plus a single file to send around. <b>Phone:</b> “like on PC” or “phone-optimised” view.</li></ul><p><b>New in V17:</b></p><ul><li><b>Ticker:</b> $ and € sit exactly above each other (right-aligned, equal-width digits). The arrows are now graphics and exactly centred, “TICK” and “24 H” sit lower and on one line. Long/short boxes taller, percent left/right bigger (25 px). <b>Gear → Chart extras, tendency &amp; frames → Ticker – sizes &amp; spacing:</b> font “TICK”/“24 H”, gap above, arrows, 24h percent and gap below, long/short numbers, percent, box height – all in pixels, empty field = automatic (the grey value is the current size), button “Reset all ticker values”. Plus the size the <b>double-click</b> on the top edge returns to (default 100 %).</li><li><b>What this means now:</b> both buttons can pulse (on/off each). Font sizes for the left button (e.g. “Wait”, 21 px), “Tendency:” (15 px) and the tendency value (e.g. “Sell”, 19 px) – gear → Chart extras → “What this means” – buttons.</li><li><b>Assessment</b> below the chart: <b>1</b> Smart Money, <b>2</b> Official (textbook), <b>3</b> Combined (from 1 and 2) – the verdicts line up exactly.</li><li><b>Tabs</b> “Extremes of the last 12 months” / “The last 12 days”: the active tab is filled yellow.</li><li>All buttons and boxes above the chart have the same height; the divergence button is only as wide as its text. The tables “Fear &amp; Greed compared” and “Method comparison” no longer need a horizontal scrollbar on the PC.</li></ul></div><div class=\"ibox\"><h3>Remembered for later</h3><ul><li>Set up <b>Telegram</b> together (bot via @BotFather) – then all alerts reach the phone.</li><li>Add the <b>CoinGlass heatmap</b> if a key in the “Professional” plan is ever available.</li><li><b>CoinAnk via Apify</b> (paid, unofficial) or a <b>Kiyotaka key</b> – technically possible if wanted.</li><li>Add <b>MEXC</b> once it offers an open interest history (or the program records it itself). More exchanges would be possible via the existing Coinalyze key.</li></ul></div><div class=\"ibox\"><h3>Where do I set what?</h3><ul><li><b>Top control bar</b> (one box): view · status line · Binance/Multi-Source · 365/90 days · $/€ · frames · 🔔 alert history · manual · gear. Hovering shows short explanations.</li><li><b>Buttons above the chart:</b> line/candles, candle (size), numbers, index in chart, heatmap + ▾ exchanges, signals + official, divergence, tops/bottoms, pivot + ▾ periods, Fibo, MA, clusters + middle, alert lines + own lines, layers ▾, range. Buttons with steps: click = next, right-click = back.</li><li><b>Buttons at the index chart</b> (VrilyaSS): MA (index line), 50, levels, official index.</li><li><b>Using the chart:</b> wheel = zoom time, drag = pan, drag right scale = zoom height, double-click = reset.</li><li><b>Gear:</b> view, language, currency, official index, levels, signals and trend filter (buy/sell), divergence, heatmap &amp; alerts, pivot alerts, own lines (colours), recommendations, chart extras (tops/bottoms, pivot calculation, Fibonacci, MA with extension per line, index MA, 50 line, candle patterns in extremes, price line, direction box, ticker with sizes &amp; spacing, “What this means” buttons, frames), alerts (sound and repeat per type), program, API keys, Telegram, colours.</li><li><b>New in V17:</b> candle patterns in extremes (button “Patterns”, own alert) · pivot lines with 4h/1h/15m in € exactly at the wick, labels no longer cut off · ticker: $/€ aligned, arrows centred, sizes and spacing adjustable, double-click size · pulsing and font sizes at “What this means” · assessment 1/2/3 · active tab yellow · all buttons the same height · tables without scrollbar · 50 line explained step by step.</li><li><b>New in V16:</b> pivots correctly in the displayed currency, default “highest high + lowest low in the period”, plus “low after the high” and “high after the low”, several periods at once · 50 line with 8 signal types · trend filter for sells too · alert windows stay, alert history, repeat and sounds per type, pivot alerts by default 1M/3M/6M with assessment · heatmap exchanges freely combinable · candles 1M and 1Y · index MA with box and own settings, extension per line · buttons grouped in boxes, explanations on hover · own alert lines red/green · ticker tab top/bottom, larger ticker values · status line, new-version notice · clearer frames on tables and trend boxes · equal buttons at “What this means now” · less space in SMC · thicker gear frame.</li><li><b>Data:</b> on the PC every minute (adjustable), online every 10 minutes. The time is shown in the footer.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Open this window any time via “Manual”.</p>"});
Object.assign(T.ar, {"introHtml":"<p class=\"lead\">مرحباً بك في <b>VrilyaSS Fear &amp; Greed INDEX</b> – إعادة بناء لمؤشر «Smart Money Fear &amp; Greed» من قناة <b>Smart Money Crypto</b> (يوتيوب)، مع إضافات خاصة.</p><div class=\"ibox\"><h3>ما الفكرة؟</h3><p>مؤشرات الخوف والطمع المعروفة (alternative.me، CoinMarketCap، CFGI.io، CoinGlass، CoinAnk) تقيس المزاج غالباً من حجم التداول الفوري والتقلّب ووسائل التواصل والاستطلاعات.</p>\n<p>صاحب قناة <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">قناة يوتيوب ↗</a>) عرض في بثوثه المباشرة مؤشراً بناه بنفسه. يقيس ما يراه أهم: كيف يتموضع <b>متداولو العقود الآجلة</b> (التمويل، الفائدة المفتوحة، لونغ/شورت، التصفيات)، وإلى أين تذهب <b>التدفقات الكبيرة</b> (صناديق ETF، العملات المستقرة، علاوة Coinbase)، وكيف يبدو <b>الوضع الاقتصادي الكلي</b> (VIX، الدولار).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – «⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!»<br>هنا يتحدث <b>لأول مرة عن بناء</b> مؤشره: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">من الدقيقة 11:57 ↗</a></li><li><b>16.10.2026</b> – «⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING»<br>هنا يشرح <b>النسخة المحسّنة</b> من اليوم السابق: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">من الدقيقة 8:21 ↗</a></li></ul>\n<p>بحسب الفيديو، ينعطف مؤشره <b>أبكر</b> من المؤشر الرسمي: في يوليو 2026 أظهر طمعاً شديداً قبل أسابيع من المؤشر الرسمي – وهذا متأخر جداً للمستثمر الصغير.</p>\n<p class=\"opinion\"><b>رأي صاحب الموقع:</b> المؤشرات الرسمية تتفاعل عادةً متأخرة بوضوح – وكثيراً ما تأتي إشاراتها للمستثمر الصغير متأخرة بأسابيع. هي مصممة للجمهور العام، لا للإشارات المبكرة. ويضاف إلى ذلك تضارب مصالح: عدة مزوّدين قريبون من البورصات (CoinMarketCap مثلاً تابعة لـ Binance)، والبورصات تربح من تداول الجمهور سواء ربح أم خسر. لذلك لا ينبغي الاعتماد على هذه المؤشرات وحدها في الاستثمار الحقيقي.</p>\n<p>هذه الصفحة تعيد بناء مؤشره من بيانات متاحة مجاناً <i>(ليست صفحة رسمية، وليست نصيحة استثمارية)</i>.</p></div><div class=\"ibox\"><h3>العروض الثلاثة: SMC · SMC 2 · VrilyaSS</h3><p>التبديل من أعلى اليسار. المؤشر وطريقة حسابه واحدة في العروض الثلاثة – يتغيّر فقط ما يُعرض.</p>\n<h4>1 · SMC – نسخة مطابقة 1:1</h4><p>كما في فيديو Smart Money Crypto (16.10.2026): العنوان، السعر بالدولار، تغيّر 24 ساعة، أزرار تيليغرام / نماذج الذكاء الاصطناعي / لماذا هذا المؤشر؟، المكوّنات العشرة والمؤشر في الوسط، «بيتكوين في الـ 24 ساعة القادمة»، «ماذا يعني هذا الآن»، رسم «أين كان الخوف وأين الطمع» مع الأرقام والمؤشر الرسمي والفترات والنقاط، وشريط التصفيات في الأسفل.</p>\n<h4>2 · SMC 2 – نسخة مطابقة مع تغييرات خفيفة</h4><ul><li>السعر <b>بالدولار واليورو</b> مع الأعلام <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – في العنوان والشريط</li><li>العنوان داخل <b>إطار ذهبي</b>، و<b>خطوط فاصلة</b> بين العنوان والسعر و24 ساعة والأزرار واللغة</li><li>الشريط مع <b>سهم 24 ساعة</b> إضافةً إلى <b>أسطر التجمّعات الأربعة</b> (SF أبعد شورت، S1 أقوى شورت، L1 أقوى لونغ، LF أبعد لونغ) مع مستوى التنبيه</li><li>وكل ما عدا ذلك مثل SMC</li></ul>\n<h4>3 · VrilyaSS – SMC كأساس مع كل الإضافات الخاصة</h4><ul><li><b>العرض:</b> الدولار واليورو مع الأعلام، كل المؤشرات الرسمية كبطاقات مع الفرق عن مؤشر Smart Money، آخر 7 أيام، <b>الاتجاه</b> بجانب «ماذا يعني هذا الآن»، <b>توصية سبوت وعقود آجلة</b>، <b>تقييم ①②③</b> مركّب، الاتجاه ومقارنة الطرق (اختبار تاريخي)</li><li><b>الرسم:</b> خط/شموع مع حجم شمعة قابل للاختيار، المؤشر داخل الرسم، خريطة التصفيات (Binance / Bybit / OKX / مجمّع)، المستويات، <b>الإشارات</b> مع فلتر الاتجاه ⚠، الإشارات الرسمية، <b>الانحرافات</b>، <b>القمم/القيعان</b>، <b>البيفوت</b>، <b>فيبوناتشي</b>، <b>المتوسطات</b>، تسميات L/S، خطوط التنبيه والخطوط الخاصة، المنتصف، <b>مربع الاتجاه</b>، قائمة الطبقات، التكبير مثل TradingView، إزاحة نهاية الرسم مثل MT4، <b>⛶ ملء الشاشة</b> لكل نافذة</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام (الإشارات، التجمّعات، رد الفعل، الخطوط الخاصة، البيفوت، الانحرافات)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>المؤشر، 10 مكوّنات، 24 ساعة، الرسم كما في الفيديو</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>الدولار واليورو مع الأعلام</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>إطار العنوان والخطوط الفاصلة</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الشريط مع سهم 24 ساعة و4 أسطر تجمّعات</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الإشارات، الانحرافات، القمم/القيعان، البيفوت، فيبوناتشي، المتوسطات</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>تجمّعات الخريطة، خطوط التنبيه والخاصة، مربع الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>كل المؤشرات الرسمية، آخر 7 أيام، الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>توصية سبوت وعقود آجلة، تقييم ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>اللغة DE · EN · AR، الإطارات، الدليل، الإعدادات</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>لماذا VrilyaSS؟</h3><ul><li><b>نفس الأساس</b> مثل SMC – نفس المؤشر – لكن مع أدوات <b>للتحقق</b> من الإشارة بدلاً من اتباعها بشكل أعمى.</li><li><b>مقارنة</b> مع كل المؤشرات الرسمية بنظرة واحدة: كم يسبقها Smart Money أو يتأخر عنها؟</li><li><b>إشارات بلا إعادة رسم</b> مع تقييم (نسبة النجاح بعد 30 يوماً)؛ و<b>فلتر الاتجاه</b> يعلّم الشراء عكس الاتجاه بـ ⚠.</li><li><b>تجمّعات التصفيات</b> تُظهر إلى أين قد يُسحب السعر – مع تنبيه قبل الوصول.</li><li><b>القمم/القيعان والبيفوت وفيبوناتشي والمتوسطات ومربع الاتجاه</b> تبيّن موقع السعر واتجاهه الحالي.</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام – لا حاجة لمراقبة الرسم طوال الوقت.</li><li>بصراحة: لا توجد أداة تصيب دائماً. الصفحة تساعد على الفهم، وهي <b>ليست نصيحة استثمارية</b>.</li></ul></div><div class=\"ibox\"><h3>طريقة الحساب</h3><ul><li><b>10 مكوّنات:</b> التمويل، تغيّر الفائدة المفتوحة، نسبة لونغ/شورت، التصفيات، RSI والتقلّب (سوق العقود الآجلة)، وتدفقات ETF، تدفق العملات المستقرة، علاوة Coinbase، VIX واتجاه DXY (التدفقات والاقتصاد الكلي).</li><li>كل مكوّن يُقارن بآخر <b>90 أو 365 يوماً</b> من قيمه (0 = خوف، 100 = طمع؛ في الأعلى «365 ي / 90 ي»).</li><li>المؤشر هو المتوسط، ويُعرض كـ<b>متوسط 7 أيام</b>. «Binance» = بيانات Binance فقط كما في الفيديو، «Multi-Source» = عدة بورصات (مرّر الفأرة للشرح).</li><li><b>المناطق</b> كما في الفيديو: 0–24 خوف شديد (شراء) · 25–44 خوف (شراء على دفعات) · 45–54 محايد (انتظار) · 55–74 طمع (احتفاظ) · 75–100 طمع شديد (جني الأرباح).</li><li><b>التقييم</b> تحت الرسم: ① Smart Money، ② المؤشر الرسمي حسب الكتاب، ③ مركّب (Smart Money يُحسب مرتين افتراضياً؛ 1:1 أو 2:1 أو 3:1 في الإعدادات). بجانب «ماذا يعني هذا الآن» يظهر <b>الاتجاه</b> في الأسابيع الأخيرة.</li></ul></div><div class=\"ibox\"><h3>الرسم: الفترة، الشموع، خط السعر، الاتجاه</h3><ul><li><b>الفترة</b> (الأزرار بعد «الفترة:» – 7 أيام، شهر … الكل) = مقدار ما تراه، <b>وليس</b> حجم الشمعة. الأزرار المترابطة في مربع واحد (الخريطة + المصدر، الإشارات + الرسمية + الأنماط، البيفوت + الفترات، التجمّعات + المنتصف، خطوط التنبيه + الخاصة)؛ وتمرير الفأرة يشرح الحالة وأثر النقر والنقر الأيمن.</li><li><b>الشمعة</b> (الاختيار بجانب خط/شموع): <b>تلقائي</b> = حتى 10 أيام شموع ساعة، وإلا شموع يومية (كما سابقاً) · <b>15د / 1س / 4س</b> = شموع دقائق/ساعات مباشرة من Binance، فقط عند النهاية الحالية وبقدر ما تمتد البيانات (15د ≈ 10 أيام، 1س ≈ 41 يوماً، 4س ≈ 166 يوماً) – إن امتدت الفترة أبعد تُعرض شموع يومية مع ملاحظة · <b>يوم</b> = دائماً يومية · <b>أسبوع</b> = شموع أسبوعية (من الاثنين إلى الأحد) · <b>شهر</b> = شموع شهرية · <b>سنة</b> = شموع سنوية.</li><li><b>رسم المؤشر</b> في الأسفل يبقى دائماً <b>يومياً</b> – المؤشر يُحسب مرة واحدة في اليوم. لذلك لا يوجد 1د أو 5د: لن يتحرك شيء في الأسفل، وفي الأعلى سيظهر ضجيج فقط.</li><li><b>خط السعر الحالي</b> (حتى مقياس السعر، مثل TradingView): أبيض متقطّع افتراضياً. في الإعدادات ← إضافات الرسم: منقّط / متقطّع / متصل، السماكة، اللون و<b>وضع اللون أخضر/أحمر مثل TradingView</b> – أخضر عندما يكون السعر فوق افتتاح الشمعة الحالية، وأحمر عندما يكون تحته. ألوان الملصق (الوضع الثابت) تحت «الألوان».</li><li><b>مربع الاتجاه</b> بجانب المفتاح: الحركة الحالية (افتراضياً آخر 24 ساعة، أو «السعر فوق/تحت EMA» بفترة وإطار زمني 1س / 4س / يوم)، مع <b>الهدف التالي</b> (البيفوت التالي في هذا الاتجاه) و<b>أكبر تجمّع</b> باتجاه اللونغ (تحت) أو باتجاه الشورت (فوق).</li><li><b>المتوسطات</b> (EMA 50/200 في رسم السعر، SMA 20 في رسم المؤشر): باليورو تُحسب EMA مباشرة من أسعار اليورو فتكون ناعمة. التسمية واللون (ثابت / أخضر-أحمر / متدرّج) في الإعدادات؛ التمديد لكل خط على حدة (افتراضياً 5 شموع) ويتوقف عند حافة الرسم اليمنى. لمتوسط المؤشر مربع «SMA 20» خاص وزر «MA» خاص عند رسم المؤشر وإعدادات خاصة (متصل/متقطّع/منقّط، السماكة، وضع اللون).</li><li><b>العناوين</b> «أين كان الخوف وأين الطمع» و«المؤشر · متوسط 7 أيام» صفراء بإطار أسمك لتتميز عن الأزرار (اللون في الإعدادات). سحب الشريط بين الرسمين = تغيير الارتفاع.</li></ul></div><div class=\"ibox\"><h3>الإشارات في الرسم (بلا إعادة رسم)</h3><ul><li><b>النقاط:</b> قمة مرحلة قصوى (3 أيام على الأقل بعد المستوى). ممتلئة = انتهت المرحلة، مفرّغة = ما زالت جارية وقد تتحرك.</li><li><b>المثلثات:</b> ▲ تحت السعر = شراء (لونغ)، ▼ فوق السعر = بيع (شورت). مفرّغ = تأكيد المرحلة، ممتلئ = تأكيد الانعطاف، ممتلئ بحافة بيضاء = مغادرة المنطقة.</li><li><b>فلتر الاتجاه (⚠)</b> للشراء <b>والبيع</b>: ⚠ بجانب ▲ = شراء عكس اتجاه هابط (السعر تحت EMA 200، أو ADX مع تقدّم −DI، أو MACD الأسبوعي سالب). ⚠ بجانب ▼ = بيع عكس اتجاه صاعد (السعر فوق EMA 200، أو ADX مع تقدّم +DI، أو MACD الأسبوعي موجب). «تعليم» يعرض ⚠، «إخفاء» يزيل هذه الإشارات تماماً، «إيقاف» لا يفحص. الإعدادات ← الإشارات (ويمكن: شراء + بيع / شراء فقط / بيع فقط). ورسالة التنبيه تذكر «عكس الاتجاه».</li><li><b>قابلة للضبط</b> (الإعدادات ← الإشارات): المُطلِق، الإشارة من اليوم، اللمس ± نقاط، الطريقة، فلتر الاتجاه.</li><li><b>المستويات</b> 75/25 (كما في الفيديو) و85/15، واختيار سريع أيضاً 70/30 وفيبوناتشي 61.8/38.2. في VrilyaSS توجد أزرار المستويات عند رسم المؤشر، وهي تبدّل النقاط والإشارات في رسم السعر أيضاً – إذا كانت كلها متوقفة فلن تعرض «الإشارات» شيئاً (ويُذكر ذلك عند تمرير الفأرة).</li><li><b>الانحراف</b> مثل RSI في TradingView: قاع أدنى للسعر + قاع أعلى للمؤشر = <b>Bull</b>، قمة أعلى للسعر + قمة أدنى للمؤشر = <b>Bear</b>. تظهر التسمية يوم التأكيد ولا تتحرك بعدها.</li><li><b>التقييم</b> تحت «الاتجاه والتقييم»: نسبة النجاح بعد 30 يوماً وكم من القمم/القيعان الكبيرة التقطتها كل طريقة – وأيضاً لفلاتر الاتجاه ولكل نوع من إشارات خط 50. لا توجد طريقة تصيب كل شيء.</li></ul></div><div class=\"ibox\"><h3>القمم/القيعان (بأثر رجعي)</h3><p>نقاط انعطاف كبيرة للسعر تُعرف فقط <b>بعد حدوثها</b> – ليست إشارة مباشرة، بل توجيه داخل الدورة.</p><ul><li><b>طريقة العدّ:</b> تُعدّ القمة <b>قمة</b> إذا <b>هبط</b> السعر بعدها <b>X % على الأقل</b> قبل أن يصنع قمة جديدة. ويُعدّ القاع <b>قاعاً</b> إذا <b>صعد</b> السعر بعده <b>X % على الأقل</b>. الحساب بأسعار الإغلاق اليومية.</li><li><b>مستويان:</b> <b>الدورة</b> (افتراضياً 35 %) = ▲/▼ كبيرة. <b>فرعي</b> (افتراضياً 20 %) = ▲/▼ أصغر وأبهت مع «فرعي».</li><li><b>زر «القمم/القيعان»:</b> نقرة = الدورة، نقرتان = الدورة + الفرعي، ثلاث نقرات = إيقاف. نقرة يمنى = رجوع. النسب في الإعدادات ← إضافات الرسم.</li><li><b>مثال:</b> بين القاع في 21.11.2022 (15.8K) والقمة في 06.10.2025 (124.7K) لم يحدث تراجع بنسبة 35 % – الأكبر كان −28 % (يناير–أبريل 2025) و−26 % (2024). لذلك يُعدّ المسار كله صعوداً <b>واحداً</b>. قاع 05.02.2026 (62.9K) صعد بعده 30.7 % فقط – يظهر كقاع فرعي (20 %) لا عند 35 %. قمتا 14.07 و13.08.2025 هبط السعر بعدهما 6 % و12 % فقط – قمم فرعية صغيرة.</li><li>كلما صغرت القيمة زادت النقاط: منذ 2020 توجد 9 انعطافات عند 35 %، و19 عند 25 %، و31 عند 20 %، و52 عند 15 %.</li></ul></div><div class=\"ibox\"><h3>خطوط البيفوت وفيبوناتشي</h3><ul><li><b>الفترة</b>: المرئي (ما يعرضه الرسم – يُعاد حسابه فوراً مع كل تحريك وتكبير، مثل «Visible Range» في TradingView)، 7 أيام، شهر، 3 أو 6 أو 12 شهراً أو الكل. عبر <b>▾ بجانب «Pivot»</b> يمكن اختيار <b>عدة فترات معاً</b>؛ عندها يحمل كل خط فترته في التسمية وتُدمج القيم المتساوية. زر «Pivot» نفسه للتشغيل/الإيقاف فقط.</li><li><b>الحساب</b> (قائمة ▾ والإعدادات): <b>أعلى قمة وأدنى قاع في الفترة</b> (افتراضي) · <b>أدنى قاع بعد القمة</b> (للحركات الهابطة) · <b>أعلى قمة بعد القاع</b> (للحركات الصاعدة). وإن لم يوجد بعد، يُؤخذ أقصى ما في الفترة كلها.</li><li><b>العملة:</b> يُحسب بالعملة المعروضة. باليورو يُحوَّل كل يوم بسعر EUR/USD الخاص به ثم يُبحث عن القمة/القاع (حتى V15 كان البحث بالدولار ثم التحويل – فقد يكون يوم آخر أعلى باليورو). يبقى ملف V15 المنفرد بالحساب القديم للمقارنة.</li><li><b>فيبوناتشي</b> (زر «Fibo») بين قمة البيفوت وقاعه للفترة المختارة (الإعدادات: «فيبوناتشي من الفترة»، الافتراضي = أول فترة مختارة). الاتجاه مثل TradingView: الحركة الهابطة (قمة قبل قاع) تُقاس من القاع، والصاعدة (قاع قبل قمة) من القمة. المستويات تشغيل/إيقاف بلون خاص: 38.2 أحمر، 50 أبيض، 61.8 أخضر، 78.6 أزرق، 88.7 أحمر (≈ الجذر التربيعي لـ 78.6 %)، 23.6 متوقف.</li><li>ألوان خطوط البيفوت وسماكتها في الإعدادات. 🔔 على الخط = تنبيه البيفوت مفعّل لهذه الفترة.</li></ul><p><b>V17 – الخطوط على الذيل تماماً:</b> في شموع 4 ساعات وساعة و15 دقيقة باليورو كانت كل شمعة تُحوَّل بسعر اليورو <i>لليوم الحالي</i>، بينما خطوط البيفوت بسعر يومها. لذلك كان الخط بعيداً قليلاً عن الذيل (مثلاً الخط 75.5K والذيل 75.0K). الآن تُحوَّل كل شمعة بسعر <i>يومها</i> – الخط والذيل متطابقان تماماً، والنقطة على الشمعة صاحبة القيمة القصوى. بالدولار كان الحساب دقيقاً دائماً. عمود التسميات على اليمين يتسع لأطول تسمية، فلا تُقطع بعد الآن.</p></div><div class=\"ibox\"><h3>خط 50 في رسم المؤشر</h3><p>50 هو المنتصف بين الخوف والطمع. زر <b>«50»</b> عند رسم المؤشر يعرض الخط (النوع والسماكة واللون في الإعدادات) وإشاراته – برمز في رسم المؤشر وكأسهم صغيرة في رسم السعر (قابلة للإيقاف). أخضر = لونغ، أحمر = شورت.</p><ul><li><b>B · ارتداد</b>: يأتي المؤشر إلى 50 من الأعلى، يلمس المنطقة ثم يصعد مجدداً.</li><li><b>A · رفض</b>: يأتي المؤشر إلى 50 من الأسفل ثم يهبط مجدداً.</li><li><b>D↑ / D↓ · اختراق/كسر</b>: يغلق المؤشر بوضوح فوق (تحت) المنطقة حول 50.</li><li><b>R↑ / R↓ · إعادة اختبار</b>: بعد الاختراق يعود المؤشر إلى 50 خلال أيام قليلة ثم يستمر في اتجاه الاختراق.</li><li><b>F↑ · اختراق كاذب للأعلى (فخ الثيران)</b>: اختراق للأعلى، تفشل إعادة الاختبار، يعود المؤشر تحت 50 ← شورت. <b>F↓ · كسر كاذب للأسفل (فخ الدببة)</b>: العكس ← لونغ. هكذا تنشأ أنماط M وW حول 50.</li><li><b>المنطقة والتأكيد</b> منفصلان للونغ والشورت (افتراضياً 3 نقاط لكل منهما): اللمس = دخول المنطقة حول 50؛ يتأكد الارتداد/الرفض عندما يرجع المؤشر بعدها بنقاط التأكيد أو يغادر المنطقة من الجهة التي أتى منها. تُحسب إعادة الاختبار والاختراق الكاذب حتى عدد الأيام المضبوط بعد الاختراق (افتراضياً 20).</li><li>تظهر الإشارات <b>يوم التأكيد</b> ولا تتحرك. كل نوع قابل للتشغيل/الإيقاف، وله سطر خاص في مقارنة الطرق، وتنبيه عند الرغبة (المتصفح وتيليغرام).</li></ul><p><b>خطوة بخطوة</b> (مثال جهة الطمع، المؤشر فوق 50):</p><ol><li>يهبط المؤشر إلى 50 فيصبح داخل <b>المنطقة</b> (50 ± نقاط المنطقة).</li><li>إذا ارتفع بعدها بنقاط التأكيد (أو خرج من المنطقة للأعلى) ← <b>B · ارتداد</b> (لونغ). وإذا هبط بوضوح تحت المنطقة ← <b>D↓ · كسر</b> (شورت).</li><li>بعد D↓ يعود المؤشر من الأسفل إلى 50 خلال أيام إعادة الاختبار. إذا انعطف هناك للأسفل ← <b>R↓ · إعادة الاختبار صامدة</b> (شورت). وإذا صعد بوضوح فوق المنطقة ← <b>F↓ · فخ الدببة</b> (لونغ).</li><li>جهة الخوف بالطريقة نفسها معكوسة: <b>A</b> (رفض، شورت)، <b>D↑</b>، <b>R↑</b>، <b>F↑</b> (فخ الثيران، شورت).</li></ol><p><b>النتائج السابقة</b> (Binance 90 يوماً، منذ 2020، السعر بعد 30 يوماً باتجاه الإشارة):</p><ul><li>B ارتداد 7 من 13، متوسط +12.4 % · F↓ فخ الدببة 8 من 14، +7.1 % · R↑ 6 من 11، +2.5 % · A رفض 4 من 7، +1.7 % · D↑ 7 من 19، +1.2 %</li><li>D↓ 9 من 17، −4.6 % · F↑ فخ الثيران 8 من 16، −4.2 % · R↓ 3 من 10، −20.6 % (الأضعف حتى الآن)</li></ul><p class=\"muted\">الأرقام الحالية دائماً في مقارنة الطرق – تتغير مع كل يوم جديد.</p></div><div class=\"ibox\"><h3>أنماط الشموع في المناطق القصوى (زر «أنماط»)</h3><p>نمط الشموع وحده إشارة ضعيفة. مع <b>خوف أو طمع شديد</b> قد يدل على انعطاف. لذلك يُحتسب النمط فقط عندما يكون المؤشر في منطقة قصوى: <b>الأنماط الصاعدة</b> (لونغ) عند ≤ 30، و<b>الأنماط الهابطة</b> (شورت) عند ≥ 70 – في يوم الشمعة أو حتى 3 أيام قبله. كل شيء قابل للضبط في الترس.</p><ul><li><b>H · المطرقة</b> (صاعد): جسم صغير في الأعلى، ذيل سفلي طويل (ضعف الجسم على الأقل)، تقريباً بلا ذيل علوي.</li><li><b>iH · المطرقة المقلوبة</b>: جسم صغير في الأسفل وذيل علوي طويل.</li><li><b>E↑ · الابتلاع الصاعد</b>: شمعة خضراء يغطي جسمها جسم شمعة الأمس الحمراء بالكامل.</li><li><b>PL · خط الاختراق</b>: بعد شمعة حمراء كبيرة تغلق شمعة خضراء فوق منتصف جسمها.</li><li><b>MS · نجمة الصباح</b>: شمعة حمراء كبيرة، ثم صغيرة، ثم خضراء تغلق فوق منتصف الأولى.</li><li>الهابطة معكوسة: <b>SS · الشهاب</b>، <b>HM · الرجل المشنوق</b>، <b>E↓ · الابتلاع الهابط</b>، <b>DC · الغطاء السحابي المظلم</b>، <b>ES · نجمة المساء</b>.</li></ul><p><b>في الرسم:</b> زر «أنماط» (في مربع الإشارات). الرمز داخل مربع تحت الشمعة (لونغ، أخضر) أو فوقها (شورت، أحمر)؛ تمرير الفأرة يُظهر الاسم الكامل. <b>⚠</b> = عكس الاتجاه (نفس فلتر الاتجاه كما في الإشارات). الرقم على الزر = عدد الأنماط في الفترة الظاهرة.</p><p><b>بلا إعادة رسم:</b> تُحتسب فقط <b>الشموع اليومية المغلقة</b> – يظهر النمط بعد إغلاق اليوم (00:00 UTC) ولا يتحرك بعدها. التأكيد: الشمعة التالية تغلق فوق قمة (لونغ) أو تحت قاع (شورت) شمعة النموذج – وهذا مذكور في التنبيه أيضاً.</p><p><b>الإعدادات</b> (الترس ← إضافات الرسم والاتجاه والإطارات ← أنماط الشموع في المناطق القصوى): أي مؤشر يُحتسب (<i>مؤشرنا</i> · <i>الرسمي</i> · <i>كلاهما</i> · <i>أحدهما يكفي</i>)، حد الخوف (30)، حد الطمع (70)، أيام سابقة (3)، وكل نمط تشغيل/إيقاف. <b>التنبيه:</b> تنبيه خاص «نمط شموع» في المتصفح (صوت الأجراس) وعبر تيليغرام.</p><p><b>النتائج السابقة</b> (شموع يومية منذ 2020، السعر بعد 30 يوماً باتجاه الإشارة):</p><ul><li><b>مؤشرنا:</b> المطرقة 15 من 23، متوسط +2.7 % · الابتلاع الصاعد 12 من 23، −0.8 % · المطرقة المقلوبة 2 من 4 · خط الاختراق 3 من 7، −8.1 % · نجمة الصباح 2 من 5، −2.5 %. للمقارنة: الشراء في <i>كل</i> يوم بمؤشر ≤ 30 = متوسط −3.7 % – أي أن المطرقة كانت أفضل بوضوح.</li><li><b>المؤشر الرسمي</b> (متوسط 7 أيام): الابتلاع الصاعد 57 من 99، +4.1 % · المطرقة المقلوبة 12 من 21، +3.2 % · المطرقة 48 من 94، +1.3 % (كل يوم ≤ 30: +1.3 %).</li><li><b>الأنماط الهابطة في الطمع</b> فشلت غالباً حتى الآن (مثلاً الشهاب 13 من 32، الرجل المشنوق 3 من 11) – في مراحل الطمع استمر البيتكوين غالباً بالصعود. لذلك فقط مع تأكيد ومخاطرة صغيرة.</li></ul><p class=\"muted\">الأرقام الحالية لكل نمط في «مقارنة الطرق (اختبار رجعي)». سيناريوهات، ليست نصيحة استثمارية.</p></div><div class=\"ibox\"><h3>خريطة التصفيات – كيف تُقدَّر</h3><ul><li>الخريطة <b>تقدير خاص</b> وليست قائمة مراكز حقيقية: إذا ارتفعت <b>الفائدة المفتوحة</b> في ساعة ما، فقد فُتحت مراكز جديدة. تُقسَّم إلى لونغ وشورت حسب نسبة المشترين في تلك الساعة، وتُوزَّع على رافعات شائعة (5×، 10×، 25×، 50×، 100× بنسب 10 / 30 / 30 / 20 / 10 %). ومن ذلك ينتج سعر تصفية لكل جزء (عند 10× نحو 10 % من سعر الدخول).</li><li>إذا وصل السعر إلى مستوى ما يُعدّ مُصفّى ويُحذف. وإذا انخفضت الفائدة المفتوحة تصغر كل المستويات المفتوحة بالتناسب. تُستخدم آخر 500 ساعة (≈ 21 يوماً).</li><li><b>المصدر قابل للاختيار</b> (▾ بجانب «الخريطة»، بعلامات): <b>Binance</b> و<b>Bybit</b> و<b>OKX</b> بأي تركيبة، مثلاً Binance + Bybit فقط. مسار السعر ونسبة المشترين من Binance دائماً (سعر BTC متقارب في كل مكان)، والفائدة المفتوحة من البورصة المختارة. الاختيار يسري أيضاً على خطوط التجمّعات والشريط والتنبيهات.</li><li><b>L1/S1</b> = أقوى تجمّع (★)، <b>L2/S2</b> = الأقرب، <b>LF/SF</b> = أبعد تجمّع قوي، <b>L3…</b> = أخرى؛ الاسم داخل مربع في بداية الخط. <b>زر «التجمّعات L/S»</b>: الكل ← الأقرب فقط ← الأقوى فقط ← الأبعد فقط ← إيقاف. <b>🔔 الخط الذهبي</b> = مستوى التنبيه، <b>M</b> = المنتصف بين L1 وS1، <b>خطوط التنبيه الخاصة</b> (A1 …) قابلة للسحب.</li><li><b>للمقارنة</b> (نماذج أخرى ونتائج أخرى): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>مصادر أخرى للخريطة – ما الممكن وما غير الممكن</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: يعرض هو أيضاً <b>تقديراً</b> (عدة نماذج، بورصات كثيرة). لا توجد واجهة عامة ولا تنزيل للبيانات – لذلك كرابط فقط.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\" // automatische Ticker-Größen (grau im leeren Feld)
function tksAuto(k) {
  const px = (el, p) => { if (!el) return ''; const v = parseFloat(getComputedStyle(el)[p]); return isFinite(v) ? Math.round(v) : ''; };
  const sm = document.querySelector('#arrTick small');
  return 'auto ' + ({ lbl: px(sm, 'fontSize'), lt: px(sm, 'marginTop'), arr: px($('tDir'), 'fontSize'), pct: px($('tDayPct'), 'fontSize'), pb: px($('arrDay'), 'paddingBottom'), ls: px($('liqL')?.closest('.sd'), 'fontSize'), lsp: px($('pL')?.parentElement, 'fontSize'), sq: px($('segbar'), 'height') }[k] ?? '');
}
$('x12Set').addEventListener('change', e => {
  if (e.target.id === 'xPvB') { X12.fibPer = e.target.value; saveX12(); return; }
  if (e.target.id === 'xPvL') { X12.pvMode = e.target.value; saveX12(); if (SRV) api('/api/config', { pivot: { ...PVA, low: X12.pvMode } }).catch(() => { }); return; }
  if (e.target.tagName === 'SELECT' && e.target.dataset.ma) { const k = e.target.dataset.ma; MA[k] = { ...MA[k], type: e.target.value }; store.set('fg13_ma', JSON.stringify(MA)); SCACHE = {}; rerender(); } });
$('x12Set').addEventListener('input', e => {
  const id = e.target.id, v = +e.target.value;
  if (id === 'xExt' && v >= 10 && v <= 80) { X12.extPct = v; saveX12(); }
  if (id === 'xExt2' && v >= 5 && v <= 60) { X12.extPct2 = v; saveX12(); }
  if (id === 'maiW' && v >= 0.5 && v <= 5) { MAI.w = v; saveMai(); }
  if (id === 'maiUp' || id === 'maiDn') { MAI[id === 'maiUp' ? 'cUp' : 'cDn'] = e.target.value; saveMai(); }
  if (id === 'f50W' && v >= 0.5 && v <= 5) { F50.w = v; saveF50(); }
  if (id === 'f50C') { F50.c = e.target.value; saveF50(); }
  for (const [fid, key, lo, hi] of [['f50zL', 'zoneL', .5, 15], ['f50cL', 'confL', .5, 15], ['f50zS', 'zoneS', .5, 15], ['f50cS', 'confS', .5, 15], ['f50R', 'retestDays', 3, 60]]) if (id === fid && v >= lo && v <= hi) { F50[key] = v; saveF50(); }
  const fk = e.target.dataset.fib, ff = e.target.dataset.ff;
  if (fk != null && ff === 'v' && v > 0 && v < 100) { FIBS[+fk].v = v; saveFibs(); }
  if (fk != null && ff === 'c') { FIBS[+fk].c = e.target.value; saveFibs(); }
  if (id === 'plW' && v >= 0.5 && v <= 5) { PL.w = v; store.set('fg15_pl', JSON.stringify(PL)); rerender(); }
  if (id === 'plC' || id === 'plUp' || id === 'plDn') { PL[{ plC: 'c', plUp: 'cUp', plDn: 'cDn' }[id]] = e.target.value; store.set('fg15_pl', JSON.stringify(PL)); rerender(); }
  if (id === 'dirEmaN' && v >= 5 && v <= 400) { DIRC.emaN = Math.round(v); saveDir(); }
  if (id === 'frCc') { FRAME.cc = e.target.value; store.set('fg12_frame', JSON.stringify(FRAME)); applyFrame(); }
  if (id === 'xPvW' && v >= 0.5 && v <= 6) { X12.pvW = v; saveX12(); }
  if (id === 'frSg') { FRAME.sg = e.target.value; store.set('fg12_frame', JSON.stringify(FRAME)); applyFrame(); }
  if (id === 'malUp' || id === 'malDn') { MAL[id === 'malUp' ? 'cUp' : 'cDn'] = e.target.value; saveMal(); }
  if (id === 'malExt' && v >= 0 && v <= 50) { MAL.ext = Math.round(v); saveMal(); }
  if (id === 'xTend' && v >= 7 && v <= 120) { X12.tendN = Math.round(v); saveX12(); }
  if (id === 'frColor') { FRAME.color = e.target.value; store.set('fg12_frame', JSON.stringify(FRAME)); applyFrame(); }
  if (id === 'frW' && v >= 1 && v <= 4) { FRAME.w = Math.round(v); store.set('fg12_frame', JSON.stringify(FRAME)); applyFrame(); }
  if (id === 'frHc' || id === 'frHt') { FRAME[id === 'frHc' ? 'hc' : 'ht'] = e.target.value; store.set('fg12_frame', JSON.stringify(FRAME)); applyFrame(); }
  if (id === 'xFib') { FIBL = e.target.value; store.set('fg13_fib', FIBL); rerender(); }
  if (id === 'xOdds' && v >= 24 && v <= 64) { ODDSF = v; store.set('fg13_oddsF', v); document.documentElement.style.setProperty('--oddsF', VSTYLE === 'vss' ? v + 'px' : '58px'); }
  if (id === 'xTz' && v >= 0.4 && v <= 8) { TZ = v; store.set('fg13_tz', v); applyTicker(); }
  if (id === 'xTr' && v >= 0.6 && v <= 2.5) { TR = v; store.set('fg13_tr', v); applyTicker(); }
  // V17: Ticker-Größen (leer = automatisch), Doppelklick-Größe, „Was das jetzt heißt“, Kerzenmuster
  const tk = e.target.dataset.tks;
  if (tk) { const f = TKS_F.find(x => x[0] === tk); if (e.target.value === '') { delete TKS[tk]; saveTks(); } else if (f && v >= f[1] && v <= f[2]) { TKS[tk] = v; saveTks(); } }
  if (id === 'tkTz0' && v >= 40 && v <= 400) { TKS.tz0 = v / 100; saveTks(); }
  if (id === 'actFA' && v >= 12 && v <= 40) { ACT.fA = v; saveAct(); }
  if (id === 'actFTl' && v >= 8 && v <= 30) { ACT.fTl = v; saveAct(); }
  if (id === 'actFTv' && v >= 10 && v <= 40) { ACT.fTv = v; saveAct(); }
  if (id === 'cdlLo' && v >= 1 && v <= 50) { CDL.lo = Math.round(v); saveCdl(); }
  if (id === 'cdlHi' && v >= 50 && v <= 99) { CDL.hi = Math.round(v); saveCdl(); }
  if (id === 'cdlLook' && v >= 0 && v <= 14 && e.target.value !== '') { CDL.look = Math.round(v); saveCdl(); }
  if (id === 'lslSize' && v >= 8 && v <= 20) { LSL.size = v; store.set('fg13_lsl', JSON.stringify(LSL)); rerender(); }
  if (id === 'lslL' || id === 'lslS') { LSL[id === 'lslL' ? 'cL' : 'cS'] = e.target.value; store.set('fg13_lsl', JSON.stringify(LSL)); rerender(); }
  const mk = e.target.dataset.ma, mf = e.target.dataset.f;
  if (mk && mf && mf !== 'on') { MA[mk] = { ...MA[mk], [mf]: mf === 'n' ? Math.max(2, Math.round(v) || 2) : mf === 'ext' ? clamp(Math.round(v) || 0, 0, 50) : e.target.value }; store.set('fg13_ma', JSON.stringify(MA)); SCACHE = {}; rerender(); }
});

    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" style="filter:drop-shadow(0 0 3px ${rgba(c, .6)})"/></svg>

function compText(c) { // Hauptwert + Zusatz je Baustein
  const liq = D.liq24?.[MODE];
  switch (c.id) {
    case 'funding': return [sgn(c.raw, 4) + ' %', t('x_funding')];
    case 'oi': return [sgn(c.raw, 1) + ' %', t('x_oi')];
    case 'ls': return [fmt(c.raw, 2), t('x_ls_' + MODE)];
    case 'liq': return liq && liq.L + liq.S >= 2e6 ? [`${fmt(liq.L / 1e6, 0)} / ${fmt(liq.S / 1e6, 0)} ${LANG === 'de' ? 'Mio. $' : 'M $'}`, t('x_liq')] : [t('collecting'), t('x_liq')];
    case 'rsi': return ['RSI ' + fmt(c.raw, 0), t('x_rsi', { a: fmt(c.atr, 1) })];
    case 'etf': return c.raw == null ? [t('noKey'), t('x_etf')] : [sgn(c.raw, 0) + (LANG === 'de' ? ' Mio. $' : ' M $'), t('x_etf')];
    case 'stable': return [sgn(c.raw, 1) + ' %', t('x_stable')];
    case 'cbp': return [sgn(c.raw, 3) + ' %', t('x_cbp')];
    case 'vix': return [fmt(c.level, 1), t('x_vix')];

}

      <div class="tr"><span>${t('t30')}</span><b>${tarrow(r.t30)} ${r.t30 == null ? '' : tword(r.t30)}</b></div>
      <div class="verdict" style="color:${vc};background:${vb}">${r.z ? t(verdictKey + r.z) + t('trendAdd_' + tendKey(r.t7)) : '–'}</div>
      <div class="why">${t(whyKey)}</div></div>`;
  };
  $('tcols').innerHTML = box(sm, t('tSM', { m: MODE === 'multi' ? 'Multi-Source' : 'Binance' }), 'act_', 'ourWhy') + box(of, t('tOff', { s: of.name }), 'tb_', 'tbWhy');
  $('overall').innerHTML = combText(sm, of) + ' ' + overallText(sm, of);
  const cp = combParts(sm, of);
  // V17: Nummern 1 / 2 / 3 (3 = aus 1 und 2 kombiniert), Urteile in einer Spalte genau untereinander
  $('csum').innerHTML = `<div class="ehead">${t('eHead')}</div><div class="egrid">
    <div class="erow"><span><b class="enum">1</b>${t('eSM', { v: sm.v ?? '–', z: sm.z ? t(sm.z) : '–', t: tword(sm.t7) })}</span><span>→ <b>${sm.z ? t('act_' + sm.z) : '–'}</b></span></div>
    <div class="erow"><span><b class="enum">2</b>${t('eOff', { s: of.name, o: of.v ?? '–', oz: of.z ? t(of.z) : '–', ot: tword(of.t7) })} · ${t('eTb')}</span><span>→ <b>${of.z ? t('tb_' + of.z) : '–'}</b></span></div>
    ${cp ? `<div class="erow"><span><b class="enum">3</b>${t('eComb')}</span><span>→ <b>${cp.c}</b>${cp.x}</span></div>` : ''}</div>
    <div class="erest">${overallText(sm, of)}${liqShort() ? ' ' + liqShort() : ''}</div>`;
}
// ③ kombiniert: Smart Money (Zone wie im Video) und offizieller Index nach Lehrbuch, Gewichtung im Zahnrad (Standard 2:1)
const ZSCORE = { xfear: 2, fear: 1, neutral: 0, greed: -1, xgreed: -2 };
function combParts(sm, of) {
  if (!sm.z || !of.z) return null;
  const w = +store.get('fg11_cw', '2') || 2, a = ZSCORE[sm.z], b = ZSCORE[of.z], c = (w * a + b) / (w + 1);
  const k = c >= 1.4 ? 'c_buy' : c >= 0.6 ? 'c_tranche' : c > -0.6 ? 'c_wait' : c > -1.4 ? 'c_hold' : 'c_sell';
  return { c: t(k), x: a * b < 0 ? t('c_conflict') : a === b && a !== 0 ? t('c_agree') : '' };
}
function combText(sm, of) {
  if (!sm.z || !of.z) return '';
  const w = +store.get('fg11_cw', '2') || 2, a = ZSCORE[sm.z], b = ZSCORE[of.z], c = (w * a + b) / (w + 1);
  const k = c >= 1.4 ? 'c_buy' : c >= 0.6 ? 'c_tranche' : c > -0.6 ? 'c_wait' : c > -1.4 ? 'c_hold' : 'c_sell';
  const add = a * b < 0 ? t('c_conflict') : a === b && a !== 0 ? t('c_agree') : '';
  return t('sumComb', { c: t(k), x: add, w });
}
function overallText(sm, of) {
  if (sm.v == null || of.v == null) return '';
  const fearish = z => z === 'fear' || z === 'xfear', greedy = z => z === 'greed' || z === 'xgreed', d = sm.v - of.v;
  let s = fearish(sm.z) && fearish(of.z) ? t('sum_both_buy') + ' ' : greedy(sm.z) && greedy(of.z) ? t('sum_both_sell') + ' ' : '';
  s += Math.abs(d) >= 10 ? t(d < 0 ? 'sum_sm_lower' : 'sum_sm_higher', { d: Math.abs(d) }) : t('sum_close', { d: Math.abs(d) });
  return s;
}
function renderCompare() {
  const rows = indexRows();
  let h = `<tr><th>${t('cName')}</th><th class="r">${t('cVal')}</th><th>${t('cZoneH')}</th><th class="r">${t('cT7')}</th><th class="r">${t('cT30')}</th><th>${t('cVerdict')}</th></tr>`;
  for (const r of rows) {
    if (!r.own && r.v == null && r.k !== 'coinglass') continue;
    const c = color(r.v), [vc] = VC[r.z] || ['var(--dim)'];
    const sel = !r.own && r.k === OFFSRC, pick = !r.own && r.v != null;
    h += `<tr class="${sel ? 'sel ' : ''}${pick ? 'pick' : ''}" ${pick ? `data-off="${r.k}"` : ''}><td><b>${r.name}</b>${r.own ? `<span class="badge2">${t('ownBadge')}</span>` : sel ? `<span class="badge2" style="color:var(--teal);border-color:#2a6b62">${t('chipOffSrc')}</span>` : ''}</td>
      <td class="r pts" style="color:${r.v == null ? 'var(--dim)' : c}">${r.v ?? '–'}</td>
      <td>${r.v == null ? `<span class="flat">${t('cgOnlyKey')}</span>` : `<span class="zp" style="color:${c};background:${rgba(c, .14)}">${t(r.z)}</span>`}</td>
      <td class="r d7">${tarrow(r.t7)}</td><td class="r d7">${tarrow(r.t30)}</td>
      <td style="color:${vc};font-weight:700">${r.z ? t((r.own ? 'act_' : 'tb_') + r.z) : '–'}</td></tr>`;
  }
  // CoinAnk: nur auf ihrer Webseite (automatische Abfragen gesperrt)
  h += `<tr><td><b>CoinAnk</b></td><td class="r pts flat">–</td><td><span class="flat">${t('onlySite')}</span></td><td></td><td></td><td><a class="btn sm" href="https://coinank.com/indexdata/fearGreed" target="_blank" rel="noopener">${t('openSite')} ↗</a></td></tr>`;
  $('cTable').innerHTML = h;
  $('cTable').querySelectorAll('tr[data-off]').forEach(tr => tr.onclick = () => setOff(tr.dataset.off));
}

/* ================= Tooltip für Quellen ================= */
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]'), tip = $('tip');
  if (!el || !D) { tip.style.display = 'none'; return; }
  const k = el.dataset.tip, m = M(); let html = '';
  if (k.startsWith('comp:')) {
    const c = m.components.find(x => x.id === k.slice(5)), [v, x] = compText(c);
    html = `<b>${t('n_' + c.id)}</b><div style="color:var(--muted)">${v} · ${x}</div><div style="margin-top:6px">` +
      (c.sources.length ? c.sources.map(s => `<div class="r"><span>${s.name}</span><span>${srcVal(c.id, s.value)}</span></div>`).join('') : `<div class="r"><span>${t('noData')}</span><span></span></div>`) +
      `</div><div class="m">${MODE === 'multi' ? t('tipMulti', { n: c.sources.length }) : t('tipBin')} · ${t('tipPts', { p: c.score ?? '–' })}</div>`;
  } else if (k === 'poly') html = `<b>Polymarket</b><div class="m">${t('tipPoly', { d: D.poly?.end ? dmy(new Date(Date.parse(D.poly.end) - 432e5).toISOString().slice(0, 10)) : '–' })}</div><div class="r" style="margin-top:6px"><span>Quelle</span><span>gamma-api.polymarket.com</span></div>`;
  else if (k === 'win') html = `<b>${t('winSet')}</b><div class="m">${t('tipWin')}</div>`;
  else if (k === 'mode') html = `<b>${t('tipModeH')}</b><div class="m">${t('tipMode')}</div>`;
  else if (k === 'cur') html = `<b>${t('tipCurH')}</b><div class="m">${t('tipCur')}</div>`;
  else if (k === 'ownzone') html = `<b>${t('zoneRow', { z: t(zoneOf(m.index ?? 50).k) })}</b><div class="m">${t('tipZone', { s: m.backtest1 ? monthYear(m.backtest1.since) : '–', z: t(zoneOf(m.index ?? 50).k) })}</div>`;
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 10) + 'px'; tip.style.top = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 10) + 'px';
});

/* ================= Live-Preis (Binance) ================= */
function livePrice() {
  let ws;
  try { ws = new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@ticker/eurusdt@ticker'); } catch { return; }
  let last = 0;
  ws.onmessage = e => {
    const j = JSON.parse(e.data), m = j.data;
    if (j.stream === 'eurusdt@ticker') { LIVE.eur = +m.c; return; }
    const p = +m.c;
    LIVE.dir = LIVE.price ? Math.sign(p - LIVE.price) || LIVE.dir : 0; LIVE.price = p; LIVE.ch = +m.P;
    if (D && Date.now() - last > 1000) { last = Date.now(); renderHeader(); renderTicker(); checkLineBrowser(); if (Date.now() - (checkPivotBrowser.t || 0) > 10000) { checkPivotBrowser.t = Date.now(); checkPivotBrowser(); } if (Date.now() - (checkReactBrowser.t || 0) > 5000) { checkReactBrowser.t = Date.now(); checkReactBrowser(); } if (Date.now() - (checkHeatBrowser.t || 0) > 30000) { checkHeatBrowser.t = Date.now(); checkHeatBrowser(); } }
  };
  ws.onclose = () => setTimeout(livePrice, 5000);
}
// Einzeldatei: Liquidationen live im Browser sammeln (seit dem Öffnen)
const BLIQ = { binance: { L: 0, S: 0 }, multi: { L: 0, S: 0 } };
function liveLiquidations() {
  const add = (bin, isLong, v) => { if (!(v > 0)) return; const k = isLong ? 'L' : 'S'; if (bin) BLIQ.binance[k] += v; BLIQ.multi[k] += v; };
  const ws = (url, sub, fn) => { try { const w = new WebSocket(url); w.onopen = () => sub && w.send(JSON.stringify(sub)); w.onmessage = e => { try { fn(JSON.parse(e.data)); } catch { } }; w.onclose = () => setTimeout(() => ws(url, sub, fn), 5000); } catch { } };
  ws('wss://fstream.binance.com/market/stream?streams=!forceOrder@arr', null, m => { const o = m.data?.o; if (o) add(true, o.S === 'SELL', +o.z * +o.ap); });
  ws('wss://stream.bybit.com/v5/public/linear', { op: 'subscribe', args: ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'DOGEUSDT'].map(s => 'allLiquidation.' + s) }, m => { for (const x of m.data || []) add(false, x.S === 'Buy', +x.v * +x.p); });
  setInterval(() => { if (D && STANDALONE) { D.liq24 = JSON.parse(JSON.stringify(BLIQ)); renderTicker(); } }, 3000);
}

async function loadOnline() {
  const [a, b] = await Promise.all([fetch('data/latest.json?' + Date.now()), fetch('data/history.json?' + Date.now())]);
  if (!a.ok || !b.ok) throw new Error('keine Online-Daten');
  D = await a.json(); H = await b.json(); applyHeatSrc();
}
async function loadStandalone() {
  STANDALONE = true;
  $('loadTxt').textContent = t('loadingLocal');
  const { result } = await window.FG_ENGINE.collect({ env: 'browser', state: {}, liqOverride: JSON.parse(JSON.stringify(BLIQ)) });
  H = result.history; D = result; applyHeatSrc();
}
let lastLoad = 0;
async function load(first) {
  lastLoad = Date.now();
  try {
    if (window.FG_STANDALONE) {
      if (!window.FG_ENGINE) await new Promise(r => window.addEventListener('fg-engine', r, { once: true }));
      if (first) liveLiquidations();
      await loadStandalone();

    if (first) $('loadTxt').textContent = t('loadErr') + ' ' + (e?.message || '');

}
applyTexts();

setInterval(() => { if (Date.now() - lastLoad > (window.FG_STANDALONE ? 600000 : SRV ? Math.max(1, SRV.intervals?.data || 1) * 60000 - 5000 : 115000)) load(false); }, 15000);
