<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Money Fear & Greed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d65ac9' stroke-width='5' stroke-dasharray='50 90' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0610; --panel:#160b1b; --panel2:#1c0f24; --line:#2a1b33; --line2:#3a2747;
    --text:#f4eef8; --muted:#a397ae; --dim:#6f6479; --track:#2a1c33;
    --pink:#d65ac9; --teal:#3fd6c3; --green:#33d39a; --red:#f0566e; --gold:#f6b860;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;
    padding:18px 16px 110px;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  .page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  /* ---------- Kopfzeile ---------- */
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:24px;letter-spacing:.01em;margin-right:auto}
  .hprice{display:flex;align-items:center;gap:12px}
  .hprice b{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .chg{border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
  .chg.neg{background:rgba(240,86,110,.15);color:#ff7d90}
  .chg.pos{background:rgba(51,211,154,.14);color:#4fe0aa}
  .whyBtn{background:rgba(246,184,96,.06);border:1px solid #7a5a2c;color:var(--gold);font-weight:700;font-size:15px;padding:11px 18px;border-radius:13px}
  .seg{display:inline-flex;background:#130a18;border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px}
  .seg button{background:none;border:1px solid transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 13px;border-radius:9px;white-space:nowrap}
  .seg button.on{background:#2a1a20;border-color:#7a5a2c;color:var(--gold)}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#130a18;color:var(--muted);display:grid;place-items:center}
  .iconbtn:hover{color:var(--text)}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;position:relative}
  .main{overflow:hidden;padding:26px 30px 26px;
    background:radial-gradient(ellipse 55% 55% at 50% 52%,#3a1840 0%,#24102b 40%,#160b1b 78%)}
  .badge{display:table;margin:0 auto;border:1px solid #6a4b26;background:rgba(246,184,96,.05);color:var(--gold);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800;letter-spacing:.06em}
  .badge::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:1px}
  .h1{text-align:center;font-size:40px;font-weight:800;letter-spacing:-.01em;margin-top:18px}
  .h1sub{text-align:center;color:var(--muted);font-size:17px;margin-top:6px}
  .grid{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;z-index:1;margin-top:34px}
  .col h3{font-size:13px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-bottom:12px}
  .col.left h3{text-align:right;padding-right:84px}
  .col.right h3{padding-left:84px}
  .item{display:flex;align-items:center;gap:14px;height:72px;cursor:help}
  .col.left .item{justify-content:flex-end}
  .col.left .txt{text-align:right}
  .txt{min-width:0}
  .txt .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .txt .val{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .gauge{position:relative;width:60px;height:60px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .gauge .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .center{position:relative;width:300px;height:300px;justify-self:center}
  .center svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
  .center .inner{position:absolute;inset:36px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#1d0f24,#0c060f 72%);
    box-shadow:0 0 0 1px #3a2447,0 24px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .center .lbl{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .center .big{font-size:110px;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.03em}
  .center .zone{font-size:22px;font-weight:800}
  .center .sub{font-size:13px;color:var(--dim);margin-top:6px}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite 1.5s}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.985)}50%{opacity:.75;transform:scale(1.03)}}
  .glowArc{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
  #wires .flow{stroke-dasharray:7 70;animation:flow 2.8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-77}}

  .scale{position:relative;margin:58px 6px 0;height:52px}
  .segs{display:flex;gap:6px;height:12px;position:absolute;left:0;right:0;top:20px}
  .segs div{border-radius:6px;height:100%}
  .mk{position:absolute;transform:translateX(-50%);transition:left .8s}
  .mk.cur{top:8px;width:5px;height:36px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #160b1b}
  .mk.off{top:10px;width:4px;height:32px;border-radius:2px;background:var(--teal);box-shadow:0 0 10px rgba(63,214,195,.6)}
  .mlabel{position:absolute;transform:translateX(-50%);font-weight:800;font-size:14px;white-space:nowrap;transition:left .8s}
  .mlabel.cur{top:-16px}
  .mlabel.off{top:46px;color:var(--teal)}
  .zones{display:flex;margin:22px 6px 0;font-size:14px;color:var(--dim)}
  .zones span{text-align:center}
  .zones span.on{font-weight:800}
  .chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#1a0e20;border-radius:999px;padding:9px 16px;color:var(--muted);font-size:15px}
  .chip b{color:var(--text);font-weight:800}
  .chip i{width:9px;height:9px;border-radius:50%}
  .past{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .pcard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a0e21;border:1px solid var(--line2);border-radius:14px;padding:13px 16px}
  .pcard b{display:block;font-size:15px}
  .pcard span{font-size:13px;color:var(--muted)}
  .pcard .gauge{width:46px;height:46px}
  .pcard .gauge .num{font-size:13px}

  /* ---------- rechte Spalte ---------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .side .card{padding:22px 24px}
  .h{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .h small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim);white-space:nowrap}
  .osub{color:var(--muted);font-size:15px;line-height:1.4;margin-top:6px}
  .odds{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .odds .lab{font-size:15px;color:var(--muted)}
  .odds .big{font-size:58px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .odds .r{text-align:right}
  .obar{position:relative;height:12px;border-radius:7px;margin-top:10px;background:linear-gradient(90deg,#1da877 0%,#3fe0a5 var(--p),#e0507a var(--p),#c9416f 100%)}
  .obar i{position:absolute;top:-6px;width:3px;height:24px;border-radius:2px;background:#fff;transform:translateX(-50%);left:var(--p)}
  .inf .h{margin-top:20px}
  .inf .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:12px 15px;margin-top:9px;font-size:15px;color:var(--muted);cursor:help}
  .inf .row b{color:var(--text);font-weight:800;text-align:right;white-space:nowrap}
  .action{display:inline-flex;align-items:center;gap:14px;margin:18px 0 16px;border-radius:16px;padding:14px 26px 14px 20px;font-size:30px;font-weight:800;color:#1a0b1c;box-shadow:0 10px 30px rgba(214,90,201,.25)}
  .action i{width:14px;height:14px;border-radius:50%;background:#1a0b1c}
  .bt{font-size:16px;line-height:1.55;color:#cfc4d9}
  .bt b{color:var(--text)}
  .zl{margin-top:16px;display:flex;flex-direction:column;gap:4px}
  .zl div{display:grid;grid-template-columns:84px 1fr;align-items:center;padding:11px 15px;border-radius:12px;border:1px solid transparent;font-size:15px;color:var(--muted)}
  .zl div b{font-weight:800}
  .zl div.on{border-color:#6b4a83;background:#22122b;color:var(--text);font-weight:700}
  .note{font-size:14px;line-height:1.55;color:var(--dim);margin-top:14px}
  .note b{color:#d7cce0}

  /* ---------- Chart ---------- */
  .chart{padding:24px 26px 18px}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .ctitle{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend .ln{width:16px;height:3px;border-radius:2px;background:#fff}
  .legend .gr{width:18px;height:10px;border-radius:3px;background:linear-gradient(90deg,#8b6cff,#d65ac9,#f0566e,#f3843c,#f6cf5c)}
  .legend .dt{width:9px;height:9px;border-radius:50%}
  .ctools{display:flex;gap:10px;flex-wrap:wrap}
  .tog{background:#130a18;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:15px;padding:10px 16px;border-radius:13px}
  .tog.on{border-color:#7a5a2c;color:var(--gold);background:rgba(246,184,96,.05)}
  .rangeRow{margin-top:16px}
  .cwrap{position:relative;margin-top:10px;user-select:none}
  .csvg{width:100%;display:block}
  #priceChart{height:360px;cursor:crosshair}
  #idxChart{height:200px;cursor:crosshair}
  .clabel{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;margin:2px 0 0}
  .axisHint{position:absolute;right:4px;top:4px;font-size:11px;color:var(--dim)}
  .tt{position:fixed;pointer-events:none;z-index:50;background:#1d1026f2;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.6;min-width:170px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .tt .r{display:flex;justify-content:space-between;gap:14px}
  .tt .r span:first-child{color:var(--muted)}

  /* ---------- Tabellen ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
  .duo>*,.hero>*{min-width:0}
  .tcard{padding:22px 24px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{font-size:12px;letter-spacing:.1em;color:var(--dim);font-weight:700;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:0 6px;height:62px;border-bottom:1px solid #22142b;font-size:16px;white-space:nowrap}
  th.r,td.r{text-align:right}
  .bname{font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .bval b{font-weight:700}
  .bval small{color:var(--dim);font-size:14px;margin-left:6px}
  .bbar{width:140px;height:7px;border-radius:4px;background:#2a1c33;overflow:hidden}
  .bbar i{display:block;height:100%;border-radius:4px}
  .pts{font-weight:800;font-size:18px}
  .d7{font-weight:700;font-size:14px}
  tr.hov:hover td{background:#1d1026}
  .tl{position:relative;width:40px;height:62px}
  .tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--lc,#c45bd6)}
  .tl i{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:var(--dc);box-shadow:0 0 0 4px #160b1b}
  .zp{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
  .zp::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .sub2{display:block;font-size:13px;color:var(--dim);margin-top:2px}
  .btc b{display:block;font-weight:800}
  .btc small{font-size:13px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--dim)}
  .tabs{display:flex;gap:14px;align-items:baseline}
  .tabs button{background:none;border:0;color:var(--dim);font-size:13px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;padding:0}
  .tabs button.on{color:var(--muted)}

  .foot{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:15px;padding:4px 4px 0}
  .foot .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--green)}
  .foot .na{color:var(--dim)}
  .foot a{text-decoration:underline;cursor:pointer}

  /* ---------- Ticker ---------- */
  .ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:auto auto 1fr;background:#0a1613;border-top:1px solid #1d3a33;font-weight:800}
  .ticker>div{padding:9px 18px;display:flex;align-items:center}
  .price{font-size:32px;color:#eef8f4;gap:10px;letter-spacing:-.01em}
  .price .b{color:#f7a531;font-size:22px}
  .price .dir{font-size:16px}
  .liqtitle{border-left:1px solid #1d3a33;border-right:1px solid #1d3a33;letter-spacing:.08em;font-size:18px;color:#e6efe9}
  .liq{flex-direction:column;align-items:stretch!important;gap:4px}
  .liq .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .liq .sd{display:flex;align-items:baseline;gap:8px;font-size:27px}
  .liq small{font-size:9px;color:#9fb5ad;letter-spacing:.14em}
  .liq .l{color:#5ee0b0} .liq .s{color:#ff7a68}
  .vs{width:26px;height:26px;border-radius:50%;border:1px solid #2b4a42;display:grid;place-items:center;font-size:9px;color:#9fb5ad}
  .segbar{display:flex;gap:3px;height:9px}
  .segbar i{flex:1;border-radius:2px}
  .pcts{display:flex;justify-content:space-between;font-size:9px;color:#9fb5ad}

  /* ---------- Tooltip, Dialoge, Laden ---------- */
  .tip{position:fixed;z-index:60;pointer-events:none;max-width:340px;background:#1d1026f7;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;display:none;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .tip b{font-size:14px}
  .tip .r{display:flex;justify-content:space-between;gap:16px}
  .tip .r span:first-child{color:var(--muted)}
  .tip .m{color:var(--dim);margin-top:6px}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(5,2,8,.65);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .dlg{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:24px}
  .dlg h2{font-size:21px;margin-bottom:10px}
  .dlg p{color:#cfc4d9;font-size:15px;line-height:1.6;margin-top:10px}
  .dlg .muted{color:var(--muted);font-size:13px}
  .set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .set label{font-weight:700}
  .set small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:2px}
  .srcs{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;font-size:12px;margin-top:6px}
  .srcs div{display:flex;gap:8px;align-items:baseline;min-width:0}
  .srcs .st{flex:none;width:8px;height:8px;border-radius:50%}
  .srcs .m{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn{border:1px solid var(--line2);background:#21132a;color:var(--text);border-radius:11px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-block}
  .btn.pri{background:var(--pink);border-color:var(--pink);color:#1a0b1c}
  .loading{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:15px;text-align:center;padding:16px}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid #2a1c33;border-top-color:var(--pink);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  .price .pp{display:flex;flex-direction:column;line-height:1.05}
  .price .pp small{font-size:13px;color:#9fb5ad;font-weight:700;letter-spacing:.02em;margin-top:2px}
  .chip select{background:transparent;border:0;color:var(--text);font:inherit;font-weight:800;cursor:pointer;outline:none}
  .chip select option{background:#1c0f24;color:var(--text)}
  .csum{margin-top:14px;padding:13px 16px;border:1px solid var(--line2);border-radius:14px;background:#1a0e21;font-size:15px;line-height:1.55;color:#d7cce0}
  .csum b{color:var(--text)}
  .cexpl{margin-top:10px;font-size:13px;line-height:1.6;color:var(--dim)}
  .cexpl b{color:var(--muted);font-weight:700}
  .tcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .tbox{border:1px solid var(--line2);border-radius:16px;padding:16px 18px;background:#1a0e21}
  .tbox .k{font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:700;text-transform:uppercase}
  .tbox .v{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .tbox .v b{font-size:44px;font-weight:800;line-height:1}
  .tbox .v span{font-size:16px;font-weight:700}
  .tbox .tr{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
  .tbox .tr b{color:var(--text)}
  .verdict{display:inline-block;margin-top:12px;border-radius:11px;padding:8px 14px;font-weight:800;font-size:17px}
  .tbox .why{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5}
  .overall{margin-top:14px;font-size:15px;line-height:1.55;color:#d7cce0}
  .overall b{color:var(--text)}
  .ctab td{height:54px;font-size:15px}
  .ctab tr.sel td{background:#22122b}
  .ctab tr.pick{cursor:pointer}
  .ctab tr.pick:hover td{background:#1d1026}
  .bbar{width:90px}
  .bname{max-width:150px}
  #bTable td{padding-left:4px;padding-right:4px}
  .bval small{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .ctab th,.ctab td{padding-left:5px;padding-right:5px}
  .ctab td:first-child,.ctab td:last-child{white-space:normal;line-height:1.3}
  .ctab td:last-child{min-width:96px}
  .badge2{font-size:11px;font-weight:800;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--muted);margin-left:6px}
  .splitter{height:14px;margin:2px 0;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
  .splitter span{width:64px;height:4px;border-radius:2px;background:#3a2747;transition:background .2s}
  .splitter:hover span,.splitter.drag span{background:var(--gold)}
  .splitter::before,.splitter::after{content:'';flex:1;height:1px;background:var(--line)}

/* ================= Gauges ================= */
function gauge(score, size = 60, stroke = 4) {
  const r = size / 2 - stroke - 1, C = 2 * Math.PI * r, c = color(score), p = score == null ? 0 : score / 100;
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${size / 2 - 1}" fill="#120914"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" style="filter:drop-shadow(0 0 3px ${rgba(c, .6)})"/></svg>
    <div class="num" style="color:${score == null ? '#a88fd8' : c}">${score ?? '–'}</div>`;
}
function compText(c) { // Hauptwert + Zusatz je Baustein
  const liq = D.liq24?.[MODE];
  switch (c.id) {
    case 'funding': return [sgn(c.raw, 4) + ' %', t('x_funding')];
    case 'oi': return [sgn(c.raw, 1) + ' %', t('x_oi')];
    case 'ls': return [fmt(c.raw, 2), t('x_ls_' + MODE)];
    case 'liq': return liq && liq.L + liq.S >= 2e6 ? [`${fmt(liq.L / 1e6, 0)} / ${fmt(liq.S / 1e6, 0)} ${LANG === 'de' ? 'Mio. $' : 'M $'}`, t('x_liq')] : [t('collecting'), t('x_liq')];
    case 'rsi': return ['RSI ' + fmt(c.raw, 0), t('x_rsi', { a: fmt(c.atr, 1) })];
    case 'etf': return c.raw == null ? [t('noKey'), t('x_etf')] : [sgn(c.raw, 0) + (LANG === 'de' ? ' Mio. $' : ' M $'), t('x_etf')];
    case 'stable': return [sgn(c.raw, 1) + ' %', t('x_stable')];
    case 'cbp': return [sgn(c.raw, 3) + ' %', t('x_cbp')];
    case 'vix': return [fmt(c.level, 1), t('x_vix')];
    case 'dxy': return [fmt(c.level, 1), c.raw > 0 ? t('x_dxy_up') : t('x_dxy_down')];
  }
  return ['–', ''];
}
function srcVal(id, v) {
  if (v == null) return '–';
  return { funding: sgn(v, 4) + ' %', oi: sgn(v, 1) + ' %', ls: fmt(v, 2), rsi: 'RSI ' + fmt(v, 1), etf: sgn(v, 0) + ' Mio. $', stable: sgn(v, 2) + ' %', cbp: sgn(v, 3) + ' %', vix: fmt(v, 1), dxy: sgn(v, 2) + ' %', liq: usd(v / 1e6, 1) + 'M' }[id] ?? fmt(v, 2);
}

const todayKey = () => new Date().toISOString().slice(0, 10);
const dayKey = off => new Date(Date.now() - off * 864e5).toISOString().slice(0, 10);
function seriesOf(col, live) {
  const t0 = todayKey(), out = H.filter(r => r[col] != null && r[0] !== t0).map(r => ({ d: r[0], v: r[col] }));
  if (live != null) out.push({ d: t0, v: live });
  return out;
}
function trendOf(pts, days) { // Veränderung der Regressionsgeraden über den Zeitraum
  const from = dayKey(days), p = pts.filter(x => x.d > from);
  if (p.length < Math.max(3, days * 0.5)) return null;
  const t0 = Date.parse(p[0].d), xs = p.map(x => (Date.parse(x.d) - t0) / 864e5), ys = p.map(x => x.v);
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  return den ? num / den * days : 0;
}
const tword = d => d == null ? '–' : d > 4 ? t('up') : d < -4 ? t('down') : t('side');
const tarrow = d => d == null ? '<span class="flat">–</span>' : d > 4 ? `<span class="up">↑ ${sgn(d)}</span>` : d < -4 ? `<span class="down">↓ ${sgn(d)}</span>` : `<span class="flat">→ ${sgn(d)}</span>`;

}
