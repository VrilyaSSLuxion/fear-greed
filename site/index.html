/b> = weit entferntester starker Cluster, <b>L3…</b> = weitere; der Name steht in der Box am Linienanfang. <b>Knopf „Cluster L/S“</b>: alle → nur nächste → nur stärkste → nur fernste → aus. <b>🔔 Goldene Linie</b> = Alarmstufe, <b>M</b> = Mitte zwischen L1 und S1, <b>eigene Alarmlinien</b> (A1 …) mit der Maus verschieben.</li><li><b>Zum Vergleich</b> (andere Modelle, andere Ergebnisse): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>Andere Heatmap-Quellen – was geht, was nicht</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: zeigt ebenfalls eine <b>Schätzung</b> (mehrere Modelle, viele Börsen). Es gibt keine öffentliche Schnittstelle und keinen Daten-Download – darum nur als Link.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: Heatmap-Daten über die offizielle Schnittstelle nur im Plan „Professional“ (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ im Monat ↗</a>) – zu teuer; die Webseite selbst ist gegen automatisches Auslesen geschützt.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: keine offizielle Schnittstelle; die Webseite hat einen Bot-Schutz, den diese Seite nicht umgeht. Es gibt einen bezahlten Nachbau eines Drittanbieters über <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ je 1.000 Abrufe, inoffiziell, kann jederzeit ausfallen).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: kostenlose Heatmap nur als Bild auf der Webseite (Daten von Hyperliquid), keine Schnittstelle.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: Heatmap aus Hyperliquid-Daten über eine Schnittstelle, nur in bezahlten Plänen mit Key.</li><li><b>MEXC</b>: liefert öffentlich nur das aktuelle Open Interest, keinen stündlichen Verlauf – darum (noch) nicht in der Schätzung.</li></ul></div><div class=\"ibox\"><h3>Alarme – wo und wie</h3><ul><li><b>Wo einstellen:</b> Zahnrad → <b>Alarme</b> (Browser: Ton, Benachrichtigung, welche Alarme) · <b>Heatmap &amp; Alarme</b> (Abstand, Sperrzeit, Reaktion) · <b>Pivot-Alarme</b> · <b>Telegram</b> (Bot, Chat-ID, welche Alarme).</li><li><b>Arten:</b> Signale (Stufen und Wende), Cluster (Annäherung, Zone, Cluster erreicht), Reaktion/Durchbruch nach einem Cluster, eigene Linien, Divergenzen, offizieller Index und <b>Pivot-Alarme</b>.</li><li><b>Pivot-Alarme:</b> Zeiträume ankreuzen (7T … Alles) und wählen: Tief unterschritten, Hoch überschritten, Annäherung (± %). Die Stufen kommen aus den abgeschlossenen Tagen (bis gestern), jede meldet sich einmal. Die Meldung enthält einen Rückblick seit 2020 (wie oft der Kurs innerhalb von 7 Tagen zurückkam = Fehlausbruch / Liquiditäts-Sweep), Szenario A (Sweep → erst nach Bestätigung handeln) und Szenario B (Ausbruch → nächstes Pivot oder Cluster). Bewusst keine „Wahrscheinlichkeit“ ohne Daten.</li><li>Browser-Alarme kommen nur, solange die Seite offen ist. <b>Telegram</b> kommt über das Programm auf dem PC – auch wenn die Seite zu ist.</li></ul></div><div class=\"ibox\"><h3>Weitere Funktionen</h3><ul><li><b>Bitcoin in den nächsten 24 Stunden:</b> Mittel aus der Polymarket-Preisleiter und der eigenen Zonen-Auswertung (wie oft der Kurs am Folgetag höher war); Schriftgröße im Zahnrad.</li><li><b>Was das jetzt heißt:</b> Handlung aus der Zone wie im Video, daneben die <b>Tendenz</b> der letzten Wochen.</li><li><b>Die letzten 7 Tage einzeln</b> mit Index, Tageswert, offiziellen Indizes und Kurs.</li><li><b>Empfehlung Spot &amp; Futures</b> je Zone (Vorlage, Texte im Zahnrad änderbar) und <b>Liquiditäts-Einschätzung</b> (liegen die Longs oder die Shorts näher und dichter am Kurs?).</li><li><b>⛶ Vollbild</b> an jedem Fenster (Esc = zurück). <b>L/S-Labels</b> an den Punkten, <b>Ebenen-Menü</b> für alle Chart-Elemente, Chart-Ende vom Rand verschieben und automatisch ans Ende scrollen wie MT4.</li><li><b>Ticker:</b> Höhe am Griff ziehen (Doppelklick = Standard), mit dem Reiter rechts <b>ganz einklappen</b> und wieder ausklappen (Maus darüber zeigt es an), Position <b>unten oder oben</b> im Zahnrad.</li><li><b>Rahmen und Farben:</b> Knopf „Rahmen“, Farbe/Dicke, Überschriften-Farben, Chart-Farben im Zahnrad. Die obere Bedienleiste steht in einem eigenen Kasten.</li><li><b>Programm auf dem PC:</b> startet mit Windows, holt jede Minute neue Daten, veröffentlicht alle 10 Minuten den Online-Link; dazu gibt es eine Einzeldatei zum Verschicken. <b>Handy:</b> Ansicht „wie am PC“ oder „Handy-optimiert“.</li></ul></div><div class=\"ibox\"><h3>Für später gemerkt</h3><ul><li><b>Telegram</b> zusammen einrichten (Bot über @BotFather) – dann kommen alle Alarme aufs Handy.</li><li><b>CoinGlass-Heatmap</b> einbauen, falls irgendwann ein Key im Plan „Professional“ vorhanden ist.</li><li><b>CoinAnk über Apify</b> (bezahlt, inoffiziell) oder ein <b>Kiyotaka-Key</b> – technisch möglich, wenn gewünscht.</li><li><b>MEXC</b> aufnehmen, sobald es dort einen Open-Interest-Verlauf gibt (oder das Programm ihn selbst mitschreibt). Weitere Börsen wären über den vorhandenen Coinalyze-Key möglich.</li></ul></div><div class=\"ibox\"><h3>Wo stelle ich was ein?</h3><ul><li><b>Obere Bedienleiste</b> (ein Kasten): Ansicht · Binance/Multi-Source · 365/90 Tage · $/€ · Rahmen · Handbuch · Zahnrad. Maus darüber zeigt kurze Erklärungen.</li><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, <b>Kerze</b> (Größe), Zahlen, Index im Chart, Heatmap mit <b>Quelle</b>, Signale, Signale offiziell, Divergenz, Alarmlinien, Tops/Böden, Pivot, Fibo, MA, Cluster, eigene Linien, Mitte, <b>Ebenen ▾</b>, Zeitraum. Knöpfe mit Stufen: klicken = weiter, Rechtsklick = zurück.</li><li><b>Knöpfe am Index-Chart</b> (VrilyaSS): MA (nur Index-Linie), Stufen, Offizieller Index.</li><li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen, Doppelklick = zurück.</li><li><b>Zahnrad:</b> Ansicht, Sprache, Währung, offizieller Index, Stufen, Signale und Trendfilter, Divergenz, Heatmap &amp; Alarme, Pivot-Alarme, eigene Linien, Empfehlungen, Chart-Extras (Tops/Böden, Pivot, Fibonacci-Stufen, MA, aktuelle Kurslinie, Richtungs-Kasten, Ticker, Rahmen), Programm, API-Keys, Telegram, Farben.</li><li><b>Neu in V15:</b> Heatmap aus Binance / Bybit / OKX / kombiniert · Kerzengröße wählbar (Auto, 15m, 1h, 4h, 1T, 1W) · aktuelle Kurslinie einstellbar, Farbmodus wie TradingView · Fibonacci-Stufen einzeln mit Farbe, neu 88,7 % · Richtungs-Kasten · EMA in € glatt, Beschriftung bleibt beim Hineinzoomen sichtbar · Chart-Überschriften gelb · Bedienleiste im Kasten mit Erklärungen · Ticker ganz einklappbar und oben/unten · „Tendenz:“ größer · Handbuch mit Heatmap-Erklärung, anderen Quellen und „Für später gemerkt“.</li><li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});
Object.assign(T.en, {"introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the “Smart Money Fear &amp; Greed” by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p><div class=\"ibox\"><h3>What is it?</h3><p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) measure sentiment mostly from spot volume, volatility, social media and surveys.</p>\n<p>The YouTuber behind the channel <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube channel ↗</a>) showed his own, self-built index in his live streams. It measures what he considers more meaningful: how <b>futures traders</b> are positioned (funding, open interest, long/short, liquidations), where the <b>big money flows</b> go (ETF flows, stablecoins, Coinbase premium) and what the <b>macro backdrop</b> looks like (VIX, dollar).</p>\n<ul class=\"vids\"><li><b>15 Oct 2026</b> – “⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!”<br>First mention of how he <b>built</b> the index: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">from 11:57 ↗</a></li><li><b>16 Oct 2026</b> – “⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING”<br>Explains the <b>improved version</b> from the day before: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">from 8:21 ↗</a></li></ul>\n<p>According to his video his index turns <b>earlier</b> than the official one: in July 2026 it showed extreme greed weeks before the official index followed – far too late for retail investors.</p>\n<p class=\"opinion\"><b>Opinion of the site owner:</b> the official indices tend to react much later – for retail investors their signals often come weeks too late. They are made for the masses, not for early signals. There is also a conflict of interest: several providers are close to exchanges (e.g. CoinMarketCap belongs to Binance), and exchanges earn from retail trading whether it wins or loses. Do not rely on these indices alone for real investments.</p>\n<p>This page rebuilds his index from freely available data <i>(not an official page, not investment advice)</i>.</p></div><div class=\"ibox\"><h3>The three views: SMC · SMC 2 · VrilyaSS</h3><p>Switch at the top left. The index and its calculation are the same in all three views – only what is shown changes.</p>\n<h4>1 · SMC – 1:1 rebuild</h4><p>As in the Smart Money Crypto video (16 Oct 2026): title, price in $, 24-hour change, Telegram / AI models / Why this index? buttons, the 10 building blocks with the index in the middle, “Bitcoin in the next 24 hours”, “What this means now”, the chart “Where fear was and where greed” with numbers, official index, ranges and dots, and the liquidation ticker at the bottom.</p>\n<h4>2 · SMC 2 – 1:1 rebuild with light changes</h4><ul><li>Price in <b>$ and €</b> with flags <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – in the header and the ticker</li><li>Title in a <b>gold box</b>, <b>dividers</b> between title, price, 24 h, buttons and language</li><li>Ticker additionally with the <b>24 h arrow</b> and the <b>four cluster lines</b> (SF farthest short, S1 strongest short, L1 strongest long, LF farthest long) with alert level</li><li>everything else as SMC</li></ul>\n<h4>3 · VrilyaSS – SMC as the base plus all own extensions</h4><ul><li><b>Display:</b> $ and € with flags, all official indices as chips with their gap to the Smart Money index, the last 7 days, <b>tendency</b> next to “What this means now”, <b>spot &amp; futures recommendation</b>, combined <b>assessment ①②③</b>, trend &amp; method comparison (backtest)</li><li><b>Chart:</b> line/candles with selectable candle size, index in chart, liquidation heatmap (Binance / Bybit / OKX / combined), levels, <b>signals</b> with trend filter ⚠, official signals, <b>divergences</b>, <b>tops/bottoms</b>, <b>pivot</b>, <b>Fibonacci</b>, <b>MA</b>, L/S labels, alert and own lines, middle, <b>direction box</b>, layers menu, zoom like TradingView, chart shift like MT4, <b>⛶ fullscreen</b> per window</li><li><b>Alerts</b> in the browser and via Telegram (signals, clusters, reaction, own lines, pivots, divergences)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 blocks, 24 h, chart as in the video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ and € with flags</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Title box and dividers</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker with 24 h arrow and 4 cluster lines</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signals, divergences, tops/bottoms, pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap clusters, alert and own lines, direction box</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>All official indices, last 7 days, tendency</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Spot &amp; futures recommendation, assessment ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Language DE · EN · AR, frames, manual, gear</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Why VrilyaSS?</h3><ul><li><b>Same base</b> as SMC – the same index – but with tools to <b>check</b> a signal instead of following it blindly.</li><li><b>Comparison</b> with all official indices at a glance: how far is Smart Money ahead or behind?</li><li><b>Signals without repaint</b> with evaluation (hit rate after 30 days); the <b>trend filter</b> marks buys against the trend with ⚠.</li><li><b>Liquidation clusters</b> show where price may be pulled – with an alert before it gets there.</li><li><b>Tops/bottoms, pivots, Fibonacci, MA and the direction box</b> show where price stands and where it is heading.</li><li><b>Alerts</b> in the browser and via Telegram – no need to watch the chart all the time.</li><li>Honestly: no tool hits everything. The page helps to put things in context; it is <b>not investment advice</b>.</li></ul></div><div class=\"ibox\"><h3>Calculation</h3><ul><li><b>10 building blocks:</b> funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility (futures market) plus ETF flows, stablecoin inflow, Coinbase premium, VIX and DXY trend (flows and macro).</li><li>Each block is ranked against its own last <b>90 or 365 days</b> (0 = fear, 100 = greed; top “365 D / 90 D”).</li><li>The index is the average, shown as <b>7-day average</b>. “Binance” = Binance data only as in the video, “Multi-Source” = several exchanges (hover for an explanation).</li><li><b>Zones</b> as in the video: 0–24 extreme fear (buy) · 25–44 fear (buy in tranches) · 45–54 neutral (wait) · 55–74 greed (hold) · 75–100 extreme greed (take profits).</li><li><b>Assessment</b> below the chart: ① Smart Money, ② official index by the textbook, ③ combined (Smart Money counts double by default; 1:1, 2:1 or 3:1 in the gear). Next to “What this means now” is the <b>tendency</b> of recent weeks.</li></ul></div><div class=\"ibox\"><h3>Chart: range, candles, price line, direction</h3><ul><li><b>Range</b> (7 days, 1 month … All) = how much you see, <b>not</b> the candle size.</li><li><b>Candle</b> (selector next to line/candles): <b>Auto</b> = hourly candles up to 10 days, daily candles otherwise (as before) · <b>15m / 1h / 4h</b> = minute/hour candles straight from Binance, only at the current end and as far back as the data goes (15m ≈ 10 days, 1h ≈ 41 days, 4h ≈ 166 days) – if the range goes further back, daily candles are shown with a note · <b>1D</b> = always daily · <b>1W</b> = weekly candles (Monday to Sunday).</li><li>The <b>index chart</b> below always stays <b>daily</b> – the index exists only once per day. That is why there is no 1m or 5m: nothing would move below, and the top would show mostly noise.</li><li><b>Current price line</b> (to the price scale, like TradingView): white and dashed by default. In the gear → chart extras: dotted / dashed / solid, width, colour and <b>colour mode green/red like TradingView</b> – green when price is above the open of the current candle, red when below. Label colours (fixed mode) are under “Colours”.</li><li><b>Direction box</b> next to the legend: current movement (default: last 24 h, switchable to “price above/below EMA” with its own period and timeframe 1h / 4h / 1D), plus the <b>next target</b> (next pivot in that direction) and the <b>largest cluster</b> towards longs (below) or towards shorts (above).</li><li><b>MA</b> (EMA 50/200 in the price chart, SMA 20 in the index chart): in € the EMA is computed directly from euro prices, so it is smooth. Label, colour (fixed / green-red / graded) and extension in the gear; the extension stops at the right chart edge.</li><li><b>Headings</b> “Where fear was and where greed” and “Index · 7-day average” are yellow with a thicker frame so they stand out from the buttons (colour in the gear). Drag the bar between the two charts = change height.</li></ul></div><div class=\"ibox\"><h3>Signals in the chart (no repaint)</h3><ul><li><b>Dots:</b> peak of an extreme phase (at least 3 days beyond the level). Filled = phase over, hollow = still running and may move.</li><li><b>Triangles:</b> ▲ below price = long, ▼ above price = short. Hollow = phase confirmed, filled = turn confirmed, filled with white border = zone left. <b>⚠</b> = buy against the trend (trend filter EMA 200 / ADX / weekly MACD).</li><li><b>Settings</b> (gear → signals): trigger, signal from day, touch ± points, method, trend filter (off / mark / hide).</li><li><b>Levels</b> 75/25 (as in the video) and 85/15, quick select also 70/30 and Fibonacci 61.8/38.2. In VrilyaSS the level buttons sit at the index chart and also switch the dots in the price chart.</li><li><b>Divergence</b> like RSI on TradingView: lower price low + higher index low = <b>bull</b>, higher price high + lower index high = <b>bear</b>. The label appears on the confirmation day and never moves.</li><li><b>Evaluation</b> under “Trend &amp; assessment”: hit rate after 30 days and how many major tops/bottoms each method caught. No method hits everything.</li></ul></div><div class=\"ibox\"><h3>Tops/bottoms (retrospective)</h3><p>Major turning points of the price that are only known <b>afterwards</b> – not a live signal, but orientation in the cycle.</p><ul><li><b>How they are counted:</b> a high counts as a <b>top</b> if price then <b>falls at least X %</b> before making a new high. A low counts as a <b>bottom</b> if price then <b>rises at least X %</b>. Daily closes are used.</li><li><b>Two levels:</b> <b>cycle</b> (default 35 %) = large ▲/▼. <b>Minor</b> (default 20 %) = smaller, paler ▲/▼ marked “minor”.</li><li><b>“Tops/bottoms” button:</b> click once = cycle, twice = cycle + minor, three times = off. Right-click = back. Percentages in the gear → chart extras.</li><li><b>Example:</b> between the bottom on 21 Nov 2022 (15.8K) and the top on 6 Oct 2025 (124.7K) there was no 35 % pullback – the largest were −28 % (Jan–Apr 2025) and −26 % (2024). So the whole run counts as <b>one</b> rise. The bottom of 5 Feb 2026 (62.9K) only rose 30.7 % afterwards – it shows as a minor bottom (20 %), not at 35 %. The highs of 14 Jul and 13 Aug 2025 only fell 6 % and 12 % afterwards – small minor highs.</li><li>The smaller the value, the more points: since 2020 there are 9 turns at 35 %, 19 at 25 %, 31 at 20 %, 52 at 15 %.</li></ul></div><div class=\"ibox\"><h3>Pivot lines and Fibonacci</h3><ul><li><b>Highest high</b> = the highest daily high in the chosen period. <b>Lowest low</b> = the lowest daily low <b>after</b> it; if there is none yet, the lowest in the whole period. Switchable in the gear to “in the whole range”.</li><li><b>“Pivot” button</b> steps through: grey = off → <b>P-View</b> (what the chart shows) → <b>P-7D</b> → <b>P-1M</b> → <b>P-3M</b> → <b>P-6M</b> → <b>P-12M</b> → <b>Pivot</b> (all history) → off. Right-click = back.</li><li><b>Fibonacci</b> (“Fibo” button) between pivot high and low, all levels dashed and each on/off with its own colour (gear): 38.2 % red, 50 % white, 61.8 % green, 78.6 % blue, 88.7 % red (≈ square root of 78.6 %), 23.6 % off by default.</li><li>Colours and width of the pivot lines in the gear. A 🔔 on the line means a pivot alert is armed for this period.</li></ul></div><div class=\"ibox\"><h3>Liquidation heatmap – how it is estimated</h3><ul><li>The heatmap is an <b>own estimate</b>, not a real list of positions: if <b>open interest</b> rises in an hour, new positions were opened. They are split into longs and shorts by that hour’s buyer share and spread over typical leverage (5×, 10×, 25×, 50×, 100× with 10 / 30 / 30 / 20 / 10 %). This gives a liquidation price for each part (about 10 % from entry at 10×).</li><li>If price has already reached a level, it counts as liquidated and is removed. If open interest falls, all open levels shrink proportionally. The last 500 hours (≈ 21 days) are used.</li><li><b>Selectable source</b> (selector next to “Heatmap”): <b>Binance</b> (as before), <b>Bybit</b>, <b>OKX</b> or <b>combined</b>. Price path and buyer share always come from Binance (the BTC price is almost the same everywhere), open interest from the respective exchange. The choice also applies to cluster lines, ticker and alerts.</li><li><b>L1/S1</b> = strongest cluster (★), <b>L2/S2</b> = nearest, <b>LF/SF</b> = farthest strong cluster, <b>L3…</b> = further ones; the name sits in a box at the start of the line. <b>“Clusters L/S” button</b>: all → nearest only → strongest only → farthest only → off. <b>🔔 gold line</b> = alert level, <b>M</b> = middle between L1 and S1, <b>own alert lines</b> (A1 …) can be dragged.</li><li><b>For comparison</b> (other models, other results): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>Other heatmap sources – what works, what does not</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: also shows an <b>estimate</b> (several models, many exchanges). There is no public interface and no data download – so only as a link.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: heatmap data via the official interface only in the “Professional” plan (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ per month ↗</a>) – too expensive; the website itself is protected against automated reading.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: no official interface; the website has bot protection which this page does not bypass. There is a paid third-party wrapper on <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ per 1,000 calls, unofficial, may stop at any time).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: free heatmap only as a picture on the website (Hyperliquid data), no interface.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: heatmap from Hyperliquid data via an interface, only in paid plans with a key.</li><li><b>MEXC</b>: publicly only provides the current open interest, no hourly history – so not (yet) in the estimate.</li></ul></div><div class=\"ibox\"><h3>Alerts – where and how</h3><ul><li><b>Where to set them:</b> gear → <b>Alerts</b> (browser: sound, notification, which alerts) · <b>Heatmap &amp; alerts</b> (distance, cooldown, reaction) · <b>Pivot alerts</b> · <b>Telegram</b> (bot, chat ID, which alerts).</li><li><b>Types:</b> signals (levels and turn), clusters (approach, zone, cluster reached), reaction/break after a cluster, own lines, divergences, official index and <b>pivot alerts</b>.</li><li><b>Pivot alerts:</b> tick periods (7D … All) and choose: low broken, high broken, approach (± %). Levels come from completed days (up to yesterday); each alerts once. The message contains a look back since 2020 (how often price came back within 7 days = false break / liquidity sweep), scenario A (sweep → act only after confirmation) and scenario B (breakout → next pivot or cluster). On purpose no “probability” without data.</li><li>Browser alerts only arrive while the page is open. <b>Telegram</b> comes from the program on the PC – even when the page is closed.</li></ul></div><div class=\"ibox\"><h3>More features</h3><ul><li><b>Bitcoin in the next 24 hours:</b> average of the Polymarket price ladder and the own zone evaluation (how often price was higher the next day); font size in the gear.</li><li><b>What this means now:</b> action from the zone as in the video, next to it the <b>tendency</b> of recent weeks.</li><li><b>The last 7 days</b> one by one with index, daily value, official indices and price.</li><li><b>Spot &amp; futures recommendation</b> per zone (template, texts editable in the gear) and <b>liquidity assessment</b> (are longs or shorts closer and denser to price?).</li><li><b>⛶ Fullscreen</b> on every window (Esc = back). <b>L/S labels</b> at the dots, <b>layers menu</b> for all chart elements, chart end shift and auto-scroll like MT4.</li><li><b>Ticker:</b> drag the grip to resize (double-click = default), use the tab on the right to <b>collapse completely</b> and expand again (hover shows which), position <b>bottom or top</b> in the gear.</li><li><b>Frames and colours:</b> “Frames” button, colour/width, heading colours, chart colours in the gear. The top control bar sits in its own box.</li><li><b>Program on the PC:</b> starts with Windows, fetches new data every minute, publishes the online link every 10 minutes; plus a single file to send around. <b>Phone:</b> “like on PC” or “phone-optimised” view.</li></ul></div><div class=\"ibox\"><h3>Remembered for later</h3><ul><li>Set up <b>Telegram</b> together (bot via @BotFather) – then all alerts reach the phone.</li><li>Add the <b>CoinGlass heatmap</b> if a key in the “Professional” plan is ever available.</li><li><b>CoinAnk via Apify</b> (paid, unofficial) or a <b>Kiyotaka key</b> – technically possible if wanted.</li><li>Add <b>MEXC</b> once it offers an open interest history (or the program records it itself). More exchanges would be possible via the existing Coinalyze key.</li></ul></div><div class=\"ibox\"><h3>Where do I set what?</h3><ul><li><b>Top control bar</b> (one box): view · Binance/Multi-Source · 365/90 days · $/€ · frames · manual · gear. Hover shows short explanations.</li><li><b>Buttons above the chart:</b> line/candles, <b>candle</b> (size), numbers, index in chart, heatmap with <b>source</b>, signals, official signals, divergence, alert lines, tops/bottoms, pivot, Fibo, MA, clusters, own lines, middle, <b>layers ▾</b>, range. Buttons with steps: click = next, right-click = back.</li><li><b>Buttons at the index chart</b> (VrilyaSS): MA (index line only), levels, official index.</li><li><b>Using the chart:</b> wheel = zoom time, drag = pan, drag right scale = zoom height, double-click = reset.</li><li><b>Gear:</b> view, language, currency, official index, levels, signals and trend filter, divergence, heatmap &amp; alerts, pivot alerts, own lines, recommendations, chart extras (tops/bottoms, pivot, Fibonacci levels, MA, current price line, direction box, ticker, frames), program, API keys, Telegram, colours.</li><li><b>New in V15:</b> heatmap from Binance / Bybit / OKX / combined · selectable candle size (Auto, 15m, 1h, 4h, 1D, 1W) · adjustable current price line, colour mode like TradingView · Fibonacci levels each with colour, new 88.7 % · direction box · smooth EMA in €, label stays visible when zoomed in · yellow chart headings · control bar in a box with explanations · ticker fully collapsible and top/bottom · bigger “Tendency:” · manual with heatmap explanation, other sources and “remembered for later”.</li><li><b>Data:</b> on the PC every minute (adjustable), online every 10 minutes. The time is shown in the footer.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Open this window any time via “Manual”.</p>"});
Object.assign(T.ar, {"introHtml":"<p class=\"lead\">مرحباً بك في <b>VrilyaSS Fear &amp; Greed INDEX</b> – إعادة بناء لمؤشر «Smart Money Fear &amp; Greed» من قناة <b>Smart Money Crypto</b> (يوتيوب)، مع إضافات خاصة.</p><div class=\"ibox\"><h3>ما الفكرة؟</h3><p>مؤشرات الخوف والطمع المعروفة (alternative.me، CoinMarketCap، CFGI.io، CoinGlass، CoinAnk) تقيس المزاج غالباً من حجم التداول الفوري والتقلّب ووسائل التواصل والاستطلاعات.</p>\n<p>صاحب قناة <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">قناة يوتيوب ↗</a>) عرض في بثوثه المباشرة مؤشراً بناه بنفسه. يقيس ما يراه أهم: كيف يتموضع <b>متداولو العقود الآجلة</b> (التمويل، الفائدة المفتوحة، لونغ/شورت، التصفيات)، وإلى أين تذهب <b>التدفقات الكبيرة</b> (صناديق ETF، العملات المستقرة، علاوة Coinbase)، وكيف يبدو <b>الوضع الاقتصادي الكلي</b> (VIX، الدولار).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – «⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!»<br>هنا يتحدث <b>لأول مرة عن بناء</b> مؤشره: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">من الدقيقة 11:57 ↗</a></li><li><b>16.10.2026</b> – «⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING»<br>هنا يشرح <b>النسخة المحسّنة</b> من اليوم السابق: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">من الدقيقة 8:21 ↗</a></li></ul>\n<p>بحسب الفيديو، ينعطف مؤشره <b>أبكر</b> من المؤشر الرسمي: في يوليو 2026 أظهر طمعاً شديداً قبل أسابيع من المؤشر الرسمي – وهذا متأخر جداً للمستثمر الصغير.</p>\n<p class=\"opinion\"><b>رأي صاحب الموقع:</b> المؤشرات الرسمية تتفاعل عادةً متأخرة بوضوح – وكثيراً ما تأتي إشاراتها للمستثمر الصغير متأخرة بأسابيع. هي مصممة للجمهور العام، لا للإشارات المبكرة. ويضاف إلى ذلك تضارب مصالح: عدة مزوّدين قريبون من البورصات (CoinMarketCap مثلاً تابعة لـ Binance)، والبورصات تربح من تداول الجمهور سواء ربح أم خسر. لذلك لا ينبغي الاعتماد على هذه المؤشرات وحدها في الاستثمار الحقيقي.</p>\n<p>هذه الصفحة تعيد بناء مؤشره من بيانات متاحة مجاناً <i>(ليست صفحة رسمية، وليست نصيحة استثمارية)</i>.</p></div><div class=\"ibox\"><h3>العروض الثلاثة: SMC · SMC 2 · VrilyaSS</h3><p>التبديل من أعلى اليسار. المؤشر وطريقة حسابه واحدة في العروض الثلاثة – يتغيّر فقط ما يُعرض.</p>\n<h4>1 · SMC – نسخة مطابقة 1:1</h4><p>كما في فيديو Smart Money Crypto (16.10.2026): العنوان، السعر بالدولار، تغيّر 24 ساعة، أزرار تيليغرام / نماذج الذكاء الاصطناعي / لماذا هذا المؤشر؟، المكوّنات العشرة والمؤشر في الوسط، «بيتكوين في الـ 24 ساعة القادمة»، «ماذا يعني هذا الآن»، رسم «أين كان الخوف وأين الطمع» مع الأرقام والمؤشر الرسمي والفترات والنقاط، وشريط التصفيات في الأسفل.</p>\n<h4>2 · SMC 2 – نسخة مطابقة مع تغييرات خفيفة</h4><ul><li>السعر <b>بالدولار واليورو</b> مع الأعلام <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – في العنوان والشريط</li><li>العنوان داخل <b>إطار ذهبي</b>، و<b>خطوط فاصلة</b> بين العنوان والسعر و24 ساعة والأزرار واللغة</li><li>الشريط مع <b>سهم 24 ساعة</b> إضافةً إلى <b>أسطر التجمّعات الأربعة</b> (SF أبعد شورت، S1 أقوى شورت، L1 أقوى لونغ، LF أبعد لونغ) مع مستوى التنبيه</li><li>وكل ما عدا ذلك مثل SMC</li></ul>\n<h4>3 · VrilyaSS – SMC كأساس مع كل الإضافات الخاصة</h4><ul><li><b>العرض:</b> الدولار واليورو مع الأعلام، كل المؤشرات الرسمية كبطاقات مع الفرق عن مؤشر Smart Money، آخر 7 أيام، <b>الاتجاه</b> بجانب «ماذا يعني هذا الآن»، <b>توصية سبوت وعقود آجلة</b>، <b>تقييم ①②③</b> مركّب، الاتجاه ومقارنة الطرق (اختبار تاريخي)</li><li><b>الرسم:</b> خط/شموع مع حجم شمعة قابل للاختيار، المؤشر داخل الرسم، خريطة التصفيات (Binance / Bybit / OKX / مجمّع)، المستويات، <b>الإشارات</b> مع فلتر الاتجاه ⚠، الإشارات الرسمية، <b>الانحرافات</b>، <b>القمم/القيعان</b>، <b>البيفوت</b>، <b>فيبوناتشي</b>، <b>المتوسطات</b>، تسميات L/S، خطوط التنبيه والخطوط الخاصة، المنتصف، <b>مربع الاتجاه</b>، قائمة الطبقات، التكبير مثل TradingView، إزاحة نهاية الرسم مثل MT4، <b>⛶ ملء الشاشة</b> لكل نافذة</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام (الإشارات، التجمّعات، رد الفعل، الخطوط الخاصة، البيفوت، الانحرافات)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>المؤشر، 10 مكوّنات، 24 ساعة، الرسم كما في الفيديو</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>الدولار واليورو مع الأعلام</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>إطار العنوان والخطوط الفاصلة</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الشريط مع سهم 24 ساعة و4 أسطر تجمّعات</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الإشارات، الانحرافات، القمم/القيعان، البيفوت، فيبوناتشي، المتوسطات</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>تجمّعات الخريطة، خطوط التنبيه والخاصة، مربع الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>كل المؤشرات الرسمية، آخر 7 أيام، الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>توصية سبوت وعقود آجلة، تقييم ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>اللغة DE · EN · AR، الإطارات، الدليل، الإعدادات</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>لماذا VrilyaSS؟</h3><ul><li><b>نفس الأساس</b> مثل SMC – نفس المؤشر – لكن مع أدوات <b>للتحقق</b> من الإشارة بدلاً من اتباعها بشكل أعمى.</li><li><b>مقارنة</b> مع كل المؤشرات الرسمية بنظرة واحدة: كم يسبقها Smart Money أو يتأخر عنها؟</li><li><b>إشارات بلا إعادة رسم</b> مع تقييم (نسبة النجاح بعد 30 يوماً)؛ و<b>فلتر الاتجاه</b> يعلّم الشراء عكس الاتجاه بـ ⚠.</li><li><b>تجمّعات التصفيات</b> تُظهر إلى أين قد يُسحب السعر – مع تنبيه قبل الوصول.</li><li><b>القمم/القيعان والبيفوت وفيبوناتشي والمتوسطات ومربع الاتجاه</b> تبيّن موقع السعر واتجاهه الحالي.</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام – لا حاجة لمراقبة الرسم طوال الوقت.</li><li>بصراحة: لا توجد أداة تصيب دائماً. الصفحة تساعد على الفهم، وهي <b>ليست نصيحة استثمارية</b>.</li></ul></div><div class=\"ibox\"><h3>طريقة الحساب</h3><ul><li><b>10 مكوّنات:</b> التمويل، تغيّر الفائدة المفتوحة، نسبة لونغ/شورت، التصفيات، RSI والتقلّب (سوق العقود الآجلة)، وتدفقات ETF، تدفق العملات المستقرة، علاوة Coinbase، VIX واتجاه DXY (التدفقات والاقتصاد الكلي).</li><li>كل مكوّن يُقارن بآخر <b>90 أو 365 يوماً</b> من قيمه (0 = خوف، 100 = طمع؛ في الأعلى «365 ي / 90 ي»).</li><li>المؤشر هو المتوسط، ويُعرض كـ<b>متوسط 7 أيام</b>. «Binance» = بيانات Binance فقط كما في الفيديو، «Multi-Source» = عدة بورصات (مرّر الفأرة للشرح).</li><li><b>المناطق</b> كما في الفيديو: 0–24 خوف شديد (شراء) · 25–44 خوف (شراء على دفعات) · 45–54 محايد (انتظار) · 55–74 طمع (احتفاظ) · 75–100 طمع شديد (جني الأرباح).</li><li><b>التقييم</b> تحت الرسم: ① Smart Money، ② المؤشر الرسمي حسب الكتاب، ③ مركّب (Smart Money يُحسب مرتين افتراضياً؛ 1:1 أو 2:1 أو 3:1 في الإعدادات). بجانب «ماذا يعني هذا الآن» يظهر <b>الاتجاه</b> في الأسابيع الأخيرة.</li></ul></div><div class=\"ibox\"><h3>الرسم: الفترة، الشموع، خط السعر، الاتجاه</h3><ul><li><b>الفترة</b> (7 أيام، شهر … الكل) = مقدار ما تراه، <b>وليس</b> حجم الشمعة.</li><li><b>الشمعة</b> (الاختيار بجانب خط/شموع): <b>تلقائي</b> = حتى 10 أيام شموع ساعة، وإلا شموع يومية (كما سابقاً) · <b>15د / 1س / 4س</b> = شموع دقائق/ساعات مباشرة من Binance، فقط عند النهاية الحالية وبقدر ما تمتد البيانات (15د ≈ 10 أيام، 1س ≈ 41 يوماً، 4س ≈ 166 يوماً) – إن امتدت الفترة أبعد تُعرض شموع يومية مع ملاحظة · <b>يوم</b> = دائماً يومية · <b>أسبوع</b> = شموع أسبوعية (من الاثنين إلى الأحد).</li><li><b>رسم المؤشر</b> في الأسفل يبقى دائماً <b>يومياً</b> – المؤشر يُحسب مرة واحدة في اليوم. لذلك لا يوجد 1د أو 5د: لن يتحرك شيء في الأسفل، وفي الأعلى سيظهر ضجيج فقط.</li><li><b>خط السعر الحالي</b> (حتى مقياس السعر، مثل TradingView): أبيض متقطّع افتراضياً. في الإعدادات ← إضافات الرسم: منقّط / متقطّع / متصل، السماكة، اللون و<b>وضع اللون أخضر/أحمر مثل TradingView</b> – أخضر عندما يكون السعر فوق افتتاح الشمعة الحالية، وأحمر عندما يكون تحته. ألوان الملصق (الوضع الثابت) تحت «الألوان».</li><li><b>مربع الاتجاه</b> بجانب المفتاح: الحركة الحالية (افتراضياً آخر 24 ساعة، أو «السعر فوق/تحت EMA» بفترة وإطار زمني 1س / 4س / يوم)، مع <b>الهدف التالي</b> (البيفوت التالي في هذا الاتجاه) و<b>أكبر تجمّع</b> باتجاه اللونغ (تحت) أو باتجاه الشورت (فوق).</li><li><b>المتوسطات</b> (EMA 50/200 في رسم السعر، SMA 20 في رسم المؤشر): باليورو تُحسب EMA مباشرة من أسعار اليورو فتكون ناعمة. التسمية واللون (ثابت / أخضر-أحمر / متدرّج) والتمديد في الإعدادات؛ التمديد يتوقف عند حافة الرسم اليمنى.</li><li><b>العناوين</b> «أين كان الخوف وأين الطمع» و«المؤشر · متوسط 7 أيام» صفراء بإطار أسمك لتتميز عن الأزرار (اللون في الإعدادات). سحب الشريط بين الرسمين = تغيير الارتفاع.</li></ul></div><div class=\"ibox\"><h3>الإشارات في الرسم (بلا إعادة رسم)</h3><ul><li><b>النقاط:</b> قمة مرحلة قصوى (3 أيام على الأقل بعد المستوى). ممتلئة = انتهت المرحلة، مفرّغة = ما زالت جارية وقد تتحرك.</li><li><b>المثلثات:</b> ▲ تحت السعر = لونغ (شراء)، ▼ فوق السعر = شورت (بيع). مفرّغ = تأكيد المرحلة، ممتلئ = تأكيد الانعطاف، ممتلئ بحافة بيضاء = مغادرة المنطقة. <b>⚠</b> = شراء عكس الاتجاه (فلتر EMA 200 / ADX / MACD أسبوعي).</li><li><b>قابلة للضبط</b> (الإعدادات ← الإشارات): المُطلِق، الإشارة من اليوم، اللمس ± نقاط، الطريقة، فلتر الاتجاه (إيقاف / تعليم / إخفاء).</li><li><b>المستويات</b> 75/25 (كما في الفيديو) و85/15، واختيار سريع أيضاً 70/30 وفيبوناتشي 61.8/38.2. في VrilyaSS توجد أزرار المستويات عند رسم المؤشر، وهي تبدّل النقاط في رسم السعر أيضاً.</li><li><b>الانحراف</b> مثل RSI في TradingView: قاع أدنى للسعر + قاع أعلى للمؤشر = <b>Bull</b>، قمة أعلى للسعر + قمة أدنى للمؤشر = <b>Bear</b>. تظهر التسمية يوم التأكيد ولا تتحرك بعدها.</li><li><b>التقييم</b> تحت «الاتجاه والتقييم»: نسبة النجاح بعد 30 يوماً وكم من القمم/القيعان الكبيرة التقطتها كل طريقة. لا توجد طريقة تصيب كل شيء.</li></ul></div><div class=\"ibox\"><h3>القمم/القيعان (بأثر رجعي)</h3><p>نقاط انعطاف كبيرة للسعر تُعرف فقط <b>بعد حدوثها</b> – ليست إشارة مباشرة، بل توجيه داخل الدورة.</p><ul><li><b>طريقة العدّ:</b> تُعدّ القمة <b>قمة</b> إذا <b>هبط</b> السعر بعدها <b>X % على الأقل</b> قبل أن يصنع قمة جديدة. ويُعدّ القاع <b>قاعاً</b> إذا <b>صعد</b> السعر بعده <b>X % على الأقل</b>. الحساب بأسعار الإغلاق اليومية.</li><li><b>مستويان:</b> <b>الدورة</b> (افتراضياً 35 %) = ▲/▼ كبيرة. <b>فرعي</b> (افتراضياً 20 %) = ▲/▼ أصغر وأبهت مع «فرعي».</li><li><b>زر «القمم/القيعان»:</b> نقرة = الدورة، نقرتان = الدورة + الفرعي، ثلاث نقرات = إيقاف. نقرة يمنى = رجوع. النسب في الإعدادات ← إضافات الرسم.</li><li><b>مثال:</b> بين القاع في 21.11.2022 (15.8K) والقمة في 06.10.2025 (124.7K) لم يحدث تراجع بنسبة 35 % – الأكبر كان −28 % (يناير–أبريل 2025) و−26 % (2024). لذلك يُعدّ المسار كله صعوداً <b>واحداً</b>. قاع 05.02.2026 (62.9K) صعد بعده 30.7 % فقط – يظهر كقاع فرعي (20 %) لا عند 35 %. قمتا 14.07 و13.08.2025 هبط السعر بعدهما 6 % و12 % فقط – قمم فرعية صغيرة.</li><li>كلما صغرت القيمة زادت النقاط: منذ 2020 توجد 9 انعطافات عند 35 %، و19 عند 25 %، و31 عند 20 %، و52 عند 15 %.</li></ul></div><div class=\"ibox\"><h3>خطوط البيفوت وفيبوناتشي</h3><ul><li><b>أعلى قمة</b> = أعلى سعر يومي في الفترة المختارة. <b>أدنى قاع</b> = أدنى سعر يومي <b>بعدها</b>؛ وإن لم يوجد بعد، فالأدنى في كامل الفترة. قابل للتحويل في الإعدادات إلى «في كامل الفترة».</li><li><b>زر «Pivot»</b> يتنقّل: رمادي = إيقاف ← <b>P-المرئي</b> (ما يعرضه الرسم) ← <b>P-7ي</b> ← <b>P-1ش</b> ← <b>P-3ش</b> ← <b>P-6ش</b> ← <b>P-12ش</b> ← <b>Pivot</b> (كامل السجل) ← إيقاف. نقرة يمنى = رجوع.</li><li><b>فيبوناتشي</b> (زر «Fibo») بين قمة البيفوت وقاعه، كل المستويات متقطّعة وكل مستوى تشغيل/إيقاف بلون خاص (الإعدادات): 38.2 % أحمر، 50 % أبيض، 61.8 % أخضر، 78.6 % أزرق، 88.7 % أحمر (≈ الجذر التربيعي لـ 78.6 %)، و23.6 % متوقف افتراضياً.</li><li>ألوان خطوط البيفوت وسماكتها في الإعدادات. 🔔 على الخط تعني أن تنبيه البيفوت مفعّل لهذه الفترة.</li></ul></div><div class=\"ibox\"><h3>خريطة التصفيات – كيف تُقدَّر</h3><ul><li>الخريطة <b>تقدير خاص</b> وليست قائمة مراكز حقيقية: إذا ارتفعت <b>الفائدة المفتوحة</b> في ساعة ما، فقد فُتحت مراكز جديدة. تُقسَّم إلى لونغ وشورت حسب نسبة المشترين في تلك الساعة، وتُوزَّع على رافعات شائعة (5×، 10×، 25×، 50×، 100× بنسب 10 / 30 / 30 / 20 / 10 %). ومن ذلك ينتج سعر تصفية لكل جزء (عند 10× نحو 10 % من سعر الدخول).</li><li>إذا وصل السعر إلى مستوى ما يُعدّ مُصفّى ويُحذف. وإذا انخفضت الفائدة المفتوحة تصغر كل المستويات المفتوحة بالتناسب. تُستخدم آخر 500 ساعة (≈ 21 يوماً).</li><li><b>المصدر قابل للاختيار</b> (بجانب «الخريطة»): <b>Binance</b> (كما سابقاً)، <b>Bybit</b>، <b>OKX</b> أو <b>مجمّع</b>. مسار السعر ونسبة المشترين من Binance دائماً (سعر BTC متقارب في كل مكان)، والفائدة المفتوحة من البورصة المختارة. الاختيار يسري أيضاً على خطوط التجمّعات والشريط والتنبيهات.</li><li><b>L1/S1</b> = أقوى تجمّع (★)، <b>L2/S2</b> = الأقرب، <b>LF/SF</b> = أبعد تجمّع قوي، <b>L3…</b> = أخرى؛ الاسم داخل مربع في بداية الخط. <b>زر «التجمّعات L/S»</b>: الكل ← الأقرب فقط ← الأقوى فقط ← الأبعد فقط ← إيقاف. <b>🔔 الخط الذهبي</b> = مستوى التنبيه، <b>M</b> = المنتصف بين L1 وS1، <b>خطوط التنبيه الخاصة</b> (A1 …) قابلة للسحب.</li><li><b>للمقارنة</b> (نماذج أخرى ونتائج أخرى): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>مصادر أخرى للخريطة – ما الممكن وما غير الممكن</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: يعرض هو أيضاً <b>تقديراً</b> (عدة نماذج، بورصات كثيرة). لا توجد واجهة عامة ولا تنزيل للبيانات – لذلك كرابط فقط.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: بيانات الخريطة عبر الواجهة الرسمية فقط في خطة «Professional» (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ شهرياً ↗</a>) – مكلفة جداً؛ والموقع نفسه محمي من القراءة الآلية.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: لا توجد واجهة رسمية؛ الموقع محمي من الروبوتات ولا تتجاوز هذه الصفحة الحماية. توجد نسخة مدفوعة من طرف ثالث عبر <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ لكل 1000 طلب، غير رسمية وقد تتوقف في أي وقت).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: خريطة مجانية كصورة فقط على الموقع (بيانات Hyperliquid)، بلا واجهة.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: خريطة من بيانات Hyperliquid عبر واجهة، فقط في خطط مدفوعة بمفتاح.</li><li><b>MEXC</b>: يوفّر علناً الفائدة المفتوحة الحالية فقط بلا سجل بالساعة – لذلك ليس (بعد) في التقدير.</li></ul></div><div class=\"ibox\"><h3>التنبيهات – أين وكيف</h3><ul><li><b>أين تُضبط:</b> الإعدادات ← <b>التنبيهات</b> (المتصفح: الصوت، الإشعار، أي تنبيهات) · <b>الخريطة والتنبيهات</b> (المسافة، فترة الانتظار، رد الفعل) · <b>تنبيهات البيفوت</b> · <b>تيليغرام</b> (البوت، معرّف المحادثة، أي تنبيهات).</li><li><b>الأنواع:</b> الإشارات (المستويات والانعطاف)، التجمّعات (اقتراب، منطقة، الوصول للتجمّع)، رد الفعل/الاختراق بعد تجمّع، الخطوط الخاصة، الانحرافات، المؤشر الرسمي و<b>تنبيهات البيفوت</b>.</li><li><b>تنبيهات البيفوت:</b> اختر الفترات (7ي … الكل) ثم: كسر القاع، اختراق القمة، اقتراب (± %). المستويات من الأيام المكتملة (حتى الأمس)، وكل مستوى ينبّه مرة واحدة. الرسالة تتضمن نظرة إلى الماضي منذ 2020 (كم مرة عاد السعر خلال 7 أيام = اختراق كاذب / سحب سيولة)، السيناريو أ (سحب سيولة ← التصرف بعد التأكيد) والسيناريو ب (كسر ← البيفوت أو التجمّع التالي). عمداً بلا «احتمالية» دون بيانات.</li><li>تنبيهات المتصفح تصل فقط والصفحة مفتوحة. <b>تيليغرام</b> يأتي من البرنامج على الكمبيوتر – حتى والصفحة مغلقة.</li></ul></div><div class=\"ibox\"><h3>وظائف أخرى</h3><ul><li><b>بيتكوين في الـ 24 ساعة القادمة:</b> متوسط سلّم أسعار Polymarket وتقييم المنطقة الخاص (كم مرة كان السعر أعلى في اليوم التالي)؛ حجم الخط في الإعدادات.</li><li><b>ماذا يعني هذا الآن:</b> الإجراء حسب المنطقة كما في الفيديو، وبجانبه <b>الاتجاه</b> في الأسابيع الأخيرة.</li><li><b>آخر 7 أيام</b> يوماً بيوم مع المؤشر والقيمة اليومية والمؤشرات الرسمية والسعر.</li><li><b>توصية سبوت وعقود آجلة</b> لكل منطقة (قالب، النصوص قابلة للتعديل) و<b>تقييم السيولة</b> (هل اللونغ أم الشورت أقرب وأكثف من السعر؟).</li><li><b>⛶ ملء الشاشة</b> لكل نافذة (Esc = رجوع). <b>تسميات L/S</b> عند النقاط، <b>قائمة الطبقات</b> لكل عناصر الرسم، إزاحة نهاية الرسم والتمرير التلقائي مثل MT4.</li><li><b>الشريط:</b> اسحب المقبض لتغيير الحجم (نقر مزدوج = الافتراضي)، اللسان على اليمين <b>يخفيه بالكامل</b> ويظهره (تمرير الفأرة يوضح)، الموضع <b>أسفل أو أعلى</b> في الإعدادات.</li><li><b>الإطارات والألوان:</b> زر «الإطارات»، اللون/السماكة، ألوان العناوين، ألوان الرسم في الإعدادات. شريط التحكم العلوي في مربع خاص.</li><li><b>البرنامج على الكمبيوتر:</b> يبدأ مع Windows، يجلب بيانات جديدة كل دقيقة، وينشر الرابط على الإنترنت كل 10 دقائق؛ مع ملف منفرد للإرسال. <b>الهاتف:</b> عرض «كما على الكمبيوتر» أو «مُحسَّن للهاتف».</li></ul></div><div class=\"ibox\"><h3>مؤجّل لوقت لاحق</h3><ul><li>إعداد <b>تيليغرام</b> معاً (بوت عبر ‎@BotFather) – بعدها تصل كل التنبيهات إلى الهاتف.</li><li>إضافة <b>خريطة CoinGlass</b> إذا توفر يوماً مفتاح بخطة «Professional».</li><li><b>CoinAnk عبر Apify</b> (مدفوع، غير رسمي) أو <b>مفتاح Kiyotaka</b> – ممكن تقنياً عند الرغبة.</li><li>إضافة <b>MEXC</b> عندما يتوفر سجل للفائدة المفتوحة (أو يسجله البرنامج بنفسه). بورصات أخرى ممكنة عبر مفتاح Coinalyze الموجود.</li></ul></div><div class=\"ibox\"><h3>أين أضبط ماذا؟</h3><ul><li><b>شريط التحكم العلوي</b> (مربع واحد): العرض · Binance/Multi-Source · 365/90 يوماً · $/€ · الإطارات · الدليل · الإعدادات. تمرير الفأرة يعرض شرحاً قصيراً.</li><li><b>الأزرار فوق الرسم:</b> خط/شموع، <b>الشمعة</b> (الحجم)، الأرقام، المؤشر في الرسم، الخريطة مع <b>المصدر</b>، الإشارات، الإشارات الرسمية، الانحراف، خطوط التنبيه، القمم/القيعان، البيفوت، Fibo، MA، التجمّعات، الخطوط الخاصة، المنتصف، <b>الطبقات ▾</b>، الفترة. الأزرار ذات الخطوات: نقرة = التالي، نقرة يمنى = رجوع.</li><li><b>أزرار رسم المؤشر</b> (VrilyaSS): MA (خط المؤشر فقط)، المستويات، المؤشر الرسمي.</li><li><b>استخدام الرسم:</b> عجلة الفأرة = تكبير الزمن، السحب = تحريك، سحب المقياس الأيمن = تكبير الارتفاع، نقر مزدوج = إعادة.</li><li><b>الإعدادات:</b> العرض، اللغة، العملة، المؤشر الرسمي، المستويات، الإشارات وفلتر الاتجاه، الانحراف، الخريطة والتنبيهات، تنبيهات البيفوت، الخطوط الخاصة، التوصيات، إضافات الرسم (القمم/القيعان، البيفوت، مستويات فيبوناتشي، المتوسطات، خط السعر الحالي، مربع الاتجاه، الشريط، الإطارات)، البرنامج، مفاتيح API، تيليغرام، الألوان.</li><li><b>جديد في V15:</b> الخريطة من Binance / Bybit / OKX / مجمّع · حجم الشمعة قابل للاختيار (تلقائي، 15د، 1س، 4س، يوم، أسبوع) · خط السعر الحالي قابل للضبط ووضع لون مثل TradingView · مستويات فيبوناتشي بألوان منفردة وجديد 88.7 % · مربع الاتجاه · EMA ناعمة باليورو والتسمية تبقى ظاهرة عند التكبير · عناوين الرسم صفراء · شريط التحكم في مربع مع شروح · الشريط يُخفى بالكامل وأعلى/أسفل · «الاتجاه:» أكبر · دليل مع شرح الخريطة والمصادر الأخرى و«مؤجّل لوقت لاحق».</li><li><b>البيانات:</b> على الكمبيوتر كل دقيقة (قابل للضبط)، وعلى الإنترنت كل 10 دقائق. الوقت مذكور في التذييل.</li></ul></div><p class=\"muted\" style=\"text-align:center\">يمكن فتح هذه النافذة في أي وقت عبر «الدليل».</p>"});
Object.assign(T.de, {"introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p><div class=\"ibox\"><h3>Worum geht es?</h3><p>Die bekannten Fear &amp; Greed Indizes (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen.</p>\n<p>Der YouTuber mit dem Kanal <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube-Kanal ↗</a>) hat in seinen Livestreams einen eigenen, selbst gebauten Index gezeigt. Er misst stattdessen, was er für aussagekräftiger hält: wie die <b>Futures-Trader</b> positioniert sind (Funding, Open Interest, Long/Short, Liquidationen), wohin die <b>großen Geldflüsse</b> gehen (ETF-Flows, Stablecoins, Coinbase-Premium) und wie das <b>Makro-Umfeld</b> aussieht (VIX, Dollar).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – „⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!“<br>Hier geht er <b>erstmals auf den Bau</b> seines Index ein: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">ab Minute 11:57 ↗</a></li><li><b>16.10.2026</b> – „⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING“<br>Hier erklärt er die <b>verbesserte Version</b> vom Vortag genauer: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">ab Minute 8:21 ↗</a></li></ul>\n<p>Laut seinem Video und seinen Aussagen dreht sein Index <b>früher</b> als der offizielle: Im Juli 2026 zeigte er schon extreme Gier, Wochen bevor der offizielle Index folgte – für Privatanleger viel zu spät, um noch nützlich zu sein.</p>\n<p class=\"opinion\"><b>Meinung des Seitenbetreibers:</b> Die offiziellen Indizes reagieren erfahrungsgemäß deutlich später – für Privatanleger kommen ihre Signale oft Wochen zu spät, um noch nützlich zu sein. Sie sind für die breite Masse gemacht, nicht für frühe Signale. Dazu kommt ein Interessenkonflikt: Mehrere Anbieter stehen Börsen nahe (CoinMarketCap gehört z. B. zu Binance), und Börsen verdienen am Handel der Masse – egal, ob diese gewinnt oder verliert. Für echte Investitionen sollte man sich deshalb nicht allein auf diese Indizes verlassen.</p>\n<p>Diese Seite baut seinen Index aus frei verfügbaren Daten nach <i>(keine offizielle Seite, keine Anlageberatung)</i>.</p></div><div class=\"ibox\"><h3>Die drei Ansichten: SMC · SMC 2 · VrilyaSS</h3><p>Oben links umschalten. Der Index und seine Berechnung sind in allen drei Ansichten gleich – es ändert sich nur, was angezeigt wird.</p>\n<h4>1 · SMC – 1:1-Nachbau</h4><p>So wie im Video von Smart Money Crypto (16.10.2026): Titel, Kurs in $, 24-Stunden-Änderung, Knöpfe Telegram / KI-Modelle / Warum dieser Index?, die 10 Bausteine mit dem Index in der Mitte, „Bitcoin in den nächsten 24 Stunden“, „Was das jetzt heißt“, der Chart „Wo Angst war und wo Gier“ mit Zahlen, Offiziellem Index, Zeiträumen und Punkten, unten der Liquidations-Ticker.</p>\n<h4>2 · SMC 2 – 1:1-Nachbau mit leichten Änderungen</h4><ul><li>Kurs in <b>$ und €</b> mit Flaggen <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – im Titel und im Ticker</li><li>Titel im <b>goldenen Kasten</b>, <b>Trennstriche</b> zwischen Titel, Kurs, 24 h, Knöpfen und Sprache</li><li>Ticker zusätzlich mit <b>24-h-Pfeil</b> und den <b>vier Cluster-Zeilen</b> (SF fernster Short, S1 stärkster Short, L1 stärkster Long, LF fernster Long) samt Alarm-Stufe</li><li>sonst alles wie SMC</li></ul>\n<h4>3 · VrilyaSS – SMC als Basis plus alle eigenen Erweiterungen</h4><ul><li><b>Anzeige:</b> $ und € mit Flaggen, alle offiziellen Indizes als Chips mit Abstand zum Smart-Money-Index, die letzten 7 Tage einzeln, <b>Tendenz</b> neben „Was das jetzt heißt“, <b>Empfehlung Spot &amp; Futures</b>, kombinierte <b>Einschätzung ①②③</b>, Trend &amp; Methoden-Vergleich (Backtest)</li><li><b>Chart:</b> Linie/Kerzen, Index im Chart, Liquidations-Heatmap mit Clustern, Stufen 75/25 und 85/15, <b>Signale</b> (Dreiecke) mit Trendfilter ⚠, Signale offiziell, <b>Divergenzen</b>, <b>Tops/Böden</b>, <b>Pivot</b>, <b>Fibonacci</b>, <b>MA</b> (EMA 50/200, SMA 20), L/S-Labels, Alarm- und eigene Linien, Mitte, Ebenen-Menü, Zoomen wie TradingView, Chart-Ende verschieben wie MT4, <b>⛶ Vollbild</b> je Fenster</li><li><b>Alarme</b> im Browser und per Telegram (Signale, Cluster, Reaktion, eigene Linien, Pivots, Divergenzen)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 Bausteine, 24 h, Chart wie im Video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ und € mit Flaggen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Titel-Kasten und Trennstriche</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker mit 24-h-Pfeil und 4 Cluster-Zeilen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signale, Divergenzen, Tops/Böden, Pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap-Cluster, Alarm- und eigene Linien</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>alle offiziellen Indizes, letzte 7 Tage, Tendenz</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Empfehlung Spot &amp; Futures, Einschätzung ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Sprache DE · EN · AR, Rahmen, Handbuch, Zahnrad</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Warum VrilyaSS?</h3><ul><li><b>Gleiche Basis</b> wie SMC – derselbe Index –, aber mit Werkzeugen, um ein Signal zu <b>prüfen</b>, statt ihm blind zu folgen.</li><li><b>Vergleich</b> mit allen offiziellen Indizes auf einen Blick: Wie weit liegt Smart Money vorne oder hinten?</li><li><b>Signale ohne Repaint</b> mit Auswertung (Trefferquote nach 30 Tagen); der <b>Trendfilter</b> markiert Käufe gegen den Trend mit ⚠.</li><li><b>Liquidations-Cluster</b> zeigen, wohin der Kurs gezogen werden kann – mit Alarm, bevor er dort ist.</li><li><b>Tops/Böden, Pivots, Fibonacci und MA</b> ordnen ein, wo der Kurs im Zyklus steht.</li><li><b>Alarme</b> im Browser und per Telegram – man muss nicht ständig auf den Chart schauen.</li><li>Ehrlich gesagt: Kein Werkzeug trifft alles. Die Seite hilft beim Einordnen, sie ist <b>keine Anlageberatung</b>.</li></ul></div><div class=\"ibox\"><h3>So wird gerechnet</h3><ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li><li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li><li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen.</li><li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li><li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert (Smart Money zählt standardmäßig doppelt, im Zahnrad 1:1, 2:1 oder 3:1). Neben „Was das jetzt heißt“ steht die <b>Tendenz</b> aus den letzten Wochen.</li></ul></div><div class=\"ibox\"><h3>Signale im Chart (ohne Repaint)</h3><ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über/unter der Stufe). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li><li><b>Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt, voll = Wende bestätigt, voll mit weißem Rand = Zone wieder verlassen. <b>⚠</b> = Kauf gegen den Trend (Trendfilter EMA 200 / ADX / MACD Woche).</li><li><b>Einstellbar</b> (Zahnrad → Signale): Auslöser, Signal ab Tag, Berührung ± Punkte, Methode, Trendfilter (aus / markieren / ausblenden).</li><li><b>Stufen</b> 75/25 (wie im Video) und 85/15, Schnellwahl auch 70/30 und Fibonacci 61,8/38,2. Die Stufen-Knöpfe stehen in VrilyaSS beim Index-Chart und schalten auch die Punkte im Kurs-Chart.</li><li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b>, Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b>. Das Label erscheint am Bestätigungstag und wandert nie mehr.</li><li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Keine Methode trifft alles.</li></ul></div><div class=\"ibox\"><h3>Tops/Böden (rückwirkend)</h3><p>Große Wendepunkte des Kurses, die erst <b>im Nachhinein</b> feststehen – kein Live-Signal, sondern Orientierung im Zyklus.</p><ul><li><b>So wird gezählt:</b> Ein Hoch zählt als <b>Top</b>, wenn der Kurs danach mindestens <b>X % fällt</b>, bevor er ein neues Hoch macht. Ein Tief zählt als <b>Boden</b>, wenn der Kurs danach mindestens <b>X % steigt</b>. Gerechnet wird mit Tagesschlusskursen.</li><li><b>Zwei Stufen:</b> <b>Zyklus</b> (Standard 35 %) = große ▲/▼ – die großen Wenden eines Zyklus. <b>Zwischen</b> (Standard 20 %) = kleinere, blassere ▲/▼ mit „Zw.“ – Wenden innerhalb des Zyklus.</li><li><b>Knopf „Tops/Böden“:</b> 1× klicken = Zyklus, 2× = Zyklus + Zwischen („Tops/Böden + Zw.“), 3× = aus. Rechtsklick = eine Stufe zurück. Die Prozent-Werte stehen im Zahnrad → Chart-Extras.</li><li><b>Beispiel:</b> Zwischen dem Boden am 21.11.2022 (15,8K) und dem Top am 06.10.2025 (124,7K) gab es keinen Rücksetzer von 35 % – die größten waren −28 % (Jan.–Apr. 2025) und −26 % (2024). Darum zählt die ganze Strecke als <b>ein</b> Anstieg. Der Boden vom 05.02.2026 (62,9K) stieg danach nur um 30,7 % (bis 82,2K) – er erscheint als Zwischen-Boden (20 %), aber nicht bei 35 %. Die Hochs vom 14.07.2025 und 13.08.2025 fielen danach nur 6 % bzw. 12 % – das sind kleine Zwischenhochs, die erst unter 12 % erscheinen würden.</li><li>Je kleiner der Wert, desto mehr Punkte: bei 35 % sind es seit 2020 9 Wendepunkte, bei 25 % 19, bei 20 % 31, bei 15 % 52.</li></ul></div><div class=\"ibox\"><h3>Pivot-Linien</h3><ul><li><b>Höchstes Hoch</b> = das höchste Tageshoch im gewählten Zeitraum. <b>Tiefstes Tief</b> = das tiefste Tagestief <b>danach</b> (nach dem höchsten Hoch); gibt es danach noch keins, das tiefste im ganzen Zeitraum. Im Zahnrad lässt sich „Tiefstes Tief“ auf „im ganzen Zeitraum“ umstellen.</li><li><b>Knopf „Pivot“</b> schaltet durch: grau = aus → <b>P-Sicht</b> (was der Chart gerade zeigt, wie früher) → <b>P-7T</b> → <b>P-1M</b> → <b>P-3M</b> → <b>P-6M</b> → <b>P-12M</b> → <b>Pivot</b> (ganzer Verlauf) → aus. Rechtsklick = zurück. „P-3M“ heißt: die letzten 3 Monate ab heute, egal was der Chart zeigt.</li><li><b>Fibonacci</b> (Knopf „Fibo“) spannt sich zwischen Pivot-Hoch und -Tief; Stufen im Zahnrad.</li><li>Farben und <b>Dicke</b> der Linien im Zahnrad. Eine 🔔 an der Linie heißt: Für diesen Zeitraum ist ein Pivot-Alarm scharf.</li></ul></div><div class=\"ibox\"><h3>Liquidations-Heatmap</h3><ul><li>Schätzung aus Binance-Daten der letzten ~21 Tage, wo Positionen liquidiert würden. <b>L1/S1</b> = stärkster Cluster (★, durchgezogen), <b>L2/S2</b> = nächster (gestrichelt), <b>LF/SF</b> = weit entferntester starker Cluster, <b>L3…</b> = weitere. Der Name steht in der Box am Anfang der Linie, rechts Preis und Volumen in Mio. $.</li><li><b>Knopf „Cluster L/S“</b> schaltet durch: alle → nur nächste → nur stärkste → nur fernste → aus.</li><li><b>🔔 Goldene gepunktete Linie</b> = Alarmstufe (Standard 1 % vor dem Cluster). <b>M</b> = Mitte zwischen L1 und S1. <b>Eigene Alarmlinien</b> (A1, A2 …) mit der Maus verschieben.</li></ul></div><div class=\"ibox\"><h3>Alarme – wo und wie</h3><ul><li><b>Wo einstellen:</b> Zahnrad → <b>Alarme</b> (Browser: Ton, Benachrichtigung, welche Alarme) · <b>Heatmap &amp; Alarme</b> (Abstand, Sperrzeit, Reaktion) · <b>Pivot-Alarme</b> · <b>Telegram</b> (Bot, Chat-ID, welche Alarme).</li><li><b>Arten:</b> Signale (Stufen und Wende), Cluster (Annäherung, Zone, Cluster erreicht), Reaktion/Durchbruch nach einem Cluster, eigene Linien, Divergenzen, offizieller Index und <b>Pivot-Alarme</b>.</li><li><b>Pivot-Alarme:</b> Zeiträume ankreuzen (7T, 1M, 3M, 6M, 12M, Alles) und wählen: <b>Tief unterschritten</b>, <b>Hoch überschritten</b>, <b>Annäherung</b> (± %). Die Stufen kommen aus den abgeschlossenen Tagen (bis gestern), jede meldet sich einmal.</li><li><b>Was in der Pivot-Meldung steht:</b> welche Stufe gebrochen wurde, ein <b>Rückblick</b> seit 2020 (wie oft der Kurs innerhalb von 7 Tagen wieder zurückkam = Fehlausbruch / Liquiditäts-Sweep, und wo er 30 Tage später stand), <b>Szenario A</b> (Sweep → erst nach Bestätigung handeln) und <b>Szenario B</b> (Ausbruch → nächstes Ziel: nächstes Pivot oder Liquidations-Cluster in Bruch-Richtung). Es gibt bewusst keine „Wahrscheinlichkeit“ ohne Daten – nur die echten Zahlen aus der Vergangenheit.</li><li>Browser-Alarme kommen nur, solange die Seite offen ist. <b>Telegram</b> kommt über das Programm auf dem PC – auch wenn die Seite zu ist.</li></ul></div><div class=\"ibox\"><h3>Wo stelle ich was ein?</h3><ul><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Zahlen, Index im Chart, Heatmap, Signale, Signale offiziell, Divergenz, Alarmlinien, Tops/Böden, Pivot, Fibo, MA, Cluster, eigene Linien, Mitte, <b>Ebenen ▾</b>, Zeitraum. Knöpfe mit Stufen (Tops/Böden, Pivot, Cluster): klicken = weiter, Rechtsklick = zurück.</li><li><b>Knöpfe am Index-Chart</b> (VrilyaSS): MA (nur Index-Linie), Stufen 75/25 und 85/15, Offizieller Index. Der MA-Knopf oben schaltet nur die Linien im Kurs-Chart.</li><li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen, Doppelklick = zurück. Die goldene Leiste zwischen den Charts ziehen = Höhe der beiden Charts.</li><li><b>Oben rechts:</b> Binance/Multi-Source, 365/90 Tage, $/€, <b>Rahmen</b>, <b>Handbuch</b>, <b>Zahnrad</b>. Sprache: DE · EN · AR – in allen drei Ansichten.</li><li><b>Zahnrad:</b> Ansicht, Sprache, Währung, offizieller Index, Stufen, Signale und Trendfilter, Divergenz, Heatmap &amp; Alarme, Pivot-Alarme, eigene Linien, Empfehlungen, Chart-Extras (Tops/Böden, Pivot, Fibonacci, MA mit Beschriftung, Farbe und Verlängerung, Rahmen, Ticker), Programm, API-Keys, Telegram, Farben.</li><li><b>Neu in V14:</b> Handbuch mit den drei Ansichten und neuen Erklärungen · Pivot-Knopf schaltet durch (P-Sicht … P-12M) · Pivot-Alarme · Zwischen-Tops/Böden · Cluster-Knopf schaltet durch, Namen in Boxen · EMA-Beschriftung auf der Linie (einstellbar), Farbe grün/rot oder abgestuft, Verlängerung · eigener MA-Knopf und Stufen-Knöpfe am Index-Chart · Trennlinien im Chart, deutlichere Leiste zum Ziehen · SMC-Titel in einer Zeile · Handbuch-Knopf in allen Ansichten · Zahnrad mit Rahmen · Ticker größer beschriftet.</li><li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});
Object.assign(T.en, {"introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the “Smart Money Fear &amp; Greed” by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p><div class=\"ibox\"><h3>What is it?</h3><p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) measure sentiment mostly from spot volume, volatility, social media and surveys.</p>\n<p>The YouTuber behind the channel <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube channel ↗</a>) showed his own, self-built index in his live streams. It measures what he considers more meaningful: how <b>futures traders</b> are positioned (funding, open interest, long/short, liquidations), where the <b>big money flows</b> go (ETF flows, stablecoins, Coinbase premium) and what the <b>macro backdrop</b> looks like (VIX, dollar).</p>\n<ul class=\"vids\"><li><b>15 Oct 2026</b> – “⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!”<br>First mention of how he <b>built</b> the index: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">from 11:57 ↗</a></li><li><b>16 Oct 2026</b> – “⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING”<br>Explains the <b>improved version</b> from the day before: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">from 8:21 ↗</a></li></ul>\n<p>According to his video his index turns <b>earlier</b> than the official one: in July 2026 it showed extreme greed weeks before the official index followed – far too late for retail investors.</p>\n<p class=\"opinion\"><b>Opinion of the site owner:</b> the official indices tend to react much later – for retail investors their signals often come weeks too late. They are made for the masses, not for early signals. There is also a conflict of interest: several providers are close to exchanges (e.g. CoinMarketCap belongs to Binance), and exchanges earn from retail trading whether it wins or loses. Do not rely on these indices alone for real investments.</p>\n<p>This page rebuilds his index from freely available data <i>(not an official page, not investment advice)</i>.</p></div><div class=\"ibox\"><h3>The three views: SMC · SMC 2 · VrilyaSS</h3><p>Switch at the top left. The index and its calculation are the same in all three views – only what is shown changes.</p>\n<h4>1 · SMC – 1:1 rebuild</h4><p>As in the Smart Money Crypto video (16 Oct 2026): title, price in $, 24-hour change, Telegram / AI models / Why this index? buttons, the 10 building blocks with the index in the middle, “Bitcoin in the next 24 hours”, “What this means now”, the chart “Where fear was and where greed” with numbers, official index, ranges and dots, and the liquidation ticker at the bottom.</p>\n<h4>2 · SMC 2 – 1:1 rebuild with light changes</h4><ul><li>Price in <b>$ and €</b> with flags <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – in the header and the ticker</li><li>Title in a <b>gold box</b>, <b>dividers</b> between title, price, 24 h, buttons and language</li><li>Ticker additionally with the <b>24 h arrow</b> and the <b>four cluster lines</b> (SF farthest short, S1 strongest short, L1 strongest long, LF farthest long) with alert level</li><li>everything else as SMC</li></ul>\n<h4>3 · VrilyaSS – SMC as the base plus all own extensions</h4><ul><li><b>Display:</b> $ and € with flags, all official indices as chips with their gap to the Smart Money index, the last 7 days, <b>tendency</b> next to “What this means now”, <b>spot &amp; futures recommendation</b>, combined <b>assessment ①②③</b>, trend &amp; method comparison (backtest)</li><li><b>Chart:</b> line/candles, index in chart, liquidation heatmap with clusters, levels 75/25 and 85/15, <b>signals</b> (triangles) with trend filter ⚠, official signals, <b>divergences</b>, <b>tops/bottoms</b>, <b>pivot</b>, <b>Fibonacci</b>, <b>MA</b> (EMA 50/200, SMA 20), L/S labels, alert and own lines, middle, layers menu, zoom like TradingView, chart shift like MT4, <b>⛶ fullscreen</b> per window</li><li><b>Alerts</b> in the browser and via Telegram (signals, clusters, reaction, own lines, pivots, divergences)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 blocks, 24 h, chart as in the video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ and € with flags</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Title box and dividers</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker with 24 h arrow and 4 cluster lines</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signals, divergences, tops/bottoms, pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap clusters, alert and own lines</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>All official indices, last 7 days, tendency</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Spot &amp; futures recommendation, assessment ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Language DE · EN · AR, frames, manual, gear</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Why VrilyaSS?</h3><ul><li><b>Same base</b> as SMC – the same index – but with tools to <b>check</b> a signal instead of following it blindly.</li><li><b>Comparison</b> with all official indices at a glance: how far is Smart Money ahead or behind?</li><li><b>Signals without repaint</b> with evaluation (hit rate after 30 days); the <b>trend filter</b> marks buys against the trend with ⚠.</li><li><b>Liquidation clusters</b> show where price may be pulled – with an alert before it gets there.</li><li><b>Tops/bottoms, pivots, Fibonacci and MA</b> show where price stands in the cycle.</li><li><b>Alerts</b> in the browser and via Telegram – no need to watch the chart all the time.</li><li>Honestly: no tool hits everything. The page helps to put things in context; it is <b>not investment advice</b>.</li></ul></div><div class=\"ibox\"><h3>Calculation</h3><ul><li><b>10 building blocks:</b> funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility (futures market) plus ETF flows, stablecoin inflow, Coinbase premium, VIX and DXY trend (flows and macro).</li><li>Each block is ranked against its own last <b>90 or 365 days</b> (0 = fear, 100 = greed; top “365 D / 90 D”).</li><li>The index is the average, shown as <b>7-day average</b>. “Binance” = Binance data only as in the video, “Multi-Source” = several exchanges.</li><li><b>Zones</b> as in the video: 0–24 extreme fear (buy) · 25–44 fear (buy in tranches) · 45–54 neutral (wait) · 55–74 greed (hold) · 75–100 extreme greed (take profits).</li><li><b>Assessment</b> below the chart: ① Smart Money, ② official index by the textbook, ③ combined (Smart Money counts double by default; 1:1, 2:1 or 3:1 in the gear). Next to “What this means now” is the <b>tendency</b> of recent weeks.</li></ul></div><div class=\"ibox\"><h3>Signals in the chart (no repaint)</h3><ul><li><b>Dots:</b> peak of an extreme phase (at least 3 days beyond the level). Filled = phase over, hollow = still running and may move.</li><li><b>Triangles:</b> ▲ below price = long, ▼ above price = short. Hollow = phase confirmed, filled = turn confirmed, filled with white border = zone left. <b>⚠</b> = buy against the trend (trend filter EMA 200 / ADX / weekly MACD).</li><li><b>Settings</b> (gear → signals): trigger, signal from day, touch ± points, method, trend filter (off / mark / hide).</li><li><b>Levels</b> 75/25 (as in the video) and 85/15, quick select also 70/30 and Fibonacci 61.8/38.2. In VrilyaSS the level buttons sit at the index chart and also switch the dots in the price chart.</li><li><b>Divergence</b> like RSI on TradingView: lower price low + higher index low = <b>bull</b>, higher price high + lower index high = <b>bear</b>. The label appears on the confirmation day and never moves.</li><li><b>Evaluation</b> under “Trend &amp; assessment”: hit rate after 30 days and how many major tops/bottoms each method caught. No method hits everything.</li></ul></div><div class=\"ibox\"><h3>Tops/bottoms (retrospective)</h3><p>Major turning points of the price that are only known <b>afterwards</b> – not a live signal, but orientation in the cycle.</p><ul><li><b>How they are counted:</b> a high counts as a <b>top</b> if price then <b>falls at least X %</b> before making a new high. A low counts as a <b>bottom</b> if price then <b>rises at least X %</b>. Daily closes are used.</li><li><b>Two levels:</b> <b>cycle</b> (default 35 %) = large ▲/▼ – the big turns of a cycle. <b>Minor</b> (default 20 %) = smaller, paler ▲/▼ marked “minor” – turns within the cycle.</li><li><b>“Tops/bottoms” button:</b> click once = cycle, twice = cycle + minor, three times = off. Right-click = one step back. The percentages are in the gear → chart extras.</li><li><b>Example:</b> between the bottom on 21 Nov 2022 (15.8K) and the top on 6 Oct 2025 (124.7K) there was no 35 % pullback – the largest were −28 % (Jan–Apr 2025) and −26 % (2024). So the whole run counts as <b>one</b> rise. The bottom of 5 Feb 2026 (62.9K) only rose 30.7 % afterwards (to 82.2K) – it shows as a minor bottom (20 %), not at 35 %. The highs of 14 Jul 2025 and 13 Aug 2025 only fell 6 % and 12 % afterwards – small minor highs that would only appear below 12 %.</li><li>The smaller the value, the more points: since 2020 there are 9 turns at 35 %, 19 at 25 %, 31 at 20 %, 52 at 15 %.</li></ul></div><div class=\"ibox\"><h3>Pivot lines</h3><ul><li><b>Highest high</b> = the highest daily high in the chosen period. <b>Lowest low</b> = the lowest daily low <b>after</b> it; if there is none yet, the lowest in the whole period. In the gear “lowest low” can be switched to “in the whole range”.</li><li><b>“Pivot” button</b> steps through: grey = off → <b>P-View</b> (what the chart shows, as before) → <b>P-7D</b> → <b>P-1M</b> → <b>P-3M</b> → <b>P-6M</b> → <b>P-12M</b> → <b>Pivot</b> (all history) → off. Right-click = back. “P-3M” means the last 3 months from today, whatever the chart shows.</li><li><b>Fibonacci</b> (“Fibo” button) spans between the pivot high and low; levels in the gear.</li><li>Colours and <b>width</b> of t
