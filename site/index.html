<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1">
<script>/* Handy: Standard "wie am PC" = Desktop-Ansicht verkleinert; "Handy-optimiert" = eigene Anordnung */
try { if (localStorage.getItem('fg6_mobile') !== 'mobile' && Math.min(screen.width, screen.height) < 900 && navigator.maxTouchPoints > 0) document.getElementById('vp').setAttribute('content', 'width=1440'); } catch (e) { }</script>
<title>Smart Money Fear & Greed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d65ac9' stroke-width='5' stroke-dasharray='50 90' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0610; --panel:#160b1b; --panel2:#1c0f24; --line:#2a1b33; --line2:#3a2747;
    --text:#f4eef8; --muted:#a397ae; --dim:#6f6479; --track:#2a1c33;
    --pink:#d65ac9; --teal:#3fd6c3; --green:#33d39a; --red:#f0566e; --gold:#f6b860;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;
    padding:18px 16px 110px;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  .page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  /* ---------- Kopfzeile ---------- */
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:24px;letter-spacing:.01em;margin-right:auto}
  .hprice{display:flex;align-items:center;gap:12px}
  .hprice b{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .chg{border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
  .chg.neg{background:rgba(240,86,110,.15);color:#ff7d90}
  .chg.pos{background:rgba(51,211,154,.14);color:#4fe0aa}
  .whyBtn{background:rgba(246,184,96,.06);border:1px solid #7a5a2c;color:var(--gold);font-weight:700;font-size:15px;padding:11px 18px;border-radius:13px}
  .seg{display:inline-flex;background:#130a18;border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px}
  .seg button{background:none;border:1px solid transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 13px;border-radius:9px;white-space:nowrap}
  .seg button.on{background:#2a1a20;border-color:#7a5a2c;color:var(--gold)}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#130a18;color:var(--muted);display:grid;place-items:center}
  .iconbtn:hover{color:var(--text)}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;position:relative}
  .main{overflow:hidden;padding:26px 30px 26px;
    background:radial-gradient(ellipse 55% 55% at 50% 52%,#3a1840 0%,#24102b 40%,#160b1b 78%)}
  .badge{display:table;margin:0 auto;border:1px solid #6a4b26;background:rgba(246,184,96,.05);color:var(--gold);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800;letter-spacing:.06em}
  .badge::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:1px}
  .h1{text-align:center;font-size:40px;font-weight:800;letter-spacing:-.01em;margin-top:18px}
  .h1sub{text-align:center;color:var(--muted);font-size:17px;margin-top:6px}
  .grid{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;z-index:1;margin-top:34px}
  .col h3{font-size:13px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-bottom:12px}
  .col.left h3{text-align:right;padding-right:84px}
  .col.right h3{padding-left:84px}
  .item{display:flex;align-items:center;gap:14px;height:72px;cursor:help}
  .col.left .item{justify-content:flex-end}
  .col.left .txt{text-align:right}
  .txt{min-width:0}
  .txt .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .txt .val{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .gauge{position:relative;width:60px;height:60px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .gauge .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .center{position:relative;width:300px;height:300px;justify-self:center}
  .center svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
  .center .inner{position:absolute;inset:36px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#1d0f24,#0c060f 72%);
    box-shadow:0 0 0 1px #3a2447,0 24px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .center .lbl{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .center .big{font-size:110px;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.03em}
  .center .zone{font-size:22px;font-weight:800}
  .center .sub{font-size:13px;color:var(--dim);margin-top:6px}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite 1.5s}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.985)}50%{opacity:.75;transform:scale(1.03)}}
  .glowArc{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
  #wires .flow{stroke-dasharray:7 70;animation:flow 2.8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-77}}

  .scale{position:relative;margin:58px 6px 0;height:52px}
  .segs{display:flex;gap:6px;height:12px;position:absolute;left:0;right:0;top:20px}
  .segs div{border-radius:6px;height:100%}
  .mk{position:absolute;transform:translateX(-50%);transition:left .8s}
  .mk.cur{top:8px;width:5px;height:36px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #160b1b}
  .mk.off{top:10px;width:4px;height:32px;border-radius:2px;background:var(--teal);box-shadow:0 0 10px rgba(63,214,195,.6)}
  .mlabel{position:absolute;transform:translateX(-50%);font-weight:800;font-size:14px;white-space:nowrap;transition:left .8s}
  .mlabel.cur{top:-16px}
  .mlabel.off{top:46px;color:var(--teal)}
  .zones{display:flex;margin:22px 6px 0;font-size:14px;color:var(--dim)}
  .zones span{text-align:center}
  .zones span.on{font-weight:800}
  .chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#1a0e20;border-radius:999px;padding:9px 16px;color:var(--muted);font-size:15px}
  .chip b{color:var(--text);font-weight:800}
  .chip i{width:9px;height:9px;border-radius:50%}
  .past{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .pcard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a0e21;border:1px solid var(--line2);border-radius:14px;padding:13px 16px}
  .pcard b{display:block;font-size:15px}
  .pcard span{font-size:13px;color:var(--muted)}
  .pcard .gauge{width:46px;height:46px}
  .pcard .gauge .num{font-size:13px}

  /* ---------- rechte Spalte ---------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .side .card{padding:22px 24px}
  .h{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .h small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim);white-space:nowrap}
  .osub{color:var(--muted);font-size:15px;line-height:1.4;margin-top:6px}
  .odds{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .odds .lab{font-size:15px;color:var(--muted)}
  .odds .big{font-size:58px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .odds .r{text-align:right}
  .obar{position:relative;height:12px;border-radius:7px;margin-top:10px;background:linear-gradient(90deg,#1da877 0%,#3fe0a5 var(--p),#e0507a var(--p),#c9416f 100%)}
  .obar i{position:absolute;top:-6px;width:3px;height:24px;border-radius:2px;background:#fff;transform:translateX(-50%);left:var(--p)}
  .inf .h{margin-top:20px}
  .inf .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:12px 15px;margin-top:9px;font-size:15px;color:var(--muted);cursor:help}
  .inf .row b{color:var(--text);font-weight:800;text-align:right;white-space:nowrap}
  .action{display:inline-flex;align-items:center;gap:14px;margin:18px 0 16px;border-radius:16px;padding:14px 26px 14px 20px;font-size:30px;font-weight:800;color:#1a0b1c;box-shadow:0 10px 30px rgba(214,90,201,.25)}
  .action i{width:14px;height:14px;border-radius:50%;background:#1a0b1c}
  .bt{font-size:16px;line-height:1.55;color:#cfc4d9}
  .bt b{color:var(--text)}
  .zl{margin-top:16px;display:flex;flex-direction:column;gap:4px}
  .zl div{display:grid;grid-template-columns:84px 1fr;align-items:center;padding:11px 15px;border-radius:12px;border:1px solid transparent;font-size:15px;color:var(--muted)}
  .zl div b{font-weight:800}
  .zl div.on{border-color:#6b4a83;background:#22122b;color:var(--text);font-weight:700}
  .note{font-size:14px;line-height:1.55;color:var(--dim);margin-top:14px}
  .note b{color:#d7cce0}

  /* ---------- Chart ---------- */
  .chart{padding:24px 26px 18px}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .ctitle{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend .ln{width:16px;height:3px;border-radius:2px;background:#fff}
  .legend .gr{width:18px;height:10px;border-radius:3px;background:linear-gradient(90deg,#8b6cff,#d65ac9,#f0566e,#f3843c,#f6cf5c)}
  .legend .dt{width:9px;height:9px;border-radius:50%}
  .ctools{display:flex;gap:10px;flex-wrap:wrap}
  .tog{background:#130a18;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:15px;padding:10px 16px;border-radius:13px}
  .tog.on{border-color:#7a5a2c;color:var(--gold);background:rgba(246,184,96,.05)}
  .rangeRow{margin-top:16px}
  .cwrap{position:relative;margin-top:10px;user-select:none}
  .csvg{width:100%;display:block}
  #priceChart{height:360px;cursor:crosshair}
  #idxChart{height:200px;cursor:crosshair}
  .clabel{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;margin:2px 0 0}
  .axisHint{position:absolute;right:4px;top:4px;font-size:11px;color:var(--dim)}
  .tt{position:fixed;pointer-events:none;z-index:50;background:#1d1026f2;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.6;min-width:170px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .tt .r{display:flex;justify-content:space-between;gap:14px}
  .tt .r span:first-child{color:var(--muted)}

  /* ---------- Tabellen ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
  .duo>*,.hero>*{min-width:0}
  .tcard{padding:22px 24px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{font-size:12px;letter-spacing:.1em;color:var(--dim);font-weight:700;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:0 6px;height:62px;border-bottom:1px solid #22142b;font-size:16px;white-space:nowrap}
  th.r,td.r{text-align:right}
  .bname{font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .bval b{font-weight:700}
  .bval small{color:var(--dim);font-size:14px;margin-left:6px}
  .bbar{width:140px;height:7px;border-radius:4px;background:#2a1c33;overflow:hidden}
  .bbar i{display:block;height:100%;border-radius:4px}
  .pts{font-weight:800;font-size:18px}
  .d7{font-weight:700;font-size:14px}
  tr.hov:hover td{background:#1d1026}
  .tl{position:relative;width:40px;height:62px}
  .tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--lc,#c45bd6)}
  .tl i{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:var(--dc);box-shadow:0 0 0 4px #160b1b}
  .zp{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
  .zp::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .sub2{display:block;font-size:13px;color:var(--dim);margin-top:2px}
  .btc b{display:block;font-weight:800}
  .btc small{font-size:13px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--dim)}
  .tabs{display:flex;gap:14px;align-items:baseline}
  .tabs button{background:none;border:0;color:var(--dim);font-size:13px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;padding:0}
  .tabs button.on{color:var(--muted)}

  .foot{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:15px;padding:4px 4px 0}
  .foot .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--green)}
  .foot .na{color:var(--dim)}
  .foot a{text-decoration:underline;cursor:pointer}

  /* ---------- Ticker ---------- */
  .ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:auto auto 1fr;background:#0a1613;border-top:1px solid #1d3a33;font-weight:800}
  .ticker>div{padding:9px 18px;display:flex;align-items:center}
  .price{font-size:32px;color:#eef8f4;gap:10px;letter-spacing:-.01em}
  .price .b{color:#f7a531;font-size:22px}
  .price .dir{font-size:16px}
  .liqtitle{border-left:1px solid #1d3a33;border-right:1px solid #1d3a33;letter-spacing:.08em;font-size:18px;color:#e6efe9}
  .liq{flex-direction:column;align-items:stretch!important;gap:4px}
  .liq .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .liq .sd{display:flex;align-items:baseline;gap:8px;font-size:27px}
  .liq small{font-size:9px;color:#9fb5ad;letter-spacing:.14em}
  .liq .l{color:#5ee0b0} .liq .s{color:#ff7a68}
  .vs{width:26px;height:26px;border-radius:50%;border:1px solid #2b4a42;display:grid;place-items:center;font-size:9px;color:#9fb5ad}
  .segbar{display:flex;gap:3px;height:9px}
  .segbar i{flex:1;border-radius:2px}
  .pcts{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#b9cfc7}

  /* ---------- Tooltip, Dialoge, Laden ---------- */
  .tip{position:fixed;z-index:60;pointer-events:none;max-width:340px;background:#1d1026f7;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;display:none;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .tip b{font-size:14px}
  .tip .r{display:flex;justify-content:space-between;gap:16px}
  .tip .r span:first-child{color:var(--muted)}
  .tip .m{color:var(--dim);margin-top:6px}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(5,2,8,.65);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .dlg{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:24px}
  .dlg h2{font-size:21px;margin-bottom:10px}
  .dlg p{color:#cfc4d9;font-size:15px;line-height:1.6;margin-top:10px}
  .dlg .muted{color:var(--muted);font-size:13px}
  .set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .set label{font-weight:700}
  .set small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:2px}
  .srcs{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;font-size:12px;margin-top:6px}
  .srcs div{display:flex;gap:8px;align-items:baseline;min-width:0}
  .srcs .st{flex:none;width:8px;height:8px;border-radius:50%}
  .srcs .m{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .btn{border:1px solid var(--line2);background:#21132a;color:var(--text);border-radius:11px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-block}
  .btn.pri{background:var(--pink);border-color:var(--pink);color:#1a0b1c}
  .loading{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:15px;text-align:center;padding:16px}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid #2a1c33;border-top-color:var(--pink);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  .price .pp{display:flex;flex-direction:column;line-height:1.05}
  .price .pp small{font-size:inherit;color:#eef8f4;font-weight:800;letter-spacing:-.01em;margin-top:0}
  .price .pp.div small{border-top:1px solid #2b4a42;margin-top:3px;padding-top:3px}
  .ticker .price{font-size:26px}
  .liqtitle{flex-direction:column;align-items:flex-start!important;justify-content:center;gap:5px}
  .liqtitle>span{font-size:21px;letter-spacing:.08em}
  .liqtitle small{font-size:13px;color:#f6c453;font-weight:700;letter-spacing:0;white-space:nowrap}
  .liqtitle small:empty{display:none}
  .price .b{font-size:56px;line-height:1;align-self:center}
  .arr{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;min-width:34px}
  .arr small{font-size:10px;letter-spacing:.14em;color:#9fb5ad;font-weight:700;text-transform:uppercase}
  .arr b{font-size:44px;line-height:1}
  .arr.day{border-left:1px solid #2b4a42;padding-left:16px;margin-left:2px}
  .arr.tick,.price .pp.sepl{border-left:1px solid #2b4a42;padding-left:14px}
  .hpp{display:flex;flex-direction:column;line-height:1.08}
  .hpp .hrow+.hrow{border-top:1px solid rgba(255,255,255,.28);margin-top:4px;padding-top:4px}
  .hrow{display:flex;align-items:center;gap:10px}
  .flag{display:inline-flex;width:30px;height:20px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.3);flex:none}
  .flag svg{width:100%;height:100%}
  .flag.sm{width:22px;height:15px}
  .trow{display:flex;align-items:center;gap:8px}
  /* Rahmen um Kästen, Überschriften in eigenen Kästen, deutlichere Tabellen-Linien (Schalter „Rahmen“) */
  body.frames .card,body.frames .top{border:var(--fw,2px) solid var(--fc,#8b8f99)!important}
  body.frames .card .h>span:first-child,body.frames .ctitle>.h,body.frames .heatinfo .ttl,body.frames .tabs button{border:1px solid var(--fc,#8b8f99);border-radius:8px;padding:4px 10px;display:inline-block}
  body.frames .card table th{border-bottom:2px solid var(--fc,#8b8f99)}
  body.frames .card table td{border-bottom-color:rgba(255,255,255,.12)}
  body.frames .card table td+td,body.frames .card table th+th{border-left:1px solid rgba(255,255,255,.14)}
  body.frames .zl{gap:0}
  body.frames .zl div{border:0;border-bottom:1px solid rgba(255,255,255,.12);border-radius:0}
  body.frames .zl div b{border-right:1px solid rgba(255,255,255,.18);margin-right:12px}

rer","hFrom":"Alarm ab","hMid":"Mitte L1/S1","hPrice":"Kurs jetzt","hAlarmPct":"Alarm-Abstand {p} %","al_lines":"Eigene Alarmlinien","al_div":"Divergenz (Bull/Bear)","al_off":"Signale offizieller Index","chipPick":"Anklicken = als Linie im Chart zeigen","chipGapAvg":"Abstand zum Ø offiziell","sig_peak_fear":"Extrempunkt Boden","sig_peak_greed":"Extrempunkt Top","mTitle":"Methoden-Vergleich (Backtest)","mNote":"seit Beginn der Daten, Stufe 1","mCol":"Methode","mN":"Kauf/Verk.","mBuyOk":"Kauf ✓","mSellOk":"Verk. ✓","mTops":"Tops","mBottoms":"Böden","mHelp":"Kauf ✓ / Verk. ✓ = Kurs 30 Tage später in Signalrichtung. Tops/Böden = große Wendepunkte (Kursbewegung ≥ 20 %), die ein passendes Signal innerhalb ±21 Tagen erwischt hat. Vergangene Ergebnisse sind keine Garantie.","st_bellColor":"Alarmlinien (Glocke)","st_midColor":"Mitte M","st_ownColor":"Eigene Linien","st_sigOffColor":"Signale offiziell","st_divBull":"Divergenz Bull","st_divBear":"Divergenz Bear","introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p>\n<h3>Worum geht es?</h3>\n<p>Die bekannten Fear &amp; Greed Indizes (z. B. alternative.me, CoinMarketCap) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen. Smart Money Crypto hat in seinen Livestreams („Jetzt wackelt der (letzte) Boden“ und „Unsere Longs sind aufgegangen! Was jetzt? Live Trading“, beide 16.10.2026) einen eigenen Index gezeigt, der stattdessen misst, was er für aussagekräftiger hält: wie Futures-Trader, große Geldflüsse und das Makro-Umfeld gerade positioniert sind. Laut seinem Video dreht dieser Index früher als der offizielle – z. B. Juli 2026: extreme Gier Wochen, bevor der offizielle Index folgte. Deshalb hält er die offiziellen Indizes für weniger brauchbar. Diese Seite baut seinen Index aus frei verfügbaren Daten nach. <i>Keine offizielle Seite, keine Anlageberatung.</i></p>\n<h3>So wird gerechnet</h3>\n<ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li>\n<li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li>\n<li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen.</li>\n<li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li><li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert. Smart Money zählt standardmäßig doppelt, weil er laut Video früher dreht – im Zahnrad 1:1, 2:1 oder 3:1.</li></ul>\n<h3>Signale im Chart (ohne Repaint)</h3>\n<ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über 75 bzw. unter 25). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li>\n<li><b>Signale als Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt (3. Tag in der Zone), voll = Wende bestätigt (5 Punkte vom Extrem zurück), voll mit weißem Rand = Zone wieder verlassen. Im Zahnrad wählbar: Signal beim Eintritt, beim Austritt oder beides.</li>\n<li><b>Stufen</b> 75/25 (wie im Video) und 85/15 – Werte und Farben im Zahnrad.</li>\n<li><b>Methode</b> (Zahnrad → Signale): Standard, Tageswert, 90 + 365 Tage, Kurs-Bestätigung oder Extrempunkt (△/▽ hohl).</li>\n<li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b> (Long-Signal), Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b> (Short-Signal). Ein Tief/Hoch ist bestätigt, wenn es danach X Tage hält (Standard 5); das Label erscheint am Bestätigungstag und wandert nie mehr.</li>\n<li><b>Signale offiziell:</b> dieselben Punkte und Signale für den offiziellen Index, in Türkis.</li>\n<li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Ehrlich: Keine Methode trifft alles. Im Backtest war die bullische Divergenz für Böden am treffsichersten, Tops sind schwieriger.</li></ul>\n<h3>Liquidations-Heatmap und Alarme</h3>\n<ul><li>Schätzung aus Binance-Daten der letzten ~21 Tage, wo Positionen liquidiert würden. <b>L1/S1</b> = stärkster Long-/Short-Cluster (durchgezogen), <b>L2/S2</b> = nächster (gestrichelt), <b>L3…</b> = weitere (gepunktet). Heller Bereich = Zone um den Cluster.</li>\n<li><b>🔔 Goldene gepunktete Linie</b> = Alarmstufe (Standard 1 % vor dem Cluster). <b>M</b> = Mitte zwischen L1 und S1 (optional). Rechts am Label stehen Preis und Volumen in Mio. $, der stärkste Cluster hat ein ★.</li><li><b>LF/SF</b> = weit entferntester starker Cluster je Seite: mindestens 50 % des Volumens des stärksten Clusters und höchstens 20 % vom Kurs entfernt (beides im Zahnrad änderbar). Zeigt, wo die nächste große Liquidität liegt, wenn L1/S1 abgeholt sind.</li><li><b>Reaktions-Alarm:</b> Wird ein Cluster angelaufen, merkt sich die Seite Zeit und Volumen. Entfernt sich der Kurs danach um 1 % in Gegenrichtung (innerhalb von 24 Std.), kommt „angelaufen → Reaktion“; läuft er 1 % über den Cluster hinaus, kommt „durchbrochen“. Beide Meldungen nennen den nächsten Cluster in Bewegungsrichtung mit Abstand und Volumen. Alle Werte im Zahnrad änderbar.</li>\n<li><b>Eigene Alarmlinien</b> (A1, A2 …): Knopf „Eigene Linien“, mit der Maus verschieben oder im Zahnrad eintragen. Alarm beim Kreuzen.</li>\n<li>Alarme kommen im Browser (Ton + Meldung, solange die Seite offen ist) und per <b>Telegram</b> (über das Programm auf dem PC, auch wenn die Seite zu ist). Jede Meldung erklärt die typischen Szenarien.</li></ul>\n<h3>Wo stelle ich was ein?</h3>\n<ul><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Zahlen, Index im Chart, Heatmap, Stufen, Signale, Signale offiziell, Divergenz, Alarmlinien, eigene Linien, <b>Ebenen ▾</b> (alles einzeln an/aus), Zeitraum.</li>\n<li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen (auch im Index-Chart), Doppelklick = zurück, Trennleiste ziehen = Höhe der Charts.</li>\n<li><b>Zahnrad:</b> Ansicht, Handy, Sprache, Währung, offizieller Index, Stufen, Signal-Methode, Divergenz, Heatmap &amp; Alarme, eigene Linien, Programm (Autostart, Intervalle, Online), API-Keys, Telegram, Knöpfe, Farben.</li>\n<li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul>\n<p class=\"muted\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});

w (hollow △/▽). Catches most tops, with many false signals.","m_div":"Divergence (settings)","m_div365":"Divergence 365 days","m_off":"Official index (phase + turn)","m_offdiv":"Divergence official index","divHead":"Divergence (like RSI on TradingView)","divLeft":"Days left (before the low/high)","divRight":"Confirmed after days (right)","divMin":"Min. distance of the two lows/highs (days)","divMax":"Max. distance (days)","divSrc":"Source","divSrc7":"7-day average","divSrcD":"Daily value","divWin":"Comparison window","divWinSub":"\"like chart\" follows 365 / 90 above","divAuto":"like chart","div_hidden":"Hidden divergence (H bull/H bear)","div_zone":"Only in fear/greed range (≤ 40 / ≥ 60)","div_official":"Also for the official index","divHelp":"Bull = price lower low, index higher low → long signal. Bear = price higher high, index lower high → short signal. A low/high counts as confirmed once it holds for the set days; the label appears on the confirmation day and never moves.","linesHead":"Own alert lines","linesNone":"No own lines yet.","lineAdd":"+ Line","lineDel":"Delete","linesHelp":"Prices in US dollars. Drag up/down in the chart (\"Own lines\" on). Alert when price crosses the line – in the browser and via Telegram.","hExtra":"More clusters","hExtraU":"per side","hCool":"Cooldown per alert","hOpt_alarmExtra":"Alerts for more clusters too","hHelp":"L1/S1 = strongest long/short cluster (solid), L2/S2 = nearest (dashed), L3… = more (dotted). 🔔 gold = alert level. The cooldown applies per cluster and price – once a cluster is taken and recalculated, the new one alerts immediately. Colours under \"Chart appearance\".","hk_top":"strongest","hk_near":"nearest","hk_extra":"further","hFrom":"alert from","hMid":"middle L1/S1","hPrice":"price now","hAlarmPct":"alert distance {p} %","al_lines":"Own alert lines","al_div":"Divergence (bull/bear)","al_off":"Official index signals","chipPick":"Click = show as line in the chart","chipGapAvg":"Gap to official avg.","sig_peak_fear":"Extreme point bottom","sig_peak_greed":"Extreme point top","mTitle":"Method comparison (backtest)","mNote":"since start of data, level 1","mCol":"Method","mN":"Buy/sell","mBuyOk":"Buy ✓","mSellOk":"Sell ✓","mTops":"Tops","mBottoms":"Bottoms","mHelp":"Buy ✓ / sell ✓ = price 30 days later in signal direction. Tops/bottoms = major turns (price move ≥ 20 %), caught = matching signal within ±21 days. Past results are no guarantee.","st_bellColor":"Alert lines (bell)","st_midColor":"Middle M","st_ownColor":"Own lines","st_sigOffColor":"Official signals","st_divBull":"Divergence bull","st_divBear":"Divergence bear","introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the \"Smart Money Fear &amp; Greed\" by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p>\n<h3>What is it?</h3>\n<p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap …) measure sentiment mostly from spot volume, volatility, social media and surveys. In his live streams (16 Oct 2026) Smart Money Crypto showed his own index that measures what he considers more meaningful: how futures traders, large flows and the macro backdrop are positioned. According to his video it turns earlier than the official one (e.g. July 2026). This page rebuilds his index from freely available data. <i>Not an official page, not investment advice.</i></p>\n<h3>Calculation</h3>\n<ul><li>10 building blocks: funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility, ETF flows, stablecoin inflow, Coinbase premium, VIX, DXY trend.</li>\n<li>Each block is ranked against its own last 90 or 365 days (0 = fear, 100 = greed); the index is the average, shown as 7-day average.</li>\n<li>Zones as in the video: 0–24 extreme fear · 25–44 fear · 45–54 neutral · 55–74 greed · 75–100 extreme greed.</li></ul>\n<h3>Signals (no repaint)</h3>\n<ul><li>Dots = peak of an extreme phase (hollow = still running). Triangles: ▲ below price = long, ▼ above = short; hollow = phase confirmed on day 3, filled = turn confirmed, white border = zone left (trigger selectable: entry, exit, both).</li>\n<li>Method (settings → signals): standard, daily, 90 + 365, price confirmation, extreme point. Divergence like RSI on TradingView (Bull/Bear label on the confirmation day). Official signals in teal.</li>\n<li>The backtest table under \"Trend &amp; assessment\" shows hit rates and how many major tops/bottoms each method caught.</li></ul>\n<h3>Heatmap and alerts</h3>\n<ul><li>L1/S1 strongest, L2/S2 nearest, L3… further clusters; 🔔 gold line = alert level (1 % before the cluster); M = middle; own lines A1, A2 … can be dragged.</li><li>LF/SF = farthest strong cluster (at least 50 % of the strongest volume, at most 20 % away). Reaction alert: after a cluster is hit, a 1 % move the other way within 24 h triggers hit → reaction; 1 % beyond the cluster triggers break – both with the next cluster.</li>\n<li>Alerts in the browser and via Telegram (through the PC program), each with typical scenarios.</li></ul>\n<h3>Controls</h3>\n<ul><li>Buttons above the chart and <b>Layers ▾</b>; mouse wheel = zoom time, drag = pan, drag right scale = zoom height, double-click = reset; gear = all settings.</li></ul>\n<p class=\"muted\">Open this window any time via \"Manual\".</p>"});

Object.assign(T.de, {"btnFrame":"Rahmen","btnExt":"Tops/Böden","btnPivot":"Pivot","extTop":"Top","extBot":"Boden","pvHi":"Höchstes Hoch","pvLo":"Tiefstes Tief","lay_ext":"Tops/Böden (rückwirkend)","lay_pivot":"Pivot-Linien (höchstes Hoch / tiefstes Tief)","sigdSet":"Signal ab Tag","sigdSub":"Tage in Folge in der Zone bis zum Signal (1 = schon beim ersten Berühren der 30/70)","tolSet":"Berührung zählt ab ± Punkte","tolSub":"z. B. 1: Index 31 zählt schon als Berührung der 30","x12Head":"Chart-Extras, Tendenz & Rahmen","extSet":"Tops/Böden: Mindest-Bewegung (%)","extSub":"rückwirkend – erst bekannt, wenn die Gegenbewegung gelaufen ist (kein Live-Signal)","pvSet":"Pivot-Linien: Bereich","pv_view":"sichtbarer Bereich","pv_all":"gesamter Verlauf","tendSet":"Tendenz: Rückblick (Tage)","frOn":"Rahmen um Kästen und Überschriften","frColor":"Rahmenfarbe","frW":"Rahmendicke (px)","tendBuy":"Tendenz kaufen","tendSell":"Tendenz verkaufen","tendUp":"Tendenz steigend","tendDown":"Tendenz fallend","tendSide":"Tendenz seitwärts","tendTxtFear":"Index war in den letzten {n} Tagen {k}× bei/unter {lo} (Tief {m} am {d}).","tendTxtGreed":"Index war in den letzten {n} Tagen {k}× bei/über {hi} (Hoch {m} am {d}).","tendTxtTrend":"Kein Extrem in den letzten {n} Tagen – 7-Tage-Trend {t}.","st_extTop":"Top-Marker","st_extBot":"Boden-Marker","st_pivotHi":"Pivot höchstes Hoch","st_pivotLo":"Pivot tiefstes Tief","heatLine2":"<b class=\"ttl\">Liquidations-Heatmap</b> (Schätzung aus Binance-Daten der letzten {h} Tage)","introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p><div class=\"ibox\"><h3>Worum geht es?</h3><p>Die bekannten Fear &amp; Greed Indizes (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen.</p>\n<p>Der YouTuber mit dem Kanal <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube-Kanal ↗</a>) hat in seinen Livestreams einen eigenen, selbst gebauten Index gezeigt. Er misst stattdessen, was er für aussagekräftiger hält: wie die <b>Futures-Trader</b> positioniert sind (Funding, Open Interest, Long/Short, Liquidationen), wohin die <b>großen Geldflüsse</b> gehen (ETF-Flows, Stablecoins, Coinbase-Premium) und wie das <b>Makro-Umfeld</b> aussieht (VIX, Dollar).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – „⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!“<br>Hier geht er <b>erstmals auf den Bau</b> seines Index ein: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">ab Minute 11:57 ↗</a></li>\n<li><b>16.10.2026</b> – „⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING“<br>Hier erklärt er die <b>verbesserte Version</b> vom Vortag genauer: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">ab Minute 8:21 ↗</a></li></ul>\n<p>Laut seinem Video und seinen Aussagen dreht sein Index <b>früher</b> als der offizielle: Im Juli 2026 zeigte er schon extreme Gier, Wochen bevor der offizielle Index folgte – für Privatanleger viel zu spät, um noch nützlich zu sein.</p>\n<p class=\"opinion\"><b>Meinung des Seitenbetreibers:</b> Die offiziellen Indizes reagieren erfahrungsgemäß deutlich später – für Privatanleger kommen ihre Signale oft Wochen zu spät, um noch nützlich zu sein. Sie sind für die breite Masse gemacht, nicht für frühe Signale. Dazu kommt ein Interessenkonflikt: Mehrere Anbieter stehen Börsen nahe (CoinMarketCap gehört z. B. zu Binance), und Börsen verdienen am Handel der Masse – egal, ob diese gewinnt oder verliert. Für echte Investitionen sollte man sich deshalb nicht allein auf diese Indizes verlassen.</p>\n<p>Diese Seite baut seinen Index aus frei verfügbaren Daten nach <i>(keine offizielle Seite, keine Anlageberatung)</i>.</p></div><div class=\"ibox\"><h3>So wird gerechnet</h3><ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li>\n<li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li>\n<li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen.</li>\n<li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li>\n<li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert (Smart Money zählt standardmäßig doppelt, im Zahnrad 1:1, 2:1 oder 3:1). Neben „Was das jetzt heißt“ steht die <b>Tendenz</b> aus den letzten Wochen.</li></ul></div><div class=\"ibox\"><h3>Signale im Chart (ohne Repaint)</h3><ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über/unter der Stufe). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li>\n<li><b>Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt, voll = Wende bestätigt (5 Punkte vom Extrem zurück), voll mit weißem Rand = Zone wieder verlassen.</li>\n<li><b>Einstellbar</b> (Zahnrad → Signale): Auslöser (Eintritt / Austritt / beides), <b>Signal ab Tag</b> (1 = schon beim ersten Berühren der 30/70, 3 = wie bisher) und <b>Berührung ± Punkte</b> (z. B. 1: Index 31 zählt schon als Berührung der 30).</li>\n<li><b>Stufen</b> 75/25 (wie im Video) und 85/15 – Werte und Farben im Zahnrad. <b>Methode:</b> Standard, Tageswert, 90 + 365 Tage, Kurs-Bestätigung oder Extrempunkt.</li>\n<li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b> (Long), Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b> (Short). Das Label erscheint am Bestätigungstag und wandert nie mehr.</li>\n<li><b>Signale offiziell:</b> dieselben Punkte und Signale für den offiziellen Index, in Türkis.</li>\n<li><b>Tops/Böden (rückwirkend):</b> große ▼ Top / ▲ Boden an den höchsten Hochs und tiefsten Tiefs eines Zyklus (Bewegung danach mindestens 35 %, einstellbar). Sie stehen erst fest, wenn die Gegenbewegung gelaufen ist – kein Live-Signal.</li>\n<li><b>Pivot:</b> waagerechte Linien am höchsten Hoch und am tiefsten Tief danach, mit Preis rechts.</li>\n<li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Keine Methode trifft alles.</li></ul></div><div class=\"ibox\"><h3>Liquidations-Heatmap und Alarme</h3><ul><li>Schätzung aus Binance-Daten der letzten ~21 Tage, wo Positionen liquidiert würden. <b>L1/S1</b> = stärkster Cluster (★, durchgezogen), <b>L2/S2</b> = nächster (gestrichelt), <b>LF/SF</b> = weit entferntester starker Cluster (mind. 50 % des stärksten, max. 20 % vom Kurs), <b>L3…</b> = weitere. Rechts stehen Preis und Volumen in Mio. $.</li>\n<li><b>🔔 Goldene gepunktete Linie</b> = Alarmstufe (Standard 1 % vor dem Cluster). <b>M</b> = Mitte zwischen L1 und S1. <b>Eigene Alarmlinien</b> (A1, A2 …) mit der Maus verschieben.</li>\n<li><b>Reaktions-Alarm:</b> Wird ein Cluster angelaufen und läuft der Kurs danach 1 % zurück, kommt „angelaufen → Reaktion“; läuft er 1 % darüber hinaus, kommt „durchbrochen“ – jeweils mit dem nächsten Cluster.</li>\n<li>Alarme kommen im Browser (solange die Seite offen ist) und per <b>Telegram</b> (über das Programm auf dem PC). Jede Meldung erklärt die typischen Szenarien.</li></ul></div><div class=\"ibox\"><h3>Wo stelle ich was ein?</h3><ul><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Zahlen, Index im Chart, Heatmap, Stufen, Signale, Signale offiziell, Divergenz, Tops/Böden, Pivot, Alarmlinien, Cluster, eigene Linien, Mitte, <b>Ebenen ▾</b>, Zeitraum.</li>\n<li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen, Doppelklick = zurück. Ende des Charts vom Rand verschieben und automatisch ans Ende scrollen wie in MT4.</li>\n<li><b>Oben rechts:</b> Binance/Multi-Source, 365/90 Tage, $/€, <b>Rahmen</b> (Kästen deutlicher), Handbuch, Zahnrad. Sprache: DE · EN · AR.</li>\n<li><b>Zahnrad:</b> Ansicht, Handy, Sprache, Währung, offizieller Index, Stufen, Signale, Divergenz, Heatmap &amp; Alarme, eigene Linien, Empfehlungen, Rahmen, Programm (Autostart, Intervalle, Online), API-Keys, Telegram, Farben.</li>\n<li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});
Object.assign(T.en, {"btnFrame":"Frames","btnExt":"Tops/bottoms","btnPivot":"Pivot","extTop":"Top","extBot":"Bottom","pvHi":"Highest high","pvLo":"Lowest low","lay_ext":"Tops/bottoms (retrospective)","lay_pivot":"Pivot lines (highest high / lowest low)","sigdSet":"Signal from day","sigdSub":"Days in a row in the zone until the signal (1 = on the first touch of 30/70)","tolSet":"Touch counts within ± points","tolSub":"e.g. 1: index 31 already counts as touching 30","x12Head":"Chart extras, tendency & frames","extSet":"Tops/bottoms: minimum move (%)","extSub":"retrospective – known only after the counter-move (no live signal)","pvSet":"Pivot lines: range","pv_view":"visible range","pv_all":"whole history","tendSet":"Tendency: look-back (days)","frOn":"Frames around boxes and headings","frColor":"Frame colour","frW":"Frame width (px)","tendBuy":"Tendency buy","tendSell":"Tendency sell","tendUp":"Tendency rising","tendDown":"Tendency falling","tendSide":"Tendency sideways","tendTxtFear":"Index was at/below {lo} {k}× in the last {n} days (low {m} on {d}).","tendTxtGreed":"Index was at/above {hi} {k}× in the last {n} days (high {m} on {d}).","tendTxtTrend":"No extreme in the last {n} days – 7-day trend {t}.","st_extTop":"Top marker","st_extBot":"Bottom marker","st_pivotHi":"Pivot highest high","st_pivotLo":"Pivot lowest low","heatLine2":"<b class=\"ttl\">Liquidation heatmap</b> (estimate from Binance data, last {h} days)","introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the \"Smart Money Fear &amp; Greed\" by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p><div class=\"ibox\"><h3>What is it?</h3><p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) measure sentiment mostly from spot volume, volatility, social media and surveys.</p>\n<p>The YouTuber behind the channel <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube channel ↗</a>) showed his own, self-built index in his live streams. It measures what he considers more meaningful: how <b>futures traders</b> are positioned, where <b>big money flows</b> go and what the <b>macro backdrop</b> looks like.</p>\n<ul class=\"vids\"><li><b>15 Oct 2026</b> – \"⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!\"<br>First mention of building the index: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">from 11:57 ↗</a></li>\n<li><b>16 Oct 2026</b> – \"⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING\"<br>Explains the improved version from the day before: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">from 8:21 ↗</a></li></ul>\n<p>According to his video his index turns <b>earlier</b> than the official one: in July 2026 it showed extreme greed weeks before the official index followed.</p>\n<p class=\"opinion\"><b>Opinion of the site owner:</b> the official indices tend to react much later – for retail investors their signals often come weeks too late. They are made for the masses, not for early signals. There is also a conflict of interest: several providers are close to exchanges (e.g. CoinMarketCap belongs to Binance), and exchanges earn from retail trading whether it wins or loses. Do not rely on these indices alone for real investments.</p>\n<p>This page rebuilds his index from freely available data <i>(not an official page, not investment advice)</i>.</p></div><div class=\"ibox\"><h3>Calculation</h3><ul><li>10 building blocks: funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility, ETF flows, stablecoin inflow, Coinbase premium, VIX, DXY trend.</li>\n<li>Each block is ranked against its own last 90 or 365 days (0 = fear, 100 = greed); the index is the average, shown as 7-day average.</li>\n<li>Zones as in the video: 0–24 extreme fear · 25–44 fear · 45–54 neutral · 55–74 greed · 75–100 extreme greed. Assessment: ① Smart Money, ② official (textbook), ③ combined; plus a tendency label.</li></ul></div><div class=\"ibox\"><h3>Signals (no repaint)</h3><ul><li>Dots = peak of an extreme phase. Triangles: ▲ below price = long, ▼ above = short; hollow = phase confirmed, filled = turn, white border = zone left.</li>\n<li>Settings: trigger (entry / exit / both), signal from day (1 = on first touch), touch tolerance ± points, method, divergence, official signals.</li>\n<li>Tops/bottoms (retrospective): cycle highs/lows after a move of at least 35 % – no live signal. Pivot: lines at the highest high and the lowest low after it.</li></ul></div><div class=\"ibox\"><h3>Heatmap and alerts</h3><ul><li>L1/S1 strongest (★), L2/S2 nearest, LF/SF farthest strong cluster, L3… further; labels show price and volume. 🔔 gold line = alert level; M = middle; own lines A1, A2 … can be dragged.</li>\n<li>Reaction alert: cluster hit → 1 % move back = reaction, 1 % beyond = break – each with the next cluster. Alerts in the browser and via Telegram.</li></ul></div><div class=\"ibox\"><h3>Controls</h3><ul><li>Buttons above the chart and <b>Layers ▾</b>; wheel = zoom, drag = pan, drag right scale = zoom height, double-click = reset; <b>Frames</b> button top right; gear = all settings. Language: DE · EN · AR.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Open this window any time via \"Manual\".</p>"});

function gauge(score, size = 60, stroke = 4) {
  const r = size / 2 - stroke - 1, C = 2 * Math.PI * r, c = color(score), p = score == null ? 0 : score / 100;
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${size / 2 - 1}" fill="#120914"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" style="filter:drop-shadow(0 0 3px ${rgba(c, .6)})"/></svg>
    <div class="num" style="color:${score == null ? '#a88fd8' : c}">${score ?? '–'}</div>`;
}
function compText(c) { // Hauptwert + Zusatz je Baustein
  const liq = D.liq24?.[MODE];
  switch (c.id) {
    case 'funding': return [sgn(c.raw, 4) + ' %', t('x_funding')];
    case 'oi': return [sgn(c.raw, 1) + ' %', t('x_oi')];
    case 'ls': return [fmt(c.raw, 2), t('x_ls_' + MODE)];
    case 'liq': return liq && liq.L + liq.S >= 2e6 ? [`${fmt(liq.L / 1e6, 0)} / ${fmt(liq.S / 1e6, 0)} ${LANG === 'de' ? 'Mio. $' : 'M $'}`, t('x_liq')] : [t('collecting'), t('x_liq')];
    case 'rsi': return ['RSI ' + fmt(c.raw, 0), t('x_rsi', { a: fmt(c.atr, 1) })];
    case 'etf': return c.raw == null ? [t('noKey'), t('x_etf')] : [sgn(c.raw, 0) + (LANG === 'de' ? ' Mio. $' : ' M $'), t('x_etf')];
    case 'stable': return [sgn(c.raw, 1) + ' %', t('x_stable')];
    case 'cbp': return [sgn(c.raw, 3) + ' %', t('x_cbp')];
    case 'vix': return [fmt(c.level, 1), t('x_vix')];
    case 'dxy': return [fmt(c.level, 1), c.raw > 0 ? t('x_dxy_up') : t('x_dxy_down')];
  }
  return ['–', ''];
}

  toast(`<b>${title}</b><br>${String(txt).replace(/\n/g, '<br>')}`);
  if (AL.notify && 'Notification' in window && Notification.permission === 'granted') try { new Notification(title, { body: String(txt).replace(/<[^>]+>/g, '') }); } catch { }
}
function checkBrowserAlerts() {
  if (!D || !H.length) return;
  const today = new Date().toISOString().slice(0, 10), seen = JSON.parse(store.get('fg6_alerted', '{}')), S = alarmState();
  const fire = (key, a) => { if (seen[key]) return; seen[key] = 1; fireAlert(a.title, a.body); };
  for (const k of ['p1', 'p2']) {
    if (k === 'p2' && !AL.p2) continue;
    for (const s of signalsFor(k)) {
      if (s.d !== today) continue;
      if ((s.kind === 'phase' || s.kind === 'exit') && !(k === 'p1' ? AL.p1 : AL.p2)) continue;
      if ((s.kind === 'turn' || s.kind === 'peak') && !AL.turn) continue;
      fire(`${s.d}:${k}:${s.kind}:${s.type}:${idxCol()}:${SIGM}`, alarmText(s.kind, { ...s, ...S, hi: LV[k].hi, lo: LV[k].lo }, LANG));
    }
    if (AL.off) for (const s of offSignalsFor(k)) { if (s.d !== today) continue; fire(`off:${s.d}:${k}:${s.kind}:${s.type}`, alarmText(s.kind, { ...s, ...S, official: true, hi: LV[k].hi, lo: LV[k].lo }, LANG)); }
  }
  if (AL.div) for (const x of [...divList(), ...(DIV.official ? divListOff().map(x => ({ ...x, official: true })) : [])]) {
    if (x.conf !== today) continue;
    fire(`div:${x.conf}:${x.type}:${x.official ? 'o' : 'u'}`, alarmText('div', { ...x, ...S, right: DIV.right }, LANG));
  }
  store.set('fg6_alerted', JSON.stringify(seen));
}

/* ================= Trend & Einschätzung ================= */
const todayKey = () => new Date().toISOString().slice(0, 10);
const dayKey = off => new Date(Date.now() - off * 864e5).toISOString().slice(0, 10);
function seriesOf(col, live) {
  const t0 = todayKey(), out = H.filter(r => r[col] != null && r[0] !== t0).map(r => ({ d: r[0], v: r[col] }));
  if (live != null) out.push({ d: t0, v: live });
  return out;
}
function trendOf(pts, days) { // Veränderung der Regressionsgeraden über den Zeitraum
  const from = dayKey(days), p = pts.filter(x => x.d > from);
  if (p.length < Math.max(3, days * 0.5)) return null;
  const t0 = Date.parse(p[0].d), xs = p.map(x => (Date.parse(x.d) - t0) / 864e5), ys = p.map(x => x.v);
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  return den ? num / den * days : 0;
}
const tword = d => d == null ? '–' : d > 4 ? t('up') : d < -4 ? t('down') : t('side');
const tarrow = d => d == null ? '<span class="flat">–</span>' : d > 4 ? `<span class="up">↑ ${sgn(d)}</span>` : d < -4 ? `<span class="down">↓ ${sgn(d)}</span>` : `<span class="flat">→ ${sgn(d)}</span>`;
const tendKey = d => d == null ? 'side' : d > 4 ? 'up' : d < -4 ? 'down' : 'side';
const VC = { xfear: ['#33d39a', 'rgba(51,211,154,.14)'], fear: ['#33d39a', 'rgba(51,211,154,.12)'], neutral: ['#c9b8ff', 'rgba(185,166,255,.12)'], greed: ['#f3a43c', 'rgba(243,164,60,.13)'], xgreed: ['#ff6b80', 'rgba(240,86,110,.15)'] };
function indexRows() { // alle Indizes für Trend, Vergleich und Zusammenfassung
  const w = WIN === '90', bk = w ? 'binance90' : 'binance', mk2 = w ? 'multi90' : 'multi';
  const rows = [
    { k: 'sm_binance', name: 'Smart Money · Binance', own: true, v: D.modes[bk]?.index, s: seriesOf(w ? 14 : 1, D.modes[bk]?.index) },
    { k: 'sm_multi', name: 'Smart Money · Multi-Source', own: true, v: D.modes[mk2]?.index, s: seriesOf(w ? 15 : 2, D.modes[mk2]?.index) }
  ];
  for (const o of OFFS) rows.push({ k: o.k, name: o.name, own: false, v: D.official[o.k], s: seriesOf(o.col, D.official[o.k]), off: o });
  for (const r of rows) { r.t7 = trendOf(r.s, 7); r.t30 = trendOf(r.s, 30); r.z = r.v == null ? null : zoneOf(r.v).k; }
  return rows;
}
function renderTrend() {
  const rows = indexRows(), sm = rows.find(r => r.k === 'sm_' + MODE), of = rows.find(r => r.k === OFFSRC && r.v != null) || rows.find(r => r.k === 'alt');
  const box = (r, title, verdictKey, whyKey) => {
    const c = color(r.v), [vc, vb] = VC[r.z] || VC.neutral;
    return `<div class="tbox"><div class="k">${title}</div>
      <div class="v"><b style="color:${c}">${r.v ?? '–'}</b><span style="color:${c}">${r.z ? t(r.z) : ''}</span></div>
      <div class="tr"><span>${t('t7')}</span><b>${tarrow(r.t7)} ${r.t7 == null ? '' : tword(r.t7)}</b></div>
      <div class="tr"><span>${t('t30')}</span><b>${tarrow(r.t30)} ${r.t30 == null ? '' : tword(r.t30)}</b></div>
      <div class="verdict" style="color:${vc};background:${vb}">${r.z ? t(verdictKey + r.z) + t('trendAdd_' + tendKey(r.t7)) : '–'}</div>
      <div class="why">${t(whyKey)}</div></div>`;
  };
  $('tcols').innerHTML = box(sm, t('tSM', { m: MODE === 'multi' ? 'Multi-Source' : 'Binance' }), 'act_', 'ourWhy') + box(of, t('tOff', { s: of.name }), 'tb_', 'tbWhy');
  $('overall').innerHTML = combText(sm, of) + ' ' + overallText(sm, of);
  $('csum').innerHTML = t('sumHead', { v: sm.v ?? '–', z: sm.z ? t(sm.z) : '–', t: tword(sm.t7), a: sm.z ? t('act_' + sm.z) : '–', s: of.name, o: of.v ?? '–', oz: of.z ? t(of.z) : '–', ot: tword(of.t7), tb: of.z ? t('tb_' + of.z) : '–' }) + ' ' + combText(sm, of) + ' ' + overallText(sm, of) + (liqShort() ? ' ' + liqShort() : '');
}
// ③ kombiniert: Smart Money (Zone wie im Video) und offizieller Index nach Lehrbuch, Gewichtung im Zahnrad (Standard 2:1)
const ZSCORE = { xfear: 2, fear: 1, neutral: 0, greed: -1, xgreed: -2 };
function combText(sm, of) {
  if (!sm.z || !of.z) return '';
  const w = +store.get('fg11_cw', '2') || 2, a = ZSCORE[sm.z], b = ZSCORE[of.z], c = (w * a + b) / (w + 1);
  const k = c >= 1.4 ? 'c_buy' : c >= 0.6 ? 'c_tranche' : c > -0.6 ? 'c_wait' : c > -1.4 ? 'c_hold' : 'c_sell';
  const add = a * b < 0 ? t('c_conflict') : a === b && a !== 0 ? t('c_agree') : '';
  return t('sumComb', { c: t(k), x: add, w });
}
function overallText(sm, of) {
  if (sm.v == null || of.v == null) return '';
  const fearish = z => z === 'fear' || z === 'xfear', greedy = z => z === 'greed' || z === 'xgreed', d = sm.v - of.v;
  let s = fearish(sm.z) && fearish(of.z) ? t('sum_both_buy') + ' ' : greedy(sm.z) && greedy(of.z) ? t('sum_both_sell') + ' ' : '';
  s += Math.abs(d) >= 10 ? t(d < 0 ? 'sum_sm_lower' : 'sum_sm_higher', { d: Math.abs(d) }) : t('sum_close', { d: Math.abs(d) });
  return s;
}
function renderCompare() {

  for (const r of rows) {

    h += `<tr class="${sel ? 'sel ' : ''}${pick ? 'pick' : ''}" ${pick ? `data-off="${r.k}"` : ''}><td><b>${r.name}</b>${r.own ? `<span class="badge2">${t('ownBadge')}</span>` : sel ? `<span class="badge2" style="color:var(--teal);border-color:#2a6b62">${t('chipOffSrc')}</span>` : ''}</td>
      <td class="r pts" style="color:${r.v == null ? 'var(--dim)' : c}">${r.v ?? '–'}</td>
      <td>${r.v == null ? `<span class="flat">${t('cgOnlyKey')}</span>` : `<span class="zp" style="color:${c};background:${rgba(c, .14)}">${t(r.z)}</span>`}</td>
      <td class="r d7">${tarrow(r.t7)}</td><td class="r d7">${tarrow(r.t30)}</td>
      <td style="color:${vc};font-weight:700">${r.z ? t((r.own ? 'act_' : 'tb_') + r.z) : '–'}</td></tr>`;
  }
  // CoinAnk: nur auf ihrer Webseite (automatische Abfragen gesperrt)
  h += `<tr><td><b>CoinAnk</b></td><td class="r pts flat">–</td><td><span class="flat">${t('onlySite')}</span></td><td></td><td></td><td><a class="btn sm" href="https://coinank.com/indexdata/fearGreed" target="_blank" rel="noopener">${t('openSite')} ↗</a></td></tr>`;
  $('cTable').innerHTML = h;
  $('cTable').querySelectorAll('tr[data-off]').forEach(tr => tr.onclick = () => setOff(tr.dataset.off));
}

/* ================= Live-Preis (Binance) ================= */
function livePrice() {
  let ws;
  try { ws = new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@ticker/eurusdt@ticker'); } catch { return; }
  let last = 0;
  ws.onmessage = e => {
    const j = JSON.parse(e.data), m = j.data;
    if (j.stream === 'eurusdt@ticker') { LIVE.eur = +m.c; return; }
    const p = +m.c;
    LIVE.dir = LIVE.price ? Math.sign(p - LIVE.price) || LIVE.dir : 0; LIVE.price = p; LIVE.ch = +m.P;
    if (D && Date.now() - last > 1000) { last = Date.now(); renderHeader(); renderTicker(); checkLineBrowser(); if (Date.now() - (checkReactBrowser.t || 0) > 5000) { checkReactBrowser.t = Date.now(); checkReactBrowser(); } if (Date.now() - (checkHeatBrowser.t || 0) > 30000) { checkHeatBrowser.t = Date.now(); checkHeatBrowser(); } }
  };
  ws.onclose = () => setTimeout(livePrice, 5000);
}
// Einzeldatei: Liquidationen live im Browser sammeln (seit dem Öffnen)
const BLIQ = { binance: { L: 0, S: 0 }, multi: { L: 0, S: 0 } };
function liveLiquidations() {
  const add = (bin, isLong, v) => { if (!(v > 0)) return; const k = isLong ? 'L' : 'S'; if (bin) BLIQ.binance[k] += v; BLIQ.multi[k] += v; };
  const ws = (url, sub, fn) => { try { const w = new WebSocket(url); w.onopen = () => sub && w.send(JSON.stringify(sub)); w.onmessage = e => { try { fn(JSON.parse(e.data)); } catch { } }; w.onclose = () => setTimeout(() => ws(url, sub, fn), 5000); } catch { } };
  ws('wss://fstream.binance.com/market/stream?streams=!forceOrder@arr', null, m => { const o = m.data?.o; if (o) add(true, o.S === 'SELL', +o.z * +o.ap); });
  ws('wss://stream.bybit.com/v5/public/linear', { op: 'subscribe', args: ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'DOGEUSDT'].map(s => 'allLiquidation.' + s) }, m => { for (const x of m.data || []) add(false, x.S === 'Buy', +x.v * +x.p); });
  setInterval(() => { if (D && STANDALONE) { D.liq24 = JSON.parse(JSON.stringify(BLIQ)); renderTicker(); } }, 3000);
}
