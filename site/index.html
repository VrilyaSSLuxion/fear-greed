05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – في العنوان والشريط</li><li>العنوان داخل <b>إطار ذهبي</b>، و<b>خطوط فاصلة</b> بين العنوان والسعر و24 ساعة والأزرار واللغة</li><li>الشريط مع <b>سهم 24 ساعة</b> إضافةً إلى <b>أسطر التجمّعات الأربعة</b> (SF أبعد شورت، S1 أقوى شورت، L1 أقوى لونغ، LF أبعد لونغ) مع مستوى التنبيه</li><li>وكل ما عدا ذلك مثل SMC</li></ul>\n<h4>3 · VrilyaSS – SMC كأساس مع كل الإضافات الخاصة</h4><ul><li><b>العرض:</b> الدولار واليورو مع الأعلام، كل المؤشرات الرسمية كبطاقات مع الفرق عن مؤشر Smart Money، آخر 7 أيام، <b>الاتجاه</b> بجانب «ماذا يعني هذا الآن»، <b>توصية سبوت وعقود آجلة</b>، <b>تقييم ①②③</b> مركّب، الاتجاه ومقارنة الطرق (اختبار تاريخي)</li><li><b>الرسم:</b> خط/شموع مع حجم شمعة قابل للاختيار، المؤشر داخل الرسم، خريطة التصفيات (Binance / Bybit / OKX / مجمّع)، المستويات، <b>الإشارات</b> مع فلتر الاتجاه ⚠، الإشارات الرسمية، <b>الانحرافات</b>، <b>القمم/القيعان</b>، <b>البيفوت</b>، <b>فيبوناتشي</b>، <b>المتوسطات</b>، تسميات L/S، خطوط التنبيه والخطوط الخاصة، المنتصف، <b>مربع الاتجاه</b>، قائمة الطبقات، التكبير مثل TradingView، إزاحة نهاية الرسم مثل MT4، <b>⛶ ملء الشاشة</b> لكل نافذة</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام (الإشارات، التجمّعات، رد الفعل، الخطوط الخاصة، البيفوت، الانحرافات)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>المؤشر، 10 مكوّنات، 24 ساعة، الرسم كما في الفيديو</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>الدولار واليورو مع الأعلام</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>إطار العنوان والخطوط الفاصلة</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الشريط مع سهم 24 ساعة و4 أسطر تجمّعات</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>الإشارات، الانحرافات، القمم/القيعان، البيفوت، فيبوناتشي، المتوسطات</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>تجمّعات الخريطة، خطوط التنبيه والخاصة، مربع الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>كل المؤشرات الرسمية، آخر 7 أيام، الاتجاه</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>توصية سبوت وعقود آجلة، تقييم ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>اللغة DE · EN · AR، الإطارات، الدليل، الإعدادات</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>لماذا VrilyaSS؟</h3><ul><li><b>نفس الأساس</b> مثل SMC – نفس المؤشر – لكن مع أدوات <b>للتحقق</b> من الإشارة بدلاً من اتباعها بشكل أعمى.</li><li><b>مقارنة</b> مع كل المؤشرات الرسمية بنظرة واحدة: كم يسبقها Smart Money أو يتأخر عنها؟</li><li><b>إشارات بلا إعادة رسم</b> مع تقييم (نسبة النجاح بعد 30 يوماً)؛ و<b>فلتر الاتجاه</b> يعلّم الشراء عكس الاتجاه بـ ⚠.</li><li><b>تجمّعات التصفيات</b> تُظهر إلى أين قد يُسحب السعر – مع تنبيه قبل الوصول.</li><li><b>القمم/القيعان والبيفوت وفيبوناتشي والمتوسطات ومربع الاتجاه</b> تبيّن موقع السعر واتجاهه الحالي.</li><li><b>تنبيهات</b> في المتصفح وعبر تيليغرام – لا حاجة لمراقبة الرسم طوال الوقت.</li><li>بصراحة: لا توجد أداة تصيب دائماً. الصفحة تساعد على الفهم، وهي <b>ليست نصيحة استثمارية</b>.</li></ul></div><div class=\"ibox\"><h3>طريقة الحساب</h3><ul><li><b>10 مكوّنات:</b> التمويل، تغيّر الفائدة المفتوحة، نسبة لونغ/شورت، التصفيات، RSI والتقلّب (سوق العقود الآجلة)، وتدفقات ETF، تدفق العملات المستقرة، علاوة Coinbase، VIX واتجاه DXY (التدفقات والاقتصاد الكلي).</li><li>كل مكوّن يُقارن بآخر <b>90 أو 365 يوماً</b> من قيمه (0 = خوف، 100 = طمع؛ في الأعلى «365 ي / 90 ي»).</li><li>المؤشر هو المتوسط، ويُعرض كـ<b>متوسط 7 أيام</b>. «Binance» = بيانات Binance فقط كما في الفيديو، «Multi-Source» = عدة بورصات (مرّر الفأرة للشرح).</li><li><b>المناطق</b> كما في الفيديو: 0–24 خوف شديد (شراء) · 25–44 خوف (شراء على دفعات) · 45–54 محايد (انتظار) · 55–74 طمع (احتفاظ) · 75–100 طمع شديد (جني الأرباح).</li><li><b>التقييم</b> تحت الرسم: ① Smart Money، ② المؤشر الرسمي حسب الكتاب، ③ مركّب (Smart Money يُحسب مرتين افتراضياً؛ 1:1 أو 2:1 أو 3:1 في الإعدادات). بجانب «ماذا يعني هذا الآن» يظهر <b>الاتجاه</b> في الأسابيع الأخيرة.</li></ul></div><div class=\"ibox\"><h3>الرسم: الفترة، الشموع، خط السعر، الاتجاه</h3><ul><li><b>الفترة</b> (الأزرار بعد «الفترة:» – 7 أيام، شهر … الكل) = مقدار ما تراه، <b>وليس</b> حجم الشمعة. الأزرار المترابطة في مربع واحد (الخريطة + المصدر، الإشارات + الرسمية، البيفوت + الفترات، التجمّعات + المنتصف، خطوط التنبيه + الخاصة)؛ وتمرير الفأرة يشرح الحالة وأثر النقر والنقر الأيمن.</li><li><b>الشمعة</b> (الاختيار بجانب خط/شموع): <b>تلقائي</b> = حتى 10 أيام شموع ساعة، وإلا شموع يومية (كما سابقاً) · <b>15د / 1س / 4س</b> = شموع دقائق/ساعات مباشرة من Binance، فقط عند النهاية الحالية وبقدر ما تمتد البيانات (15د ≈ 10 أيام، 1س ≈ 41 يوماً، 4س ≈ 166 يوماً) – إن امتدت الفترة أبعد تُعرض شموع يومية مع ملاحظة · <b>يوم</b> = دائماً يومية · <b>أسبوع</b> = شموع أسبوعية (من الاثنين إلى الأحد) · <b>شهر</b> = شموع شهرية · <b>سنة</b> = شموع سنوية.</li><li><b>رسم المؤشر</b> في الأسفل يبقى دائماً <b>يومياً</b> – المؤشر يُحسب مرة واحدة في اليوم. لذلك لا يوجد 1د أو 5د: لن يتحرك شيء في الأسفل، وفي الأعلى سيظهر ضجيج فقط.</li><li><b>خط السعر الحالي</b> (حتى مقياس السعر، مثل TradingView): أبيض متقطّع افتراضياً. في الإعدادات ← إضافات الرسم: منقّط / متقطّع / متصل، السماكة، اللون و<b>وضع اللون أخضر/أحمر مثل TradingView</b> – أخضر عندما يكون السعر فوق افتتاح الشمعة الحالية، وأحمر عندما يكون تحته. ألوان الملصق (الوضع الثابت) تحت «الألوان».</li><li><b>مربع الاتجاه</b> بجانب المفتاح: الحركة الحالية (افتراضياً آخر 24 ساعة، أو «السعر فوق/تحت EMA» بفترة وإطار زمني 1س / 4س / يوم)، مع <b>الهدف التالي</b> (البيفوت التالي في هذا الاتجاه) و<b>أكبر تجمّع</b> باتجاه اللونغ (تحت) أو باتجاه الشورت (فوق).</li><li><b>المتوسطات</b> (EMA 50/200 في رسم السعر، SMA 20 في رسم المؤشر): باليورو تُحسب EMA مباشرة من أسعار اليورو فتكون ناعمة. التسمية واللون (ثابت / أخضر-أحمر / متدرّج) في الإعدادات؛ التمديد لكل خط على حدة (افتراضياً 5 شموع) ويتوقف عند حافة الرسم اليمنى. لمتوسط المؤشر مربع «SMA 20» خاص وزر «MA» خاص عند رسم المؤشر وإعدادات خاصة (متصل/متقطّع/منقّط، السماكة، وضع اللون).</li><li><b>العناوين</b> «أين كان الخوف وأين الطمع» و«المؤشر · متوسط 7 أيام» صفراء بإطار أسمك لتتميز عن الأزرار (اللون في الإعدادات). سحب الشريط بين الرسمين = تغيير الارتفاع.</li></ul></div><div class=\"ibox\"><h3>الإشارات في الرسم (بلا إعادة رسم)</h3><ul><li><b>النقاط:</b> قمة مرحلة قصوى (3 أيام على الأقل بعد المستوى). ممتلئة = انتهت المرحلة، مفرّغة = ما زالت جارية وقد تتحرك.</li><li><b>المثلثات:</b> ▲ تحت السعر = شراء (لونغ)، ▼ فوق السعر = بيع (شورت). مفرّغ = تأكيد المرحلة، ممتلئ = تأكيد الانعطاف، ممتلئ بحافة بيضاء = مغادرة المنطقة.</li><li><b>فلتر الاتجاه (⚠)</b> للشراء <b>والبيع</b>: ⚠ بجانب ▲ = شراء عكس اتجاه هابط (السعر تحت EMA 200، أو ADX مع تقدّم −DI، أو MACD الأسبوعي سالب). ⚠ بجانب ▼ = بيع عكس اتجاه صاعد (السعر فوق EMA 200، أو ADX مع تقدّم +DI، أو MACD الأسبوعي موجب). «تعليم» يعرض ⚠، «إخفاء» يزيل هذه الإشارات تماماً، «إيقاف» لا يفحص. الإعدادات ← الإشارات (ويمكن: شراء + بيع / شراء فقط / بيع فقط). ورسالة التنبيه تذكر «عكس الاتجاه».</li><li><b>قابلة للضبط</b> (الإعدادات ← الإشارات): المُطلِق، الإشارة من اليوم، اللمس ± نقاط، الطريقة، فلتر الاتجاه.</li><li><b>المستويات</b> 75/25 (كما في الفيديو) و85/15، واختيار سريع أيضاً 70/30 وفيبوناتشي 61.8/38.2. في VrilyaSS توجد أزرار المستويات عند رسم المؤشر، وهي تبدّل النقاط والإشارات في رسم السعر أيضاً – إذا كانت كلها متوقفة فلن تعرض «الإشارات» شيئاً (ويُذكر ذلك عند تمرير الفأرة).</li><li><b>الانحراف</b> مثل RSI في TradingView: قاع أدنى للسعر + قاع أعلى للمؤشر = <b>Bull</b>، قمة أعلى للسعر + قمة أدنى للمؤشر = <b>Bear</b>. تظهر التسمية يوم التأكيد ولا تتحرك بعدها.</li><li><b>التقييم</b> تحت «الاتجاه والتقييم»: نسبة النجاح بعد 30 يوماً وكم من القمم/القيعان الكبيرة التقطتها كل طريقة – وأيضاً لفلاتر الاتجاه ولكل نوع من إشارات خط 50. لا توجد طريقة تصيب كل شيء.</li></ul></div><div class=\"ibox\"><h3>القمم/القيعان (بأثر رجعي)</h3><p>نقاط انعطاف كبيرة للسعر تُعرف فقط <b>بعد حدوثها</b> – ليست إشارة مباشرة، بل توجيه داخل الدورة.</p><ul><li><b>طريقة العدّ:</b> تُعدّ القمة <b>قمة</b> إذا <b>هبط</b> السعر بعدها <b>X % على الأقل</b> قبل أن يصنع قمة جديدة. ويُعدّ القاع <b>قاعاً</b> إذا <b>صعد</b> السعر بعده <b>X % على الأقل</b>. الحساب بأسعار الإغلاق اليومية.</li><li><b>مستويان:</b> <b>الدورة</b> (افتراضياً 35 %) = ▲/▼ كبيرة. <b>فرعي</b> (افتراضياً 20 %) = ▲/▼ أصغر وأبهت مع «فرعي».</li><li><b>زر «القمم/القيعان»:</b> نقرة = الدورة، نقرتان = الدورة + الفرعي، ثلاث نقرات = إيقاف. نقرة يمنى = رجوع. النسب في الإعدادات ← إضافات الرسم.</li><li><b>مثال:</b> بين القاع في 21.11.2022 (15.8K) والقمة في 06.10.2025 (124.7K) لم يحدث تراجع بنسبة 35 % – الأكبر كان −28 % (يناير–أبريل 2025) و−26 % (2024). لذلك يُعدّ المسار كله صعوداً <b>واحداً</b>. قاع 05.02.2026 (62.9K) صعد بعده 30.7 % فقط – يظهر كقاع فرعي (20 %) لا عند 35 %. قمتا 14.07 و13.08.2025 هبط السعر بعدهما 6 % و12 % فقط – قمم فرعية صغيرة.</li><li>كلما صغرت القيمة زادت النقاط: منذ 2020 توجد 9 انعطافات عند 35 %، و19 عند 25 %، و31 عند 20 %، و52 عند 15 %.</li></ul></div><div class=\"ibox\"><h3>خطوط البيفوت وفيبوناتشي</h3><ul><li><b>الفترة</b>: المرئي (ما يعرضه الرسم – يُعاد حسابه فوراً مع كل تحريك وتكبير، مثل «Visible Range» في TradingView)، 7 أيام، شهر، 3 أو 6 أو 12 شهراً أو الكل. عبر <b>▾ بجانب «Pivot»</b> يمكن اختيار <b>عدة فترات معاً</b>؛ عندها يحمل كل خط فترته في التسمية وتُدمج القيم المتساوية. زر «Pivot» نفسه للتشغيل/الإيقاف فقط.</li><li><b>الحساب</b> (قائمة ▾ والإعدادات): <b>أعلى قمة وأدنى قاع في الفترة</b> (افتراضي) · <b>أدنى قاع بعد القمة</b> (للحركات الهابطة) · <b>أعلى قمة بعد القاع</b> (للحركات الصاعدة). وإن لم يوجد بعد، يُؤخذ أقصى ما في الفترة كلها.</li><li><b>العملة:</b> يُحسب بالعملة المعروضة. باليورو يُحوَّل كل يوم بسعر EUR/USD الخاص به ثم يُبحث عن القمة/القاع (حتى V15 كان البحث بالدولار ثم التحويل – فقد يكون يوم آخر أعلى باليورو). يبقى ملف V15 المنفرد بالحساب القديم للمقارنة.</li><li><b>فيبوناتشي</b> (زر «Fibo») بين قمة البيفوت وقاعه للفترة المختارة (الإعدادات: «فيبوناتشي من الفترة»، الافتراضي = أول فترة مختارة). الاتجاه مثل TradingView: الحركة الهابطة (قمة قبل قاع) تُقاس من القاع، والصاعدة (قاع قبل قمة) من القمة. المستويات تشغيل/إيقاف بلون خاص: 38.2 أحمر، 50 أبيض، 61.8 أخضر، 78.6 أزرق، 88.7 أحمر (≈ الجذر التربيعي لـ 78.6 %)، 23.6 متوقف.</li><li>ألوان خطوط البيفوت وسماكتها في الإعدادات. 🔔 على الخط = تنبيه البيفوت مفعّل لهذه الفترة.</li></ul></div><div class=\"ibox\"><h3>خط 50 في رسم المؤشر</h3><p>50 هو المنتصف بين الخوف والطمع. زر <b>«50»</b> عند رسم المؤشر يعرض الخط (النوع والسماكة واللون في الإعدادات) وإشاراته – برمز في رسم المؤشر وكأسهم صغيرة في رسم السعر (قابلة للإيقاف). أخضر = لونغ، أحمر = شورت.</p><ul><li><b>B · ارتداد</b>: يأتي المؤشر إلى 50 من الأعلى، يلمس المنطقة ثم يصعد مجدداً.</li><li><b>A · رفض</b>: يأتي المؤشر إلى 50 من الأسفل ثم يهبط مجدداً.</li><li><b>D↑ / D↓ · اختراق/كسر</b>: يغلق المؤشر بوضوح فوق (تحت) المنطقة حول 50.</li><li><b>R↑ / R↓ · إعادة اختبار</b>: بعد الاختراق يعود المؤشر إلى 50 خلال أيام قليلة ثم يستمر في اتجاه الاختراق.</li><li><b>F↑ · اختراق كاذب للأعلى (فخ الثيران)</b>: اختراق للأعلى، تفشل إعادة الاختبار، يعود المؤشر تحت 50 ← شورت. <b>F↓ · كسر كاذب للأسفل (فخ الدببة)</b>: العكس ← لونغ. هكذا تنشأ أنماط M وW حول 50.</li><li><b>المنطقة والتأكيد</b> منفصلان للونغ والشورت (افتراضياً 3 نقاط لكل منهما): اللمس = دخول المنطقة حول 50؛ يتأكد الارتداد/الرفض عندما يرجع المؤشر بعدها بنقاط التأكيد أو يغادر المنطقة من الجهة التي أتى منها. تُحسب إعادة الاختبار والاختراق الكاذب حتى عدد الأيام المضبوط بعد الاختراق (افتراضياً 20).</li><li>تظهر الإشارات <b>يوم التأكيد</b> ولا تتحرك. كل نوع قابل للتشغيل/الإيقاف، وله سطر خاص في مقارنة الطرق، وتنبيه عند الرغبة (المتصفح وتيليغرام).</li></ul></div><div class=\"ibox\"><h3>خريطة التصفيات – كيف تُقدَّر</h3><ul><li>الخريطة <b>تقدير خاص</b> وليست قائمة مراكز حقيقية: إذا ارتفعت <b>الفائدة المفتوحة</b> في ساعة ما، فقد فُتحت مراكز جديدة. تُقسَّم إلى لونغ وشورت حسب نسبة المشترين في تلك الساعة، وتُوزَّع على رافعات شائعة (5×، 10×، 25×، 50×، 100× بنسب 10 / 30 / 30 / 20 / 10 %). ومن ذلك ينتج سعر تصفية لكل جزء (عند 10× نحو 10 % من سعر الدخول).</li><li>إذا وصل السعر إلى مستوى ما يُعدّ مُصفّى ويُحذف. وإذا انخفضت الفائدة المفتوحة تصغر كل المستويات المفتوحة بالتناسب. تُستخدم آخر 500 ساعة (≈ 21 يوماً).</li><li><b>المصدر قابل للاختيار</b> (▾ بجانب «الخريطة»، بعلامات): <b>Binance</b> و<b>Bybit</b> و<b>OKX</b> بأي تركيبة، مثلاً Binance + Bybit فقط. مسار السعر ونسبة المشترين من Binance دائماً (سعر BTC متقارب في كل مكان)، والفائدة المفتوحة من البورصة المختارة. الاختيار يسري أيضاً على خطوط التجمّعات والشريط والتنبيهات.</li><li><b>L1/S1</b> = أقوى تجمّع (★)، <b>L2/S2</b> = الأقرب، <b>LF/SF</b> = أبعد تجمّع قوي، <b>L3…</b> = أخرى؛ الاسم داخل مربع في بداية الخط. <b>زر «التجمّعات L/S»</b>: الكل ← الأقرب فقط ← الأقوى فقط ← الأبعد فقط ← إيقاف. <b>🔔 الخط الذهبي</b> = مستوى التنبيه، <b>M</b> = المنتصف بين L1 وS1، <b>خطوط التنبيه الخاصة</b> (A1 …) قابلة للسحب.</li><li><b>للمقارنة</b> (نماذج أخرى ونتائج أخرى): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>مصادر أخرى للخريطة – ما الممكن وما غير الممكن</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: يعرض هو أيضاً <b>تقديراً</b> (عدة نماذج، بورصات كثيرة). لا توجد واجهة عامة ولا تنزيل للبيانات – لذلك كرابط فقط.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: بيانات الخريطة عبر الواجهة الرسمية فقط في خطة «Professional» (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ شهرياً ↗</a>) – مكلفة جداً؛ والموقع نفسه محمي من القراءة الآلية.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: لا توجد واجهة رسمية؛ الموقع محمي من الروبوتات ولا تتجاوز هذه الصفحة الحماية. توجد نسخة مدفوعة من طرف ثالث عبر <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ لكل 1000 طلب، غير رسمية وقد تتوقف في أي وقت).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: خريطة مجانية كصورة فقط على الموقع (بيانات Hyperliquid)، بلا واجهة.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: خريطة من بيانات Hyperliquid عبر واجهة، فقط في خطط مدفوعة بمفتاح.</li><li><b>MEXC</b>: يوفّر علناً الفائدة المفتوحة الحالية فقط بلا سجل بالساعة – لذلك ليس (بعد) في التقدير.</li></ul></div><div class=\"ibox\"><h3>التنبيهات – أين وكيف</h3><ul><li><b>أين تُضبط:</b> الإعدادات ← <b>التنبيهات</b> (المتصفح: الصوت، الإشعار، أي تنبيهات، <b>الصوت والتكرار لكل نوع</b>) · <b>الخريطة والتنبيهات</b> · <b>تنبيهات البيفوت</b> · <b>تيليغرام</b>.</li><li><b>نوافذ التنبيه</b> تبقى في أعلى اليمين حتى تغلقها: <b>✕</b> = إغلاق فقط (التذكيرات مستمرة)، <b>حسناً، تم</b> = إغلاق بلا تذكيرات أخرى. تتراكم عدة تنبيهات. زر <b>🔔</b> في الأعلى يعرض عدد التنبيهات المفتوحة ويفتح <b>سجل التنبيهات</b> (الوقت، النوع، الاتجاه، النص كاملاً).</li><li><b>التكرار</b> لكل نوع: الفاصل (5 دقائق … 4 ساعات) والحد الأقصى – افتراضياً لتنبيهات البيفوت كل ساعتين بحد أقصى 5 مرات، وللبقية متوقف. تصل تذكيرات البيفوت عبر تيليغرام أيضاً ما دام المستوى مكسوراً. <b>الأصوات</b>: جرس، نغمة مزدوجة، صاعد، هابط، إنذار، هادئ – لكل نوع مع ▶ للاستماع.</li><li><b>تنبيهات البيفوت</b> (مفعّلة افتراضياً لشهر و3 و6 أشهر): كسر القاع، اختراق القمة، اقتراب (± %). المستويات من الأيام المكتملة (حتى الأمس)، بنفس حساب خطوط البيفوت.</li><li><b>محتوى رسالة البيفوت:</b> أي مستوى كُسر؛ <b>نظرة إلى الماضي</b> منذ 2020 – كم مرة أغلق السعر خلال 7 أيام على الجهة الأخرى بعد كسر كهذا (اختراق كاذب / سحب سيولة) وأين كان بعد 30 يوماً؛ و<b>التقييم</b> منها: من 60 % عودة «تاريخياً غالباً اختراق كاذب ← حركة معاكسة على الأرجح، بعد التأكيد فقط»، حتى 40 % «تاريخياً غالباً استمرار»، وما بينهما «مختلط»؛ مع السيناريو أ (سحب سيولة) وب (كسر ← البيفوت أو التجمّع التالي). التقييم من أرقام حقيقية فقط – بلا احتمالية مختلقة.</li><li><b>خطوط التنبيه الخاصة</b> (A1 …): فوق السعر أحمر، تحته أخضر (أو لون ثابت، الإعدادات ← الخطوط الخاصة). تنبيه عند العبور.</li><li>تنبيهات المتصفح تصل فقط والصفحة مفتوحة. <b>تيليغرام</b> يأتي من البرنامج على الكمبيوتر – حتى والصفحة مغلقة.</li></ul></div><div class=\"ibox\"><h3>وظائف أخرى</h3><ul><li><b>بيتكوين في الـ 24 ساعة القادمة:</b> متوسط سلّم أسعار Polymarket وتقييم المنطقة الخاص (كم مرة كان السعر أعلى في اليوم التالي)؛ حجم الخط في الإعدادات.</li><li><b>ماذا يعني هذا الآن:</b> الإجراء حسب المنطقة كما في الفيديو، وبجانبه <b>الاتجاه</b> في الأسابيع الأخيرة.</li><li><b>آخر 7 أيام</b> يوماً بيوم مع المؤشر والقيمة اليومية والمؤشرات الرسمية والسعر.</li><li><b>توصية سبوت وعقود آجلة</b> لكل منطقة (قالب، النصوص قابلة للتعديل) و<b>تقييم السيولة</b> (هل اللونغ أم الشورت أقرب وأكثف من السعر؟).</li><li><b>⛶ ملء الشاشة</b> لكل نافذة (Esc = رجوع). <b>تسميات L/S</b> عند النقاط، <b>قائمة الطبقات</b> لكل عناصر الرسم، إزاحة نهاية الرسم والتمرير التلقائي مثل MT4.</li><li><b>الشريط:</b> اسحب المقبض لتغيير الحجم (نقر مزدوج = الافتراضي)، اللسان على اليمين <b>يخفيه بالكامل</b> ويظهره، واللسان <b>⇅</b> بجانبه ينقله <b>أعلى/أسفل</b> (وأيضاً في الإعدادات).</li><li><b>سطر الحالة</b> في الأعلى بجانب SMC · SMC 2 · VrilyaSS: يعرض العرض الحالي؛ في SMC/SMC 2 ينقلك النقر على الملاحظة إلى VrilyaSS. وإن كانت نسخة أحدث تعمل، يظهر في الأعلى «نسخة جديدة – إعادة التحميل».</li><li><b>ماذا يعني هذا الآن:</b> الإجراء والاتجاه في زرّين متساويين – بنفس الحجم في كل اللغات. وفي العنوان يبقى $ و€ بأرقام متساوية العرض تحت بعضهما.</li><li><b>الإطارات والألوان:</b> زر «الإط  المعروضة، الافتراضي «أعلى قمة + أدنى قاع في الفترة» مع «القاع بعد القمة» و«القمة بعد القاع» وعدة فترات معاً · خط 50 مع 8 أنواع إشارات · فلتر الاتجاه للبيع أيضاً · نوافذ التنبيه تبقى، سجل التنبيهات، التكرار والأصوات لكل نوع، تنبيهات البيفوت افتراضياً لشهر/3/6 أشهر مع التقييم · بورصات الخريطة بأي تركيبة · شموع شهرية وسنوية · متوسط المؤشر بمربع وإعدادات خاصة والتمديد لكل خط · أزرار في مربعات وشروح عند التمرير · خطوط التنبيه الخاصة أحمر/أخضر · لسان الشريط أعلى/أسفل وقيم أكبر · سطر الحالة وملاحظة النسخة الجديدة · إطارات أوضح للجداول ومربعات الاتجاه · زرّان متساويان في «ماذا يعني هذا الآن» · مسافة أقل في SMC · إطار أسمك لزر الإعدادات.</li><li><b>البيانات:</b> على الكمبيوتر كل دقيقة (قابل للضبط)، وعلى الإنترنت كل 10 دقائق. الوقت مذكور في التذييل.</li></ul></div><p class=\"muted\" style=\"text-align:center\">يمكن فتح هذه النافذة في أي وقت عبر «الدليل».</p>"});

Object.assign(T.de, {"introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p><div class=\"ibox\"><h3>Worum geht es?</h3><p>Die bekannten Fear &amp; Greed Indizes (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen.</p>\n<p>Der YouTuber mit dem Kanal <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube-Kanal ↗</a>) hat in seinen Livestreams einen eigenen, selbst gebauten Index gezeigt. Er misst stattdessen, was er für aussagekräftiger hält: wie die <b>Futures-Trader</b> positioniert sind (Funding, Open Interest, Long/Short, Liquidationen), wohin die <b>großen Geldflüsse</b> gehen (ETF-Flows, Stablecoins, Coinbase-Premium) und wie das <b>Makro-Umfeld</b> aussieht (VIX, Dollar).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – „⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!“<br>Hier geht er <b>erstmals auf den Bau</b> seines Index ein: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">ab Minute 11:57 ↗</a></li><li><b>16.10.2026</b> – „⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING“<br>Hier erklärt er die <b>verbesserte Version</b> vom Vortag genauer: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">ab Minute 8:21 ↗</a></li></ul>\n<p>Laut seinem Video und seinen Aussagen dreht sein Index <b>früher</b> als der offizielle: Im Juli 2026 zeigte er schon extreme Gier, Wochen bevor der offizielle Index folgte – für Privatanleger viel zu spät, um noch nützlich zu sein.</p>\n<p class=\"opinion\"><b>Meinung des Seitenbetreibers:</b> Die offiziellen Indizes reagieren erfahrungsgemäß deutlich später – für Privatanleger kommen ihre Signale oft Wochen zu spät, um noch nützlich zu sein. Sie sind für die breite Masse gemacht, nicht für frühe Signale. Dazu kommt ein Interessenkonflikt: Mehrere Anbieter stehen Börsen nahe (CoinMarketCap gehört z. B. zu Binance), und Börsen verdienen am Handel der Masse – egal, ob diese gewinnt oder verliert. Für echte Investitionen sollte man sich deshalb nicht allein auf diese Indizes verlassen.</p>\n<p>Diese Seite baut seinen Index aus frei verfügbaren Daten nach <i>(keine offizielle Seite, keine Anlageberatung)</i>.</p></div><div class=\"ibox\"><h3>Die drei Ansichten: SMC · SMC 2 · VrilyaSS</h3><p>Oben links umschalten. Der Index und seine Berechnung sind in allen drei Ansichten gleich – es ändert sich nur, was angezeigt wird.</p>\n<h4>1 · SMC – 1:1-Nachbau</h4><p>So wie im Video von Smart Money Crypto (16.10.2026): Titel, Kurs in $, 24-Stunden-Änderung, Knöpfe Telegram / KI-Modelle / Warum dieser Index?, die 10 Bausteine mit dem Index in der Mitte, „Bitcoin in den nächsten 24 Stunden“, „Was das jetzt heißt“, der Chart „Wo Angst war und wo Gier“ mit Zahlen, Offiziellem Index, Zeiträumen und Punkten, unten der Liquidations-Ticker.</p>\n<h4>2 · SMC 2 – 1:1-Nachbau mit leichten Änderungen</h4><ul><li>Kurs in <b>$ und €</b> mit Flaggen <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – im Titel und im Ticker</li><li>Titel im <b>goldenen Kasten</b>, <b>Trennstriche</b> zwischen Titel, Kurs, 24 h, Knöpfen und Sprache</li><li>Ticker zusätzlich mit <b>24-h-Pfeil</b> und den <b>vier Cluster-Zeilen</b> (SF fernster Short, S1 stärkster Short, L1 stärkster Long, LF fernster Long) samt Alarm-Stufe</li><li>sonst alles wie SMC</li></ul>\n<h4>3 · VrilyaSS – SMC als Basis plus alle eigenen Erweiterungen</h4><ul><li><b>Anzeige:</b> $ und € mit Flaggen, alle offiziellen Indizes als Chips mit Abstand zum Smart-Money-Index, die letzten 7 Tage einzeln, <b>Tendenz</b> neben „Was das jetzt heißt“, <b>Empfehlung Spot &amp; Futures</b>, kombinierte <b>Einschätzung ①②③</b>, Trend &amp; Methoden-Vergleich (Backtest)</li><li><b>Chart:</b> Linie/Kerzen mit wählbarer Kerzengröße, Index im Chart, Liquidations-Heatmap (Binance / Bybit / OKX / kombiniert), Stufen, <b>Signale</b> mit Trendfilter ⚠, Signale offiziell, <b>Divergenzen</b>, <b>Tops/Böden</b>, <b>Pivot</b>, <b>Fibonacci</b>, <b>MA</b>, L/S-Labels, Alarm- und eigene Linien, Mitte, <b>Richtungs-Kasten</b>, Ebenen-Menü, Zoomen wie TradingView, Chart-Ende verschieben wie MT4, <b>⛶ Vollbild</b> je Fenster</li><li><b>Alarme</b> im Browser und per Telegram (Signale, Cluster, Reaktion, eigene Linien, Pivots, Divergenzen)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 Bausteine, 24 h, Chart wie im Video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ und € mit Flaggen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Titel-Kasten und Trennstriche</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker mit 24-h-Pfeil und 4 Cluster-Zeilen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signale, Divergenzen, Tops/Böden, Pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap-Cluster, Alarm- und eigene Linien, Richtungs-Kasten</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>alle offiziellen Indizes, letzte 7 Tage, Tendenz</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Empfehlung Spot &amp; Futures, Einschätzung ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Sprache DE · EN · AR, Rahmen, Handbuch, Zahnrad</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Warum VrilyaSS?</h3><ul><li><b>Gleiche Basis</b> wie SMC – derselbe Index –, aber mit Werkzeugen, um ein Signal zu <b>prüfen</b>, statt ihm blind zu folgen.</li><li><b>Vergleich</b> mit allen offiziellen Indizes auf einen Blick: Wie weit liegt Smart Money vorne oder hinten?</li><li><b>Signale ohne Repaint</b> mit Auswertung (Trefferquote nach 30 Tagen); der <b>Trendfilter</b> markiert Käufe gegen den Trend mit ⚠.</li><li><b>Liquidations-Cluster</b> zeigen, wohin der Kurs gezogen werden kann – mit Alarm, bevor er dort ist.</li><li><b>Tops/Böden, Pivots, Fibonacci, MA und der Richtungs-Kasten</b> ordnen ein, wo der Kurs steht und wohin er gerade läuft.</li><li><b>Alarme</b> im Browser und per Telegram – man muss nicht ständig auf den Chart schauen.</li><li>Ehrlich gesagt: Kein Werkzeug trifft alles. Die Seite hilft beim Einordnen, sie ist <b>keine Anlageberatung</b>.</li></ul></div><div class=\"ibox\"><h3>So wird gerechnet</h3><ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li><li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li><li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen (Maus darüber zeigt die Erklärung).</li><li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li><li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert (Smart Money zählt standardmäßig doppelt, im Zahnrad 1:1, 2:1 oder 3:1). Neben „Was das jetzt heißt“ steht die <b>Tendenz</b> aus den letzten Wochen.</li></ul></div><div class=\"ibox\"><h3>Chart: Zeitraum, Kerzen, Kurslinie, Richtung</h3><ul><li><b>Zeitraum</b> (Knöpfe hinter „Zeitraum:“ – 7 Tage, 1 Monat … Alles) = wie viel man sieht, <b>nicht</b> die Kerzengröße. Zusammengehörige Knöpfe stehen in einem Kasten (Heatmap + Quelle, Signale + offiziell + Muster, Pivot + Zeiträume, Cluster + Mitte, Alarmlinien + eigene Linien); Maus darüber erklärt Zustand und Wirkung von Klick und Rechtsklick.</li><li><b>Kerze</b> (Auswahl neben Linie/Kerzen): <b>Auto</b> = bis 10 Tage Stundenkerzen, sonst Tageskerzen (wie bisher) · <b>15m / 1h / 4h</b> = Minuten-/Stundenkerzen direkt von Binance, nur am aktuellen Ende und so weit die Daten zurückreichen (15m ≈ 10 Tage, 1h ≈ 41 Tage, 4h ≈ 166 Tage) – reicht der Zeitraum weiter zurück, werden Tageskerzen gezeigt und daneben steht ein Hinweis · <b>1T</b> = immer Tageskerzen · <b>1W</b> = Wochenkerzen (Montag bis Sonntag) · <b>1M</b> = Monatskerzen · <b>1J</b> = Jahreskerzen.</li><li>Der <b>Index-Chart</b> unten bleibt immer <b>täglich</b> – den Index gibt es nur einmal pro Tag. Darum gibt es kein 1m und 5m: Unten würde sich nichts bewegen, oben wäre fast nur Rauschen.</li><li><b>Aktuelle Kurslinie</b> (bis zur Preisskala, wie TradingView): Standard weiß und gestrichelt. Im Zahnrad → Chart-Extras einstellbar: gepunktet / gestrichelt / durchgezogen, Dicke, Farbe und <b>Farbmodus grün/rot wie TradingView</b> – grün, wenn der Kurs über der Eröffnung der aktuellen Kerze liegt, rot, wenn er darunter liegt. Die Label-Farben (Modus fest) stehen unter „Farben“.</li><li><b>Richtungs-Kasten</b> neben der Legende: aktuelle Bewegung (Standard: letzte 24 h, umstellbar auf „Kurs über/unter EMA“ mit eigener Periode und Zeitrahmen 1h / 4h / 1T), dazu das <b>nächste Ziel</b> (nächstes Pivot in diese Richtung) und der <b>größte Cluster</b> Richtung Long (darunter) bzw. Richtung Short (darüber).</li><li><b>MA</b> (EMA 50/200 im Kurs-Chart, SMA 20 im Index-Chart): in € wird die EMA direkt aus den Euro-Kursen gerechnet und ist dadurch glatt. Beschriftung, Farbe (fest / grün-rot / abgestuft) im Zahnrad; Verlängerung je Linie einzeln (Standard 5 Kerzen), sie endet am rechten Chart-Rand. Die Index-MA hat ihre eigene Box „SMA 20“, eigenen Knopf „MA“ am Index-Chart und eigene Einstellungen (durchgezogen/gestrichelt/gepunktet, Dicke, Farbmodus).</li><li><b>Überschriften</b> „Wo Angst war und wo Gier“ und „Index · 7-Tage-Mittel“ sind gelb und dicker umrahmt, damit sie sich von den Knöpfen abheben (Farbe im Zahnrad). Die Leiste zwischen den beiden Charts ziehen = Höhe ändern.</li></ul></div><div class=\"ibox\"><h3>Signale im Chart (ohne Repaint)</h3><ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über/unter der Stufe). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li><li><b>Dreiecke:</b> ▲ unter dem Kurs = Kauf (Long), ▼ über dem Kurs = Verkauf (Short). Hohl = Phase bestätigt, voll = Wende bestätigt, voll mit weißem Rand = Zone wieder verlassen.</li><li><b>Trendfilter (⚠)</b>, für Kauf <b>und</b> Verkauf: ⚠ neben ▲ = Kauf gegen einen Abwärtstrend (Kurs unter EMA 200, ADX mit −DI vorne oder Wochen-MACD negativ). ⚠ neben ▼ = Verkauf gegen einen Aufwärtstrend (Kurs über EMA 200, ADX mit +DI vorne oder Wochen-MACD positiv). Modus „markieren“ zeigt ⚠, „ausblenden“ entfernt solche Signale ganz, „aus“ prüft nicht. Einstellbar unter Zahnrad → Signale (auch: gilt für Kauf + Verkauf / nur Kauf / nur Verkauf). Die Alarm-Meldung bekommt dann den Hinweis „Gegen den Trend“.</li><li><b>Einstellbar</b> (Zahnrad → Signale): Auslöser, Signal ab Tag, Berührung ± Punkte, Methode, Trendfilter.</li><li><b>Stufen</b> 75/25 (wie im Video) und 85/15, Schnellwahl auch 70/30 und Fibonacci 61,8/38,2. Die Stufen-Knöpfe stehen in VrilyaSS beim Index-Chart und schalten auch die Punkte und Signale im Kurs-Chart – sind beide aus, zeigen „Signale“ nichts (das steht dann auch beim Darüberfahren).</li><li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b>, Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b>. Das Label erscheint am Bestätigungstag und wandert nie mehr.</li><li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat – auch für die Trendfilter und jede Art der 50er-Signale. Keine Methode trifft alles.</li></ul></div><div class=\"ibox\"><h3>Tops/Böden (rückwirkend)</h3><p>Große Wendepunkte des Kurses, die erst <b>im Nachhinein</b> feststehen – kein Live-Signal, sondern Orientierung im Zyklus.</p><ul><li><b>So wird gezählt:</b> Ein Hoch zählt als <b>Top</b>, wenn der Kurs danach mindestens <b>X % fällt</b>, bevor er ein neues Hoch macht. Ein Tief zählt als <b>Boden</b>, wenn der Kurs danach mindestens <b>X % steigt</b>. Gerechnet wird mit Tagesschlusskursen.</li><li><b>Zwei Stufen:</b> <b>Zyklus</b> (Standard 35 %) = große ▲/▼. <b>Zwischen</b> (Standard 20 %) = kleinere, blassere ▲/▼ mit „Zw.“.</li><li><b>Knopf „Tops/Böden“:</b> 1× klicken = Zyklus, 2× = Zyklus + Zwischen, 3× = aus. Rechtsklick = zurück. Prozent-Werte im Zahnrad → Chart-Extras.</li><li><b>Beispiel:</b> Zwischen dem Boden am 21.11.2022 (15,8K) und dem Top am 06.10.2025 (124,7K) gab es keinen Rücksetzer von 35 % – die größten waren −28 % (Jan.–Apr. 2025) und −26 % (2024). Darum zählt die ganze Strecke als <b>ein</b> Anstieg. Der Boden vom 05.02.2026 (62,9K) stieg danach nur um 30,7 % – er erscheint als Zwischen-Boden (20 %), aber nicht bei 35 %. Die Hochs vom 14.07. und 13.08.2025 fielen danach nur 6 % bzw. 12 % – das sind kleine Zwischenhochs.</li><li>Je kleiner der Wert, desto mehr Punkte: seit 2020 sind es bei 35 % 9 Wendepunkte, bei 25 % 19, bei 20 % 31, bei 15 % 52.</li></ul></div><div class=\"ibox\"><h3>Pivot-Linien und Fibonacci</h3><ul><li><b>Zeitraum</b>: Sicht (was der Chart gerade zeigt – wird bei jedem Verschieben und Zoomen sofort neu gerechnet, wie „Visible Range“ bei TradingView), 7 Tage, 1, 3, 6 oder 12 Monate oder Alles. Über das <b>▾ neben „Pivot“</b> lassen sich <b>mehrere Zeiträume gleichzeitig</b> ankreuzen; jede Linie trägt dann ihren Zeitraum im Label, gleiche Werte werden zusammengefasst (z. B. „Tiefstes Tief Sicht·3M“). Der Knopf „Pivot“ selbst schaltet nur an/aus.</li><li><b>Berechnung</b> (im ▾-Menü und im Zahnrad): <b>höchstes Hoch und tiefstes Tief im Zeitraum</b> (Standard) · <b>tiefstes Tief nach dem Hoch</b> (nur Tiefs, die nach dem höchsten Hoch kamen – für Abwärtsbewegungen) · <b>höchstes Hoch nach dem Tief</b> (nur Hochs nach dem tiefsten Tief – für Aufwärtsbewegungen). Gibt es danach noch keins, gilt das Extrem im ganzen Zeitraum.</li><li><b>Währung:</b> Gerechnet wird in der angezeigten Währung. In € wird jeder Tag mit seinem eigenen EUR/USD-Kurs umgerechnet und erst dann das Hoch/Tief gesucht (bis V15 wurde in $ gesucht und danach umgerechnet – dadurch konnte in € ein anderes Hoch höher liegen). Die V15-Einzeldatei mit der alten Rechnung bleibt zum Vergleich erhalten.</li><li><b>Fibonacci</b> (Knopf „Fibo“) zwischen Pivot-Hoch und -Tief des gewählten Zeitraums (Zahnrad: „Fibonacci aus Zeitraum“, Standard = erster angehakter). Richtung wie bei TradingView: Abwärtsbewegung (Hoch vor Tief) misst vom Tief, Aufwärtsbewegung (Tief vor Hoch) vom Hoch aus. Stufen einzeln an/aus mit Farbe: 38,2 rot, 50 weiß, 61,8 grün, 78,6 blau, 88,7 rot (≈ Wurzel aus 78,6 %), 23,6 aus.</li><li>Farben und Dicke der Pivot-Linien im Zahnrad. 🔔 an der Linie = für diesen Zeitraum ist ein Pivot-Alarm scharf.</li></ul><p><b>V17 – Linien genau am Docht:</b> Bei 4h-, 1h- und 15m-Kerzen in € wurde bisher jede Kerze mit dem <i>heutigen</i> Euro-Kurs umgerechnet, die Pivot-Linien aber mit dem Kurs des jeweiligen Tages. Dadurch lag die Linie etwas neben dem Docht (z. B. Linie 75,5K, Docht 75,0K). Jetzt wird jede Stundenkerze mit dem Kurs <i>ihres</i> Tages umgerechnet – Linie und Docht stimmen genau überein, und der Punkt sitzt an der Kerze mit dem Extrem. In $ war es immer genau. Die Beschriftung rechts wird so breit wie das längste Label, damit z. B. „🔔 Höchstes Hoch 1M·3M 77,5K“ nicht mehr abgeschnitten wird.</p></div><div class=\"ibox\"><h3>50er-Linie im Index-Chart</h3><p>Die 50 ist die Mitte zwischen Angst und Gier. Knopf <b>„50er“</b> am Index-Chart blendet die Linie (Art, Dicke, Farbe im Zahnrad) und ihre Signale ein – im Index-Chart mit Kürzel, im Kurs-Chart als kleine Pfeile (abschaltbar). Grün = Long, rot = Short.</p><ul><li><b>B · Bounce</b>: Index kommt von oben an die 50, berührt die Zone und läuft wieder hoch.</li><li><b>A · Ablehnung</b>: Index kommt von unten an die 50 und dreht wieder nach unten.</li><li><b>D↑ / D↓ · Durchbruch</b>: Index schließt klar über (unter) der Zone um die 50.</li><li><b>R↑ / R↓ · Retest</b>: nach einem Durchbruch kommt der Index innerhalb weniger Tage zurück an die 50 und läuft weiter in Ausbruchsrichtung.</li><li><b>F↑ · Fehlausbruch hoch (Bullenfalle)</b>: Durchbruch nach oben, der Retest scheitert, Index fällt zurück unter die 50 → Short. <b>F↓ · Fehlausbruch runter (Bärenfalle)</b>: umgekehrt → Long. So entstehen M- und W-Muster um die 50.</li><li><b>Zone und Bestätigung</b> getrennt für Long und Short (Standard je 3 Punkte): Als Berührung zählt die Zone um die 50; bestätigt ist ein Bounce/eine Ablehnung, wenn der Index danach um die Bestätigungs-Punkte zurückläuft oder die Zone wieder auf der Ausgangsseite verlässt. Retest und Fehlausbruch zählen bis zur eingestellten Zahl Tage nach dem Durchbruch (Standard 20).</li><li>Signale erscheinen am <b>Bestätigungstag</b> und wandern nicht mehr. Jede Art ist einzeln schaltbar, hat eine eigene Zeile im Methoden-Vergleich (wie oft der Kurs danach in die richtige Richtung lief) und auf Wunsch einen Alarm (Browser und Telegram).</li></ul><p><b>Schritt für Schritt</b> (Beispiel Gier-Seite, der Index steht über 50):</p><ol><li>Der Index fällt an die 50 und ist damit in der <b>Zone</b> (50 ± Zonen-Punkte).</li><li>Läuft er danach um die Bestätigungs-Punkte wieder hoch (oder verlässt die Zone nach oben) → <b>B · Bounce</b> (Long). Fällt er stattdessen klar unter die Zone → <b>D↓ · Durchbruch</b> (Short).</li><li>Nach einem D↓ kommt der Index innerhalb der Retest-Tage von unten zurück an die 50. Dreht er dort wieder nach unten → <b>R↓ · Retest hält</b> (Short). Steigt er stattdessen klar über die Zone → <b>F↓ · Bärenfalle</b> (Long).</li><li>Auf der Angst-Seite genauso, nur gespiegelt: <b>A</b> (Ablehnung, Short), <b>D↑</b>, <b>R↑</b>, <b>F↑</b> (Bullenfalle, Short).</li></ol><p><b>Rückblick</b> (Binance 90 Tage, seit 2020, Kurs 30 Tage nach dem Signal in Signalrichtung):</p><ul><li>B · Bounce 7 von 13 richtig, Ø +12,4 % · F↓ · Bärenfalle 8 von 14, Ø +7,1 % · R↑ · Retest Long 6 von 11, Ø +2,5 % · A · Ablehnung 4 von 7, Ø +1,7 % · D↑ 7 von 19, Ø +1,2 %</li><li>D↓ 9 von 17, Ø −4,6 % · F↑ · Bullenfalle 8 von 16, Ø −4,2 % · R↓ · Retest Short 3 von 10, Ø −20,6 % (bisher am schwächsten)</li></ul><p class=\"muted\">Die aktuellen Zahlen stehen immer im Methoden-Vergleich – sie ändern sich mit jedem neuen Tag.</p></div><div class=\"ibox\"><h3>Kerzenmuster im Extrem (Knopf „Muster“)</h3><p>Ein Kerzenmuster allein ist ein schwaches Signal. Zusammen mit <b>extremer Angst oder Gier</b> kann es eine Wende anzeigen. Darum zählt ein Muster nur, wenn der Index im Extrem ist: <b>bullische Muster</b> (Long) bei ≤ 30, <b>bärische Muster</b> (Short) bei ≥ 70 – am Kerzentag oder bis zu 3 Tage davor. Alles im Zahnrad änderbar.</p><ul><li><b>H · Hammer</b> (bullisch): kleiner Körper oben, langer unterer Docht (mindestens doppelt so lang wie der Körper), kaum oberer Docht – Verkäufer drückten den Kurs runter, Käufer holten ihn zurück.</li><li><b>iH · Umgekehrter Hammer</b>: kleiner Körper unten, langer oberer Docht.</li><li><b>E↑ · Bullisches Engulfing</b>: grüne Kerze, deren Körper den roten Körper des Vortags ganz umschließt.</li><li><b>PL · Piercing Line</b>: nach einer großen roten Kerze schließt eine grüne über der Mitte ihres Körpers.</li><li><b>MS · Morning Star</b>: große rote Kerze, dann eine kleine, dann eine grüne, die über die Mitte der ersten schließt.</li><li>Bärisch, spiegelbildlich: <b>SS · Shooting Star</b> (langer oberer Docht), <b>HM · Hanging Man</b> (Hammer-Form nach einem Anstieg), <b>E↓ · Bärisches Engulfing</b>, <b>DC · Dark Cloud Cover</b>, <b>ES · Evening Star</b>.</li></ul><p><b>Im Chart:</b> Knopf „Muster“ (im Kasten mit den Signalen). Das Kürzel steht in einem Kasten unter der Kerze (Long, grün) bzw. darüber (Short, rot); Maus darauf zeigt den vollen Namen. <b>⚠</b> = gegen den Trend (gleicher Trendfilter wie bei den Signalen). Die Zahl auf dem Knopf = Muster im sichtbaren Zeitraum.</p><p><b>Ohne Repaint:</b> Gezählt werden nur <b>geschlossene Tageskerzen</b> – das Muster erscheint nach Tagesschluss (00:00 UTC = 1 bzw. 2 Uhr deutscher Zeit) und wandert nicht mehr. Bestätigung: Die nächste Kerze schließt über dem Hoch (Long) bzw. unter dem Tief (Short) der Musterkerze – das steht auch in der Alarm-Meldung.</p><p><b>Einstellungen</b> (Zahnrad → Chart-Extras, Tendenz &amp; Rahmen → Kerzenmuster im Extrem): welcher Index zählt (<i>unser Index</i> · <i>offiziell</i> · <i>beide</i> müssen im Extrem sein · <i>einer reicht</i>), Angst-Grenze (Standard 30), Gier-Grenze (70), Tage zurück (3), jedes Muster einzeln an/aus. <b>Alarm:</b> eigener Alarm „Kerzenmuster“ im Browser (Ton: Glockenspiel) und per Telegram.</p><p><b>Rückblick</b> (Tageskerzen seit 2020, Kurs 30 Tage nach dem Muster in Signalrichtung):</p><ul><li><b>Unser Index:</b> Hammer 15 von 23 richtig, Ø +2,7 % · Bullisches Engulfing 12 von 23, Ø −0,8 % · Umgekehrter Hammer 2 von 4 · Piercing Line 3 von 7, Ø −8,1 % · Morning Star 2 von 5, Ø −2,5 %. Zum Vergleich: an <i>jedem</i> Tag mit Index ≤ 30 kaufen = Ø −3,7 % – der Hammer war also deutlich besser.</li><li><b>Offizieller Index</b> (7-Tage-Mittel): Bullisches Engulfing 57 von 99, Ø +4,1 % · Umgekehrter Hammer 12 von 21, Ø +3,2 % · Hammer 48 von 94, Ø +1,3 % (jeder Tag ≤ 30: Ø +1,3 %).</li><li><b>Bärische Muster bei Gier</b> haben bisher meist versagt (z. B. Shooting Star 13 von 32, Hanging Man 3 von 11) – in Gier-Phasen lief Bitcoin oft weiter hoch. Darum nur mit Bestätigung und kleinem Risiko.</li></ul><p class=\"muted\">Aktuelle Zahlen je Muster: „Methoden-Vergleich (Backtest)“ unter „Trend &amp; Einschätzung“. Szenarien, keine Anlageberatung.</p></div><div class=\"ibox\"><h3>Liquidations-Heatmap – so wird geschätzt</h3><ul><li>Die Heatmap ist eine <b>eigene Schätzung</b>, keine echte Positionsliste: Steigt das <b>Open Interest</b> (offene Positionen) in einer Stunde, sind neue Positionen dazugekommen. Sie werden nach dem Käufer-Anteil dieser Stunde auf Longs und Shorts verteilt und auf typische Hebel aufgeteilt (5×, 10×, 25×, 50×, 100× mit 10 / 30 / 30 / 20 / 10 %). Daraus ergibt sich je Teil ein Liquidationspreis (bei 10× etwa 10 % vom Einstieg).</li><li>Hat der Kurs ein Level schon erreicht, gilt es als liquidiert und fällt weg. Sinkt das Open Interest, werden alle offenen Level anteilig kleiner. Betrachtet werden die letzten 500 Stunden (≈ 21 Tage).</li><li><b>Quelle wählbar</b> (▾ neben „Heatmap“, mit Häkchen): <b>Binance</b>, <b>Bybit</b>, <b>OKX</b> in jeder Kombination, z. B. nur Binance + Bybit. Kursverlauf und Käufer-Anteil kommen immer von Binance (der BTC-Kurs ist überall fast gleich), das Open Interest von der jeweiligen Börse. Die Wahl gilt auch für Cluster-Linien, Ticker und Alarme.</li><li><b>L1/S1</b> = stärkster Cluster (★), <b>L2/S2</b> = nächster, <b>LF/SF</b> = weit entferntester starker Cluster, <b>L3…</b> = weitere; der Name steht in der Box am Linienanfang. <b>Knopf „Cluster L/S“</b>: alle → nur nächste → nur stärkste → nur fernste → aus. <b>🔔 Goldene Linie</b> = Alarmstufe, <b>M</b> = Mitte zwischen L1 und S1, <b>eigene Alarmlinien</b> (A1 …) mit der Maus verschieben.</li><li><b>Zum Vergleich</b> (andere Modelle, andere Ergebnisse): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a> · <a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a></li></ul></div><div class=\"ibox\"><h3>Andere Heatmap-Quellen – was geht, was nicht</h3><ul><li><a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a>: zeigt ebenfalls eine <b>Schätzung</b> (mehrere Modelle, viele Börsen). Es gibt keine öffentliche Schnittstelle und keinen Daten-Download – darum nur als Link.</li><li><a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a>: Heatmap-Daten über die offizielle Schnittstelle nur im Plan „Professional“ (<a href=\"https://www.coinglass.com/pricing\" target=\"_blank\" rel=\"noopener\">699 $ im Monat ↗</a>) – zu teuer; die Webseite selbst ist gegen automatisches Auslesen geschützt.</li><li><a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a>: keine offizielle Schnittstelle; die Webseite hat einen Bot-Schutz, den diese Seite nicht umgeht. Es gibt einen bezahlten Nachbau eines Drittanbieters über <a href=\"https://apify.com/api_merge/coinank-liquidation-heatmap\" target=\"_blank\" rel=\"noopener\">Apify ↗</a> (≈ 10 $ je 1.000 Abrufe, inoffiziell, kann jederzeit ausfallen).</li><li><a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\" target=\"_blank\" rel=\"noopener\">CoinMarketCap ↗</a>: kostenlose Heatmap nur als Bild auf der Webseite (Daten von Hyperliquid), keine Schnittstelle.</li><li><a href=\"https://kiyotaka.ai\" target=\"_blank\" rel=\"noopener\">Kiyotaka ↗</a>: Heatmap aus Hyperliquid-Daten über eine Schnittstelle, nur in bezahlten Plänen mit Key.</li><li><b>MEXC</b>: liefert öffentlich nur das aktuelle Open Interest, keinen stündlichen Verlauf – darum (noch) nicht in der Schätzung.</li></ul></div><div class=\"ibox\"><h3>Alarme – wo und wie</h3><ul><li><b>Wo einstellen:</b> Zahnrad → <b>Alarme</b> (Browser: Ton, Benachrichtigung, welche Alarme, <b>Ton und Wiederholung je Alarmart</b>) · <b>Heatmap &amp; Alarme</b> · <b>Pivot-Alarme</b> · <b>Telegram</b>.</li><li><b>Alarm-Fenster</b> bleiben oben rechts stehen, bis du sie schließt: <b>✕</b> = nur schließen (Erinnerungen laufen weiter), <b>OK, erledigt</b> = schließen und keine Erinnerungen mehr. Mehrere Alarme stapeln sich. Der Knopf <b>🔔</b> oben zeigt die Zahl offener Alarme und öffnet den <b>Alarm-Verlauf</b> (Uhrzeit, Art, Richtung, voller Text).</li><li><b>Wiederholung</b> je Alarmart: Abstand (5 Min. … 4 Std.) und höchstens wie oft – Standard bei Pivot-Alarmen alle 2 Stunden, höchstens 5-mal; bei den anderen aus. Pivot-Erinnerungen kommen auch per Telegram, solange die Stufe gebrochen bleibt. <b>Töne</b>: Glocke, Doppelton, aufsteigend, absteigend, Alarm, leise – je Art wählbar und mit ▶ zum Probehören.</li><li><b>Pivot-Alarme</b> (Standard an für 1, 3 und 6 Monate): Tief unterschritten, Hoch überschritten, Annäherung (± %). Die Stufen kommen aus den abgeschlossenen Tagen (bis gestern), gleiche Berechnung wie die Pivot-Linien.</li><li><b>Was in der Pivot-Meldung steht:</b> welche Stufe gebrochen wurde; ein <b>Rückblick</b> seit 2020 – wie oft der Kurs nach so einem Bruch innerhalb von 7 Tagen wieder auf die andere Seite schloss (Fehlausbruch / Liquiditäts-Sweep) und wo er 30 Tage später stand; die <b>Einordnung</b> daraus: ab 60 % Rückkehr „historisch meist Fehlausbruch → eher Gegenbewegung, erst nach Bestätigung“, bis 40 % „historisch meist Fortsetzung“, dazwischen „gemischt“; dazu Szenario A (Sweep) und B (Ausbruch → nächstes Pivot oder Cluster). Die Einordnung kommt nur aus echten Zahlen – keine erfundene Wahrscheinlichkeit.</li><li><b>Eigene Alarmlinien</b> (A1 …): über dem Kurs rot, darunter grün (oder feste Farbe, Zahnrad → Eigene Linien). Alarm beim Kreuzen.</li><li>Browser-Alarme kommen nur, solange die Seite offen ist. <b>Telegram</b> kommt über das Programm auf dem PC – auch wenn die Seite zu ist.</li></ul><p><b>Kerzenmuster (V17):</b> eigener Alarm, sobald eine Tageskerze mit Muster im Extrem geschlossen hat – im Browser (Zahnrad → Alarme, Ton „Glockenspiel“, Wiederholung wählbar) und per Telegram (Häkchen „Kerzenmuster im Extrem“).</p></div><div class=\"ibox\"><h3>Weitere Funktionen</h3><ul><li><b>Bitcoin in den nächsten 24 Stunden:</b> Mittel aus der Polymarket-Preisleiter und der eigenen Zonen-Auswertung (wie oft der Kurs am Folgetag höher war); Schriftgröße im Zahnrad.</li><li><b>Was das jetzt heißt:</b> Handlung aus der Zone wie im Video, daneben die <b>Tendenz</b> der letzten Wochen.</li><li><b>Die letzten 7 Tage einzeln</b> mit Index, Tageswert, offiziellen Indizes und Kurs.</li><li><b>Empfehlung Spot &amp; Futures</b> je Zone (Vorlage, Texte im Zahnrad änderbar) und <b>Liquiditäts-Einschätzung</b> (liegen die Longs oder die Shorts näher und dichter am Kurs?).</li><li><b>⛶ Vollbild</b> an jedem Fenster (Esc = zurück). <b>L/S-Labels</b> an den Punkten, <b>Ebenen-Menü</b> für alle Chart-Elemente, Chart-Ende vom Rand verschieben und automatisch ans Ende scrollen wie MT4.</li><li><b>Ticker:</b> Höhe am Griff ziehen (Doppelklick = Standard), mit dem Reiter rechts <b>ganz einklappen</b> und wieder ausklappen, mit dem Reiter <b>⇅</b> daneben <b>oben/unten</b> umschalten (auch im Zahnrad).</li><li><b>Statuszeile</b> oben neben SMC · SMC 2 · VrilyaSS: zeigt die aktuelle Ansicht; in SMC/SMC 2 führt der Hinweis per Klick zu VrilyaSS. Läuft eine neuere Version, erscheint oben „Neue Version – neu laden“.</li><li><b>Was das jetzt heißt:</b> Handlung und Tendenz in zwei gleich großen Knöpfen – in allen Sprachen gleich. Im Titel stehen $ und € mit gleich breiten Ziffern genau untereinander.</li><li><b>Rahmen und Farben:</b> Knopf „Rahmen“, Farbe/Dicke, Überschriften-Farben, Chart-Farben im Zahnrad. Die obere Bedienleiste steht in einem eigenen Kasten.</li><li><b>Programm auf dem PC:</b> startet mit Windows, holt jede Minute neue Daten, veröffentlicht alle 10 Minuten den Online-Link; dazu gibt es eine Einzeldatei zum Verschicken. <b>Handy:</b> Ansicht „wie am PC“ oder „Handy-optimiert“.</li></ul><p><b>Neu in V17:</b></p><ul><li><b>Ticker:</b> $ und € stehen genau untereinander (rechtsbündig, gleich breite Ziffern). Die Pfeile sind jetzt Grafiken und sitzen exakt mittig, „TICK“ und „24 H“ stehen tiefer und auf einer Linie. Long/Short-Kästchen höher, Prozent links/rechts größer (25 px). <b>Zahnrad → Chart-Extras, Tendenz &amp; Rahmen → Ticker – Größen &amp; Abstände:</b> Schrift „TICK“/„24 H“, Abstand nach oben, Pfeile, 24h-Prozent und Abstand nach unten, Long/Short-Zahlen, Prozent, Kästchenhöhe – alle in Pixel, leeres Feld = automatisch (grau steht die aktuelle Größe), Knopf „Alle Ticker-Werte zurücksetzen“. Dazu die Größe, auf die der <b>Doppelklick</b> am oberen Rand zurückspringt (Standard 100 %).</li><li><b>Was das jetzt heißt:</b> Beide Knöpfe können pulsieren (je Knopf an/aus). Schriftgrößen für den linken Knopf (z. B. „Abwarten“, 21 px), „Tendenz:“ (15 px) und den Tendenz-Wert (z. B. „Verkaufen“, 19 px) – Zahnrad → Chart-Extras → „Was das jetzt heißt“ – Knöpfe.</li><li><b>Einschätzung</b> unter dem Chart: <b>1</b> Smart Money, <b>2</b> Offiziell (laut Lehrbuch), <b>3</b> Kombiniert (aus 1 und 2) – die Urteile stehen genau untereinander.</li><li><b>Reiter</b> „Extreme der letzten 12 Monate“ / „Die letzten 12 Tage“: Der aktive Reiter ist gelb gefüllt.</li><li>Alle Knöpfe und Kästen über dem Chart haben dieselbe Höhe; der Divergenz-Knopf ist nur so breit wie sein Text. Die Tabellen „Fear &amp; Greed im Vergleich“ und „Methoden-Vergleich“ brauchen am PC keine waagerechte Bildlaufleiste mehr.</li></ul></div><div class=\"ibox\"><h3>Für später gemerkt</h3><ul><li><b>Telegram</b> zusammen einrichten (Bot über @BotFather) – dann kommen alle Alarme aufs Handy.</li><li><b>CoinGlass-Heatmap</b> einbauen, falls irgendwann ein Key im Plan „Professional“ vorhanden ist.</li><li><b>CoinAnk über Apify</b> (bezahlt, inoffiziell) oder ein <b>Kiyotaka-Key</b> – technisch möglich, wenn gewünscht.</li><li><b>MEXC</b> aufnehmen, sobald es dort einen Open-Interest-Verlauf gibt (oder das Programm ihn selbst mitschreibt). Weitere Börsen wären über den vorhandenen Coinalyze-Key möglich.</li></ul></div><div class=\"ibox\"><h3>Wo stelle ich was ein?</h3><ul><li><b>Obere Bedienleiste</b> (ein Kasten): Ansicht · Statuszeile · Binance/Multi-Source · 365/90 Tage · $/€ · Rahmen · 🔔 Alarm-Verlauf · Handbuch · Zahnrad. Maus darüber zeigt kurze Erklärungen.</li><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Kerze (Größe), Zahlen, Index im Chart, Heatmap + ▾ Börsen, Signale + offiziell, Divergenz, Tops/Böden, Pivot + ▾ Zeiträume, Fibo, MA, Cluster + Mitte, Alarmlinien + eigene Linien, Ebenen ▾, Zeitraum. Knöpfe mit Stufen: Klick = weiter, Rechtsklick = zurück.</li><li><b>Knöpfe am Index-Chart</b> (VrilyaSS): MA (Index-Linie), 50er, Stufen, Offizieller Index.</li><li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen, Doppelklick = zurück.</li><li><b>Zahnrad:</b> Ansicht, Sprache, Währung, offizieller Index, Stufen, Signale und Trendfilter (Kauf/Verkauf), Divergenz, Heatmap &amp; Alarme, Pivot-Alarme, eigene Linien (Farben), Empfehlungen, Chart-Extras (Tops/Böden, Pivot-Berechnung, Fibonacci, MA mit Verlängerung je Linie, Index-MA, 50er-Linie, Kerzenmuster im Extrem, Kurslinie, Richtungs-Kasten, Ticker mit Größen &amp; Abständen, „Was das jetzt heißt“ – Knöpfe, Rahmen), Alarme (Ton und Wiederholung je Art), Programm, API-Keys, Telegram, Farben.</li><li><b>Neu in V17:</b> Kerzenmuster im Extrem (Knopf „Muster“, eigener Alarm) · Pivot-Linien bei 4h/1h/15m in € genau am Docht, Beschriftung nicht mehr abgeschnitten · Ticker: $/€ untereinander, Pfeile mittig, Größen und Abstände einstellbar, Doppelklick-Größe · Pulsieren und Schriftgrößen bei „Was das jetzt heißt“ · Einschätzung 1/2/3 · aktiver Reiter gelb · alle Knöpfe gleich hoch · Tabellen ohne Bildlaufleiste · 50er-Linie Schritt für Schritt erklärt.</li><li><b>Neu in V16:</b> Pivots richtig in der angezeigten Währung, Standard „höchstes Hoch + tiefstes Tief im Zeitraum“, dazu „Tief nach dem Hoch“ und „Hoch nach dem Tief“, mehrere Zeiträume gleichzeitig · 50er-Linie mit 8 Signalarten · Trendfilter auch für Verkäufe · Alarm-Fenster bleiben stehen, Alarm-Verlauf, Wiederholung und Töne je Alarmart, Pivot-Alarme standardmäßig 1M/3M/6M mit Einordnung · Heatmap-Börsen frei kombinierbar · Kerzen 1M und 1J · Index-MA mit Box und eigenen Einstellungen, Verlängerung je Linie · Knöpfe in Kästen, Erklärungen beim Darüberfahren · eigene Alarmlinien rot/grün · Ticker-Reiter oben/unten, größere Ticker-Werte · Statuszeile, Hinweis bei neuer Version · Tabellen und Trend-Kästen deutlicher umrahmt · gleich große Knöpfe bei „Was das jetzt heißt“ · weniger Abstand in SMC · Zahnrad dicker umrahmt.</li><li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});
Object.assign(T.en, {"introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the “Smart Money Fear &amp; Greed” by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p><div class=\"ibox\"><h3>What is it?</h3><p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) measure sentiment mostly from spot volume, volatility, social media and surveys.</p>\n<p>The YouTuber behind the channel <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube channel ↗</a>) showed his own, self-built index in his live streams. It measures what he considers more meaningful: how <b>futures traders</b> are positioned (funding, open interest, long/short, liquidations), where the <b>big money flows</b> go (ETF flows, stablecoins, Coinbase premium) and what the <b>macro backdrop</b> looks like (VIX, dollar).</p>\n<ul class=\"vids\"><li><b>15 Oct 2026</b> – “⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!”<br>First mention of how he <b>built</b> the index: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">from 11:57 ↗</a></li><li><b>16 Oct 2026</b> – “⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING”<br>Explains the <b>improved version</b> from the day before: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">from 8:21 ↗</a></li></ul>\n<p>According to his video his index turns <b>earlier</b> than the official one: in July 2026 it showed extreme greed weeks before the official index followed – far too late for retail investors.</p>\n<p class=\"opinion\"><b>Opinion of the site owner:</b> the official indices tend to react much later – for retail investors their signals often come weeks too late. They are made for the masses, not for early signals. There is also a conflict of interest: several providers are close to exchanges (e.g. CoinMarketCap belongs to Binance), and exchanges earn from retail trading whether it wins or loses. Do not rely on these indices alone for real investments.</p>\n<p>This page rebuilds his index from freely available data <i>(not an official page, not investment advice)</i>.</p></div><div class=\"ibox\"><h3>The three views: SMC · SMC 2 · VrilyaSS</h3><p>Switch at the top left. The index and its calculation are the same in all three views – only what is shown changes.</p>\n<h4>1 · SMC – 1:1 rebuild</h4><p>As in the Smart Money Crypto video (16 Oct 2026): title, price in $, 24-hour change, Telegram / AI models / Why this index? buttons, the 10 building blocks with the index in the middle, “Bitcoin in the next 24 hours”, “What this means now”, the chart “Where fear was and where greed” with numbers, official index, ranges and dots, and the liquidation ticker at the bottom.</p>\n<h4>2 · SMC 2 – 1:1 rebuild with light changes</h4><ul><li>Price in <b>$ and €</b> with flags <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – in the header and the ticker</li><li>Title in a <b>gold box</b>, <b>dividers</b> between title, price, 24 h, buttons and language</li><li>Ticker additionally with the <b>24 h arrow</b> and the <b>four cluster lines</b> (SF farthest short, S1 strongest short, L1 strongest long, LF farthest long) with alert level</li><li>everything else as SMC</li></ul>\n<h4>3 · VrilyaSS – SMC as the base plus all own extensions</h4><ul><li><b>Display:</b> $ and € with flags, all official indices as chips with their gap to the Smart Money index, the last 7 days, <b>tendency</b> next to “What this means now”, <b>spot &amp; futures recommendation</b>, combined <b>assessment ①②③</b>, trend &amp; method comparison (backtest)</li><li><b>Chart:</b> line/candles with selectable candle size, index in chart, liquidation heatmap (Binance / Bybit / OKX / combined), levels, <b>signals</b> with trend filter ⚠, official signals, <b>divergences</b>, <b>tops/bottoms</b>, <b>pivot</b>, <b>Fibonacci</b>, <b>MA</b>, L/S labels, alert and own lines, middle, <b>direction box</b>, layers menu, zoom like TradingView, chart shift like MT4, <b>⛶ fullscreen</b> per window</li><li><b>Alerts</b> in the browser and via Telegram (signals, clusters, reaction, own lines, pivots, divergences)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 blocks, 24 h, chart as in the video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ and € with flags</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Title box and dividers</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker with 24 h arrow and 4 cluster lines</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signals, divergences, tops/bottoms, pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap clusters, alert and own lines, direction box</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>All official indices, last 7 days, tendency</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Spot &amp; futures recommendation, assessment ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Language DE · EN · AR, frames, manual, gear</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Why VrilyaSS?</h3><ul><li><b>Same base</b> as SMC – the same index – but with tools to <b>check</b> a signal instead of following it blindly.</li><li><b>Comparison</b> with all official indices at a glance: how far is Smart Money ahead or behind?</li><li><b>Signals without repaint</b> with evaluation (hit rate after 30 days); the <b>trend filter</b> marks buys against the trend with ⚠.</li><li><b>Liquidation clusters</b> show where price may be pulled – with an alert before it gets there.</li><li><b>Tops/bottoms, pivots, Fibonacci, MA and the direction box</b> show where price stands and where it is heading.</li><li><b>Alerts</b> in the browser and via Telegram – no need to watch the chart all the time.</li><li>Honestly: no tool hits everything. The page helps to put things in context; it is <b>not investment advice</b>.</li></ul></div><div class=\"ibox\"><h3>Calculation</h3><ul><li><b>10 building blocks:</b> funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility (futures market) plus ETF flows, stablecoin inflow, Coinbase premium, VIX and DXY trend (flows and macro).</li><li>Each block is ranked against its own last <b>90 or 365 days</b> (0 = fear, 100 = greed; top “365 D / 90 D”).</li><li>The index is the average, shown as <b>7-day average</b>. “Binance” = Binance data only as in the video, “Multi-Source” = several exchanges (hover for an explanation).</li><li><b>Zones</b> as in the video: 0–24 extreme fear (buy) · 25–44 fear (buy in tranches) · 45–54 neutral (wait) · 55–74 greed (hold) · 75–100 extreme greed (take profits).</li><li><b>Assessment</b> below the chart: ① Smart Money, ② official index by the textbook, ③ combined (Smart Money counts double by default; 1:1, 2:1 or 3:1 in the gear). Next to “What this means now” is the <b>tendency</b> of recent weeks.</li></ul></div><div class=\"ibox\"><h3>Chart: range, candles, price line, direction</h3><ul><li><b>Range</b> (buttons after “Range:” – 7 days, 1 month … All) = how much you see, <b>not</b> the candle size. Buttons that belong together sit in one box (heatmap + source, signals + official + patterns, pivot + periods, clusters + middle, alert lines + own lines); hovering explains the state and what click and right-click do.</li><li><b>Candle</b> (selector next to line/candles): <b>Auto</b> = hourly candles up to 10 days, daily candles otherwise (as before) · <b>15m / 1h / 4h</b> = minute/hour candles straight from Binance, only at the current end and as far back as the data goes (15m ≈ 10 days, 1h ≈ 41 days, 4h ≈ 166 days) – if the range goes further back, daily candles are shown with a note · <b>1D</b> = always daily · <b>1W</b> = weekly candles (Monday to Sunday) · <b>1M</b> = monthly candles · <b>1Y</b> = yearly candles.</li><li>The <b>index chart</b> below always stays <b>daily</b> – the index exists only once per day. That is why there is no 1m or 5m: nothing would move below, and the top would show mostly noise.</li><li><b>Current price line</b> (to the price scale, like TradingView): white and dashed by default. In the gear → chart extras: dotted / dashed / solid, width, colour and <b>colour mode green/red like TradingView</b> – green when price is above the open of the current candle, red when below. Label colours (fixed mode) are under “Colours”.</li><li><b>Direction box</b> next to the legend: current movement (default: last 24 h, switchable to “price above/below EMA” with its own period and timeframe 1h / 4h / 1D), plus the <b>next target</b> (next pivot in that direction) and the <b>largest cluster</b> towards longs (below) or towards shorts (above).</li><li><b>MA</b> (EMA 50/200 in the price chart, SMA 20 in the index chart): in € the EMA is computed directly from euro prices, so it is smooth. Label and colour (fixed / green-red / graded) in the gear; extension per line (default 5 candles), it stops at the right chart edge. The index MA has its own “SMA 20” box, its own “MA” button at the index chart and its own settings (solid/dashed/dotted, width, colour mode).</li><li><b>Headings</b> “Where fear was and where greed” and “Index · 7-day average” are yellow with a thicker frame so they stand out from the buttons (colour in the gear). Drag the bar between the two charts = change height.</li></ul></div><div class=\"ibox\"><h3>Signals in the chart (no repaint)</h3><ul><li><b>Dots:</b> peak of an extreme phase (at least 3 days beyond the level). Filled = phase over, hollow = still running and may move.</li><li><b>Triangles:</b> ▲ below price = buy (long), ▼ above price = sell (short). Hollow = phase confirmed, filled = turn confirmed, filled with white border = zone left.</li><li><b>Trend filter (⚠)</b> for buys <b>and</b> sells: ⚠ next to ▲ = buy against a downtrend (price below EMA 200, ADX with −DI ahead or weekly MACD negative). ⚠ next to ▼ = sell against an uptrend (price above EMA 200, ADX with +DI ahead or weekly MACD positive). “Mark” shows ⚠, “hide” removes such signals completely, “off” does not check. Gear → signals (also: applies to buy + sell / buy only / sell only). The alert message then says “against the trend”.</li><li><b>Settings</b> (gear → signals): trigger, signal from day, touch ± points, method, trend filter.</li><li><b>Levels</b> 75/25 (as in the video) and 85/15, quick select also 70/30 and Fibonacci 61.8/38.2. In VrilyaSS the level buttons sit at the index chart and also switch the dots and signals in the price chart – if both are off, “Signals” shows nothing (hovering says so).</li><li><b>Divergence</b> like RSI on TradingView: lower price low + higher index low = <b>bull</b>, higher price high + lower index high = <b>bear</b>. The label appears on the confirmation day and never moves.</li><li><b>Evaluation</b> under “Trend &amp; assessment”: hit rate after 30 days and how many major tops/bottoms each method caught – also for the trend filters and every type of 50-line signal. No method hits everything.</li></ul></div><div class=\"ibox\"><h3>Tops/bottoms (retrospective)</h3><p>Major turning points of the price that are only known <b>afterwards</b> – not a live signal, but orientation in the cycle.</p><ul><li><b>How they are counted:</b> a high counts as a <b>top</b> if price then <b>falls at least X %</b> before making a new high. A low counts as a <b>bottom</b> if price then <b>rises at least X %</b>. Daily closes are used.</li><li><b>Two levels:</b> <b>cycle</b> (default 35 %) = large ▲/▼. <b>Minor</b> (default 20 %) = smaller, paler ▲/▼ marked “minor”.</li><li><b>“Tops/bottoms” button:</b> click once = cycle, twice = cycle + minor, three times = off. Right-click = back. Percentages in the gear → chart extras.</li><li><b>Example:</b> between the bottom on 21 Nov 2022 (15.8K) and the top on 6 Oct 2025 (124.7K) there was no 35 % pullback – the largest were −28 % (Jan–Apr 2025) and −26 % (2024). So the whole run counts as <b>one</b> rise. The bottom of 5 Feb 2026 (62.9K) only rose 30.7 % afterwards – it shows as a minor bottom (20 %), not at 35 %. The highs of 14 Jul and 13 Aug 2025 only fell 6 % and 12 % afterwards – small minor highs.</li><li>The smaller the value, the more points: since 2020 there are 9 turns at 35 %, 19 at 25 %, 31 at 20 %, 52 at 15 %.</li></ul></div><div class=\"ibox\"><h3>Pivot lines and Fibonacci</h3><ul><li><b>Period</b>: view (what the chart shows – recalculated instantly on every pan and zoom, like “visible range” on TradingView), 7 days, 1, 3, 6 or 12 months or all. The <b>▾ next to “Pivot”</b> lets you tick <b>several periods at once</b>; each line then shows its period in the label, equal values are merged. The “Pivot” button itself only switches on/off.</li><li><b>Calculation</b> (▾ menu and gear): <b>highest high and lowest low in the period</b> (default) · <b>lowest low after the high</b> (only lows after the highest high – for downswings) · <b>highest high after the low</b> (only highs after the lowest low – for upswings). If there is none yet, the extreme of the whole period applies.</li><li><b>Currency:</b> calculated in the displayed currency. In € each day is converted with its own EUR/USD rate before the high/low is searched (up to V15 it was searched in $ and converted afterwards – so another day could be higher in €). The V15 single file with the old calculation stays for comparison.</li><li><b>Fibonacci</b> (“Fibo” button) between the pivot high and low of the chosen period (gear: “Fibonacci from period”, default = first ticked). Direction like TradingView: a downswing (high before low) measures from the low, an upswing (low before high) from the high. Levels each on/off with colour: 38.2 red, 50 white, 61.8 green, 78.6 blue, 88.7 red (≈ square root of 78.6 %), 23.6 off.</li><li>Colours and width of the pivot lines in the gear. 🔔 on the line = a pivot alert is armed for this period.</li></ul><p><b>V17 – lines exactly at the wick:</b> with 4h, 1h and 15m candles in €, each candle used to be converted with <i>today's</i> euro rate, while the pivot lines used the rate of their own day. So the line sat slightly off the wick (e.g. line 75.5K, wick 75.0K). Now every intraday candle is converted with the rate of <i>its</i> day – line and wick match exactly, and the dot sits at the candle with the extreme. In $ it was always exact. The label column on the right grows to the longest label, so e.g. “🔔 Highest high 1M·3M 77.5K” is no longer cut off.</p></div><div class=\"ibox\"><h3>50 line in the index chart</h3><p>50 is the middle between fear and greed. The <b>“50”</b> button at the index chart shows the line (style, width, colour in the gear) and its signals – with a code in the index chart and as small arrows in the price chart (can be switched off). Green = long, red = short.</p><ul><li><b>B · Bounce</b>: index comes to 50 from above, touches the zone and rises again.</li><li><b>A · Rejection</b>: index comes to 50 from below and turns down again.</li><li><b>D↑ / D↓ · Break</b>: index closes clearly above (below) the zone around 50.</li><li><b>R↑ / R↓ · Retest</b>: after a break the index comes back to 50 within a few days and continues in the break direction.</li><li><b>F↑ · False break up (bull trap)</b>: break up, the retest fails, index falls back below 50 → short. <b>F↓ · False break down (bear trap)</b>: the other way round → long. This forms M and W patterns around 50.</li><li><b>Zone and confirmation</b> separately for long and short (default 3 points each): touching means entering the zone around 50; a bounce/rejection is confirmed when the index then moves back by the confirmation points or leaves the zone on the side it came from. Retest and false break count up to the set number of days after the break (default 20).</li><li>Signals appear on the <b>confirmation day</b> and never move. Each type can be switched on/off, has its own row in the method comparison and optionally an alert (browser and Telegram).</li></ul><p><b>Step by step</b> (example greed side, index above 50):</p><ol><li>The index falls to 50 and is inside the <b>zone</b> (50 ± zone points).</li><li>If it then rises by the confirmation points (or leaves the zone upwards) → <b>B · bounce</b> (long). If it instead drops clearly below the zone → <b>D↓ · break</b> (short).</li><li>After a D↓ the index comes back up to 50 within the retest days. If it turns down there → <b>R↓ · retest holds</b> (short). If it instead rises clearly above the zone → <b>F↓ · bear trap</b> (long).</li><li>The fear side works the same, mirrored: <b>A</b> (rejection, short), <b>D↑</b>, <b>R↑</b>, <b>F↑</b> (bull trap, short).</li></ol><p><b>Back-test</b> (Binance 90 days, since 2020, price 30 days after the signal in signal direction):</p><ul><li>B · bounce 7 of 13 right, avg +12.4 % · F↓ · bear trap 8 of 14, avg +7.1 % · R↑ · retest long 6 of 11, avg +2.5 % · A · rejection 4 of 7, avg +1.7 % · D↑ 7 of 19, avg +1.2 %</li><li>D↓ 9 of 17, avg −4.6 % · F↑ · bull trap 8 of 16, avg −4.2 % · R↓ · retest short 3 of 10, avg −20.6 % (weakest so far)</li></ul><p class=\"muted\">Current numbers are always in the method comparison – they change with every new day.</p></div><div class=\"ibox\"><h3>Candle patterns in extremes (button “Patterns”)</h3><p>A candle pattern alone is a weak signal. Together with <b>extreme fear or greed</b> it can mark a turn. So a pattern only counts while the index is extreme: <b>bullish patterns</b> (long) at ≤ 30, <b>bearish patterns</b> (short) at ≥ 70 – on the candle day or up to 3 days before. Everything adjustable in the gear.</p><ul><li><b>H · Hammer</b> (bullish): small body at the top, long lower wick (at least twice the body), hardly any upper wick – sellers pushed price down, buyers took it back.</li><li><b>iH · Inverted hammer</b>: small body at the bottom, long upper wick.</li><li><b>E↑ · Bullish engulfing</b>: green candle whose body fully covers the red body of the day before.</li><li><b>PL · Piercing line</b>: after a big red candle a green one closes above the middle of its body.</li><li><b>MS · Morning star</b>: big red candle, then a small one, then a green one closing above the middle of the first.</li><li>Bearish, mirrored: <b>SS · Shooting star</b> (long upper wick), <b>HM · Hanging man</b> (hammer shape after a rise), <b>E↓ · Bearish engulfing</b>, <b>DC · Dark cloud cover</b>, <b>ES · Evening star</b>.</li></ul><p><b>In the chart:</b> button “Patterns” (in the box with the signals). The code sits in a box below the candle (long, green) or above it (short, red); hover shows the full name. <b>⚠</b> = against the trend (same trend filter as for the signals). The number on the button = patterns in the visible range.</p><p><b>No repaint:</b> only <b>closed daily candles</b> count – the pattern appears after the daily close (00:00 UTC) and never moves. Confirmation: the next candle closes above the high (long) or below the low (short) of the pattern candle – this is also in the alert.</p><p><b>Settings</b> (gear → Chart extras, tendency &amp; frames → Candle patterns in extremes): which index counts (<i>our index</i> · <i>official</i> · <i>both</i> must be extreme · <i>either</i>), fear limit (default 30), greed limit (70), days back (3), each pattern on/off. <b>Alert:</b> own alert “Candle pattern” in the browser (sound: chime) and via Telegram.</p><p><b>Back-test</b> (daily candles since 2020, price 30 days after the pattern in signal direction):</p><ul><li><b>Our index:</b> hammer 15 of 23 right, avg +2.7 % · bullish engulfing 12 of 23, avg −0.8 % · inverted hammer 2 of 4 · piercing line 3 of 7, avg −8.1 % · morning star 2 of 5, avg −2.5 %. For comparison: buying on <i>every</i> day with index ≤ 30 = avg −3.7 % – so the hammer was clearly better.</li><li><b>Official index</b> (7-day average): bullish engulfing 57 of 99, avg +4.1 % · inverted hammer 12 of 21, avg +3.2 % · hammer 48 of 94, avg +1.3 % (every day ≤ 30: avg +1.3 %).</li><li><b>Bearish patterns in greed</b> mostly failed so far (e.g. shooting star 13 of 32, hanging man 3 of 11) – in greed phases Bitcoin often kept rising. So only with confirmation and small risk.</li></ul><p class=\"muted\">Current numbers per pattern: “Method comparison (back-test)” under “Trend &amp; assessment”. Scenarios, not investment advice.</p></div><div class=\"ibox\"><h3>Liquidation heatmap – how it is estimated</h3><ul><li>The heatmap is an <b>own estimate</b>, not a real list of positions: if <b>open interest</b> rises in an hour, new positions were opened. They are split into longs and shorts by that hour’s buyer share and spread over typical leverage (5×, 10×, 25×, 50×, 100× with 10 / 30 / 30 / 20 / 10 %). This gives a liquidation price for each part (about 10 % from entry at 10×).</li><li>If price has already reached a level, it counts as liquidated and is removed. If open interest falls, all open levels shrink proportionally. The last 500 hours (≈ 21 days) are used.</li><li><b>Selectable source</b> (▾ next to “Heatmap”, with ticks): <b>Binance</b>, <b>Bybit</b>, <b>OKX</b> in any combination, e.g. only Binance + Bybit. Price path and buyer share always come from Binance (the BTC price is almost the same everywhere), open interest from the respective exchange. The choice also applies to cluster lines, ticker and alerts.</li><li><b>L1/S1</b> = strongest cluster (★), <b>L2/S2</b> = nearest, <b>LF/SF</b> = farthest strong cluster, <b>L3…</b> = further ones; the name sits in a box at the start of the line. <b>“Clusters L/S” button</b>: all → nearest only → strongest only → farthest only → off. <b>🔔 gold line</b> = alert level, <b>M</b> = middle between L1 and S1, <b>own alert lines</b> (A1 …) can be dragged.</li><li><b>For comparison</b> (other models, other results): <a href=\"https://liquidate.fun\" target=\"_blank\" rel=\"noopener\">liquidate.fun ↗</a> · <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" rel=\"noopener\">CoinGlass ↗</a> · <a href=\"https://coinank.com\" target=\"_blank\" rel=\"noopener\">CoinAnk ↗</a> · <a href=\"https://coinmarketcap.com/charts/liquidation-heatmap/\
