<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1">
<script>/* Handy: Standard "wie am PC" = Desktop-Ansicht verkleinert; "Handy-optimiert" = eigene Anordnung */
try { if (localStorage.getItem('fg6_mobile') !== 'mobile' && Math.min(screen.width, screen.height) < 900 && navigator.maxTouchPoints > 0) document.getElementById('vp').setAttribute('content', 'width=1440'); } catch (e) { }</script>
<title>Smart Money Fear & Greed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d65ac9' stroke-width='5' stroke-dasharray='50 90' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0610; --panel:#160b1b; --panel2:#1c0f24; --line:#2a1b33; --line2:#3a2747;
    --text:#f4eef8; --muted:#a397ae; --dim:#6f6479; --track:#2a1c33;
    --pink:#d65ac9; --teal:#3fd6c3; --green:#33d39a; --red:#f0566e; --gold:#f6b860;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;
    padding:18px 16px 110px;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  .page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  /* ---------- Kopfzeile ---------- */
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:24px;letter-spacing:.01em;margin-right:auto}
  .hprice{display:flex;align-items:center;gap:12px}
  .hprice b{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .chg{border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
  .chg.neg{background:rgba(240,86,110,.15);color:#ff7d90}
  .chg.pos{background:rgba(51,211,154,.14);color:#4fe0aa}
  .whyBtn{background:rgba(246,184,96,.06);border:1px solid #7a5a2c;color:var(--gold);font-weight:700;font-size:15px;padding:11px 18px;border-radius:13px}
  .seg{display:inline-flex;background:#130a18;border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px}
  .seg button{background:none;border:1px solid transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 13px;border-radius:9px;white-space:nowrap}
  .seg button.on{background:#2a1a20;border-color:#7a5a2c;color:var(--gold)}
  .iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#130a18;color:var(--muted);display:grid;place-items:center}
  .iconbtn:hover{color:var(--text)}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:24px;position:relative}
  .main{overflow:hidden;padding:26px 30px 26px;
    background:radial-gradient(ellipse 55% 55% at 50% 52%,#3a1840 0%,#24102b 40%,#160b1b 78%)}
  .badge{display:table;margin:0 auto;border:1px solid #6a4b26;background:rgba(246,184,96,.05);color:var(--gold);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800;letter-spacing:.06em}
  .badge::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:9px;vertical-align:1px}
  .h1{text-align:center;font-size:40px;font-weight:800;letter-spacing:-.01em;margin-top:18px}
  .h1sub{text-align:center;color:var(--muted);font-size:17px;margin-top:6px}
  .grid{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;z-index:1;margin-top:34px}
  .col h3{font-size:13px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-bottom:12px}
  .col.left h3{text-align:right;padding-right:84px}
  .col.right h3{padding-left:84px}
  .item{display:flex;align-items:center;gap:14px;height:72px;cursor:help}
  .col.left .item{justify-content:flex-end}
  .col.left .txt{text-align:right}
  .txt{min-width:0}
  .txt .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
  .txt .val{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .gauge{position:relative;width:60px;height:60px;flex:none}
  .gauge svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .gauge .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .center{position:relative;width:300px;height:300px;justify-self:center}
  .center svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
  .center .inner{position:absolute;inset:36px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#1d0f24,#0c060f 72%);
    box-shadow:0 0 0 1px #3a2447,0 24px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .center .lbl{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .center .big{font-size:110px;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-.03em}
  .center .zone{font-size:22px;font-weight:800}
  .center .sub{font-size:13px;color:var(--dim);margin-top:6px}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .pulse2{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite 1.5s}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.985)}50%{opacity:.75;transform:scale(1.03)}}
  .glowArc{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
  #wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
  #wires .flow{stroke-dasharray:7 70;animation:flow 2.8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-77}}

  .scale{position:relative;margin:58px 6px 0;height:52px}
  .segs{display:flex;gap:6px;height:12px;position:absolute;left:0;right:0;top:20px}
  .segs div{border-radius:6px;height:100%}
  .mk{position:absolute;transform:translateX(-50%);transition:left .8s}
  .mk.cur{top:8px;width:5px;height:36px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #160b1b}
  .mk.off{top:10px;width:4px;height:32px;border-radius:2px;background:var(--teal);box-shadow:0 0 10px rgba(63,214,195,.6)}
  .mlabel{position:absolute;transform:translateX(-50%);font-weight:800;font-size:14px;white-space:nowrap;transition:left .8s}
  .mlabel.cur{top:-16px}
  .mlabel.off{top:46px;color:var(--teal)}
  .zones{display:flex;margin:22px 6px 0;font-size:14px;color:var(--dim)}
  .zones span{text-align:center}
  .zones span.on{font-weight:800}
  .chips{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#1a0e20;border-radius:999px;padding:9px 16px;color:var(--muted);font-size:15px}
  .chip b{color:var(--text);font-weight:800}
  .chip i{width:9px;height:9px;border-radius:50%}
  .past{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .pcard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a0e21;border:1px solid var(--line2);border-radius:14px;padding:13px 16px}
  .pcard b{display:block;font-size:15px}
  .pcard span{font-size:13px;color:var(--muted)}
  .pcard .gauge{width:46px;height:46px}
  .pcard .gauge .num{font-size:13px}

  /* ---------- rechte Spalte ---------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .side .card{padding:22px 24px}
  .h{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .h small{font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim);white-space:nowrap}
  .osub{color:var(--muted);font-size:15px;line-height:1.4;margin-top:6px}
  .odds{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .odds .lab{font-size:15px;color:var(--muted)}
  .odds .big{font-size:var(--oddsF,58px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .odds .r{text-align:right}
  .obar{position:relative;height:12px;border-radius:7px;margin-top:10px;background:linear-gradient(90deg,#1da877 0%,#3fe0a5 var(--p),#e0507a var(--p),#c9416f 100%)}
  .obar i{position:absolute;top:-6px;width:3px;height:24px;border-radius:2px;background:#fff;transform:translateX(-50%);left:var(--p)}
  .inf .h{margin-top:20px}
  .inf .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:12px 15px;margin-top:9px;font-size:15px;color:var(--muted);cursor:help}
  .inf .row b{color:var(--text);font-weight:800;text-align:right;white-space:nowrap}
  .action{display:inline-flex;align-items:center;gap:14px;margin:18px 0 16px;border-radius:16px;padding:14px 26px 14px 20px;font-size:30px;font-weight:800;color:#1a0b1c;box-shadow:0 10px 30px rgba(214,90,201,.25)}
  .action i{width:14px;height:14px;border-radius:50%;background:#1a0b1c}
  .bt{font-size:16px;line-height:1.55;color:#cfc4d9}
  .bt b{color:var(--text)}
  .zl{margin-top:16px;display:flex;flex-direction:column;gap:4px}
  .zl div{display:grid;grid-template-columns:84px 1fr;align-items:center;padding:11px 15px;border-radius:12px;border:1px solid transparent;font-size:15px;color:var(--muted)}
  .zl div b{font-weight:800}
  .zl div.on{border-color:#6b4a83;background:#22122b;color:var(--text);font-weight:700}
  .note{font-size:14px;line-height:1.55;color:var(--dim);margin-top:14px}
  .note b{color:#d7cce0}

  /* ---------- Chart ---------- */
  .chart{padding:24px 26px 18px}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .ctitle{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend .ln{width:16px;height:3px;border-radius:2px;background:#fff}
  .legend .gr{width:18px;height:10px;border-radius:3px;background:linear-gradient(90deg,#8b6cff,#d65ac9,#f0566e,#f3843c,#f6cf5c)}
  .legend .dt{width:9px;height:9px;border-radius:50%}
  .ctools{display:flex;gap:10px;flex-wrap:wrap}
  .tog{background:#130a18;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:15px;padding:10px 16px;border-radius:13px}
  .tog.on{border-color:#7a5a2c;color:var(--gold);background:rgba(246,184,96,.05)}
  .rangeRow{margin-top:16px}
  .cwrap{position:relative;margin-top:10px;user-select:none}
  .csvg{width:100%;display:block}
  #priceChart{height:360px;cursor:crosshair}
  #idxChart{height:200px;cursor:crosshair}
  .clabel{font-size:13px;letter-spacing:.12em;color:var(--dim);font-weight:700;margin:2px 0 0}
  .axisHint{position:absolute;right:4px;top:4px;font-size:11px;color:var(--dim)}
  .tt{position:fixed;pointer-events:none;z-index:50;background:#1d1026f2;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.6;min-width:170px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .tt .r{display:flex;justify-content:space-between;gap:14px}
  .tt .r span:first-child{color:var(--muted)}

  /* ---------- Tabellen ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
  .duo>*,.hero>*{min-width:0}
  .tcard{padding:22px 24px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{font-size:12px;letter-spacing:.1em;color:var(--dim);font-weight:700;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:0 6px;height:62px;border-bottom:1px solid #22142b;font-size:16px;white-space:nowrap}
  th.r,td.r{text-align:right}
  .bname{font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis}
  .bval b{font-weight:700}
  .bval small{color:var(--dim);font-size:14px;margin-left:6px}
  .bbar{width:140px;height:7px;border-radius:4px;background:#2a1c33;overflow:hidden}
  .bbar i{display:block;height:100%;border-radius:4px}
  .pts{font-weight:800;font-size:18px}
  .d7{font-weight:700;font-size:14px}
  tr.hov:hover td{background:#1d1026}
  .tl{position:relative;width:40px;height:62px}
  .tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--lc,#c45bd6)}
  .tl i{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:var(--dc);box-shadow:0 0 0 4px #160b1b}
  .zp{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
  .zp::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .sub2{display:block;font-size:13px;color:var(--dim);margin-top:2px}
  .btc b{display:block;font-weight:800}
  .btc small{font-size:13px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--dim)}
  .tabs{display:flex;gap:14px;align-items:baseline}
  .tabs button{background:none;border:0;color:var(--dim);font-size:13px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;padding:0}
  .tabs button.on{color:var(--muted)}

  .foot{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:15px;padding:4px 4px 0}
  .foot .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--green)}
  .foot .na{color:var(--dim)}
  .foot a{text-decoration:underline;cursor:pointer}

  /* ---------- Ticker ---------- */
  .ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:auto auto 1fr;background:#0a1613;border-top:1px solid #1d3a33;font-weight:800}
  .ticker>div{padding:9px 18px;display:flex;align-items:center}
  .price{font-size:32px;color:#eef8f4;gap:10px;letter-spacing:-.01em}
  .price .b{color:#f7a531;font-size:22px}
  .price .dir{font-size:16px}
  .liqtitle{border-left:1px solid #1d3a33;border-right:1px solid #1d3a33;letter-spacing:.08em;font-size:18px;color:#e6efe9}
  .liq{flex-direction:column;align-items:stretch!important;gap:4px}
  .liq .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .liq .sd{display:flex;align-items:baseline;gap:8px;font-size:27px}
  .liq small{font-size:9px;color:#9fb5ad;letter-spacing:.14em}
  .liq .l{color:#5ee0b0} .liq .s{color:#ff7a68}
  .vs{width:26px;height:26px;border-radius:50%;border:1px solid #2b4a42;display:grid;place-items:center;font-size:9px;color:#9fb5ad}
  .segbar{display:flex;gap:3px;height:9px}
  .segbar i{flex:1;border-radius:2px}
  .pcts{display:flex;justify-content:space-between;font-size:17px;font-weight:800;color:#b9cfc7}
  .liq{zoom:var(--tr,1)}
  .liq .sd{font-size:30px!important}
  .ticker .price,.ticker .trow,.ticker .pp>div{white-space:nowrap}
  .ticker>div.liq{min-width:0;overflow:hidden}
  .top #langSeg button{padding:6px 10px;font-size:13px}
  .liq small{font-size:12px!important}
  .vs{width:38px!important;height:38px!important;font-size:14px!important}
  .segbar{height:12px!important}
  /* Ticker: Größe ziehbar (oben), einklappbar */
  .ticker{zoom:var(--tz,1)}
  .tgrip{position:absolute;left:0;right:0;top:-6px;height:12px;cursor:ns-resize;z-index:3;padding:0!important}
  .tgrip::after{content:'';position:absolute;left:50%;top:4px;width:56px;height:4px;margin-left:-28px;border-radius:3px;background:#3d6b60}
  .tcol{position:absolute;right:14px;top:-26px;z-index:3;width:44px;height:24px;border-radius:8px 8px 0 0;border:1px solid #2b4a42;border-bottom:0;background:#0a1613;color:#9fb5ad;cursor:pointer;font-size:13px;padding:0!important}
  /* (V15: Einklappen siehe unten – ganze Leiste) */
  /* Vollbild je Fenster */
  .maxbtn{position:absolute;top:-14px;right:22px;z-index:6;width:28px;height:28px;border-radius:8px;border:1px solid #6b5578;background:#1a0e20;color:#d8c7e6;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .maxbtn:hover{border-color:var(--gold);color:var(--gold)}
  .card.main .maxbtn{top:10px;right:12px}
  .card.maxed{position:fixed;inset:12px;z-index:60;overflow:auto;margin:0;max-width:none}
  .card.maxed .maxbtn{top:10px;right:12px}
  body.hasmax{overflow:hidden}
  body.v-smc:not(.v-smc2) .maxbtn{display:none}
  /* inaktive Knöpfe deutlicher, Linie/Kerzen im Rahmen */
  .tog{border-color:#6b5578}
  .ctools .seg{border-color:#6b5578;background:rgba(255,255,255,.035)}
  /* Titel: größere Preise und Flaggen (SMC 2 / VrilyaSS) */
  body:is(.v-vss,.v-smc2) .top .hprice b{font-size:34px}
  body:is(.v-vss,.v-smc2) .top .flag{width:36px;height:24px}
  /* weniger Leerraum oben in „Wie viel Angst steckt im Markt?“ */
  body .main{padding-top:14px}
  body .h1{margin-top:0}
  /* Was das jetzt heißt: Aktion + Tendenz in einer Zeile */
  body.v-vss .actrow{flex-wrap:nowrap}
  body.v-vss .actrow .action{white-space:nowrap}
  .action.tend{flex-direction:column;align-items:flex-start;gap:0;line-height:1.12;padding:8px 14px!important}
  .action.tend small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:800}
  .action.tend b{font-size:18px}
  /* Empfehlung: aktuelle Zone als ganzer Kasten mit runden Ecken */
  .rtab{border-collapse:separate;border-spacing:0}
  body .card .rtab tr.on td{background:#22122b;border-top:1px solid #8a6aa0!important;border-bottom:1px solid #8a6aa0!important}
  body .card .rtab tr.on td:first-child{border-left:1px solid #8a6aa0!important;border-radius:10px 0 0 10px}
  body .card .rtab tr.on td:last-child{border-right:1px solid #8a6aa0!important;border-radius:0 10px 10px 0}
  /* Einschätzung untereinander */
  .csum .ehead{font-weight:800;color:var(--htc,#f6b860);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
  body.frames .csum .ehead{display:inline-block;border:1.5px solid var(--hfc,#f6b860);border-radius:8px;padding:3px 10px}
  .csum .erow{display:grid;grid-template-columns:minmax(280px,auto) 1fr;gap:14px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .csum .erest{margin-top:8px;color:var(--muted)}

  /* ---------- Tooltip, Dialoge, Laden ---------- */
  .tip{position:fixed;z-index:60;pointer-events:none;max-width:340px;background:#1d1026f7;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;display:none;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .tip b{font-size:14px}
  .tip .r{display:flex;justify-content:space-between;gap:16px}
  .tip .r span:first-child{color:var(--muted)}
  .tip .m{color:var(--dim);margin-top:6px}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(5,2,8,.65);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .dlg{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:24px}
  .dlg h2{font-size:21px;margin-bottom:10px}
  .dlg p{color:#cfc4d9;font-size:15px;line-height:1.6;margin-top:10px}
  .dlg .muted{color:var(--muted);font-size:13px}
  .set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}

    .ticker{grid-template-columns:1fr!important}
    .ticker .price{justify-content:flex-start}
    .ticker .liqtitle{flex-direction:row!important;align-items:center!important;flex-wrap:wrap;gap:3px 12px;border-left:0!important;border-right:0!important;border-top:1px solid #1d3a33;padding:5px 12px!important}
    .ticker .liq{grid-column:auto!important}
    body{padding-bottom:215px!important}
    .days .h{flex-wrap:wrap;gap:4px}
    .liq .row{gap:6px}
    .liq .sd{font-size:15px;gap:5px}
    .liq small{letter-spacing:.04em}
    .ticker>div{min-width:0;padding:8px 12px}
  }
  /* ===== V14 ===== */
  /* Handbuch: Abschnitte wieder im goldenen Kasten (wie V12), Überschrift zusätzlich im kleinen goldenen Rahmen */
  .intro .ibox{border:1.5px solid var(--gold);border-radius:14px;padding:10px 16px 14px;margin-top:14px;background:rgba(246,184,96,.03)}
  .intro .ibox h3{display:table;margin:4px auto 10px;border:1.5px solid var(--gold);border-radius:10px;padding:5px 16px;text-align:center}
  .intro .ibox h4{margin:12px 0 4px;color:var(--gold);font-size:14px}
  .intro table.vcmp{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
  .intro table.vcmp th,.intro table.vcmp td{border:1px solid rgba(255,255,255,.14);padding:4px 7px!important;height:auto!important;line-height:1.35;text-align:center}
  .intro table.vcmp td:first-child,.intro table.vcmp th:first-child{text-align:start}
  /* Zahnrad: grauer, etwas dickerer Rahmen */
  #setBtn{border:3px solid #8b8f99;color:#d8d2de}
  #setBtn:hover{border-color:var(--gold);color:var(--gold)}
  /* SMC: Titelzeile in einer Zeile (wie SMC 2 / VrilyaSS) */
  @media (min-width:1000px){
    body.v-smc:not(.v-smc2) .top{flex-wrap:nowrap;gap:10px}
    body.v-smc:not(.v-smc2) .top>*{flex-shrink:0;white-space:nowrap}
    body.v-smc:not(.v-smc2) .top .brand{font-size:clamp(17px,1.45vw,24px);flex-shrink:1;min-width:0}
    body.v-smc:not(.v-smc2) .top .hbtn,body.v-smc:not(.v-smc2) .top .whyBtn{padding:9px 11px;font-size:13.5px}
    body.v-smc:not(.v-smc2) .top .hprice b{font-size:clamp(24px,2.1vw,34px);white-space:nowrap}
    body.v-smc:not(.v-smc2) .top .chg{font-size:13px;padding:4px 8px;white-space:nowrap}
  }
  /* Index-Chart: Titel im Kasten, eigene Knöpfe daneben */
  .ihead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
  .ihead .clabel{margin:0}
  body.v-vss .ihead .clabel{display:inline-block;border:1.5px solid var(--hfc,#f6b860);color:var(--htc,#f6b860);border-radius:8px;padding:4px 10px;font-size:12px}
  .ihead .itools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ihead .itools .tog{padding:5px 10px;font-size:12.5px}
  /* Leiste zum Ziehen zwischen den Charts: deutlicher, Farbe einstellbar, Trennlinien links/rechts */
  body.v-vss .splitter{height:18px;margin:4px 0}
  body.v-vss .splitter span{width:96px;height:7px;border-radius:4px;background:var(--sgc,#f6c453);opacity:.85}
  body.v-vss .splitter::before,body.v-vss .splitter::after{height:2px;background:var(--fc,#8b8f99);opacity:.8}
  body.v-vss:not(.frames) .splitter::before,body.v-vss:not(.frames) .splitter::after{opacity:.35}
  body.v-vss .splitter:hover span,body.v-vss .splitter.drag span{background:var(--sgc,#f6c453);opacity:1;box-shadow:0 0 8px var(--sgc,#f6c453)}
  /* Trennlinien im Chart (wie TradingView), folgen der Rahmenfarbe */
  .csvg .fsep{stroke:var(--fc,#8b8f99);stroke-width:1.5;opacity:.85}
  body:not(.frames) .csvg .fsep{opacity:.3}
  /* Ticker: Beschriftungen größer, 24h-Prozent unten, LONGS/SHORTS fett, Liquidationen höher */
  @media (min-width:900px){
    .arr small{font-size:13px;letter-spacing:.1em}
    .ticker .arr.day{align-self:stretch;justify-content:space-between;margin-bottom:-6px;gap:2px}
    .arr.day .pct{font-size:15px;font-weight:800}
    .liq .sd{font-size:clamp(22px,1.6vw,30px)!important}
    .liq .sd.l>small:first-child,.liq .sd.s>small:last-child{font-size:clamp(12px,.85vw,16px)!important;font-weight:900;letter-spacing:.08em;color:inherit}
    .ticker>div.liqtitle{justify-content:flex-start;padding-top:4px;padding-bottom:4px}
    .tk4{font-size:clamp(11px,.72vw,13.5px);gap:2px}
    .ticker>div.liqtitle{padding-left:14px;padding-right:14px}
  }
  /* ===== V15 ===== */
  /* obere Bedienleiste komplett in einem Kasten (wie die Titelzeile) */
  .toolbar{border:1px solid var(--line);border-radius:18px;padding:8px 12px;background:#120914}
  body.frames .toolbar{border:var(--fw,2px) solid var(--fc,#8b8f99)!important}
  /* Chart-Überschriften gelb und dicker umrahmt, damit sie sich von den Knöpfen abheben */
  body.v-vss .ctitle>.h,body.v-vss.frames .ctitle>.h{border:2.5px solid var(--chc,#ffd84a)!important;color:var(--chc,#ffd84a)!important;border-radius:8px;padding:4px 12px;display:inline-block}
  body.v-vss .ihead .clabel,body.v-vss.frames .ihead .clabel{border:2.5px solid var(--chc,#ffd84a)!important;color:var(--chc,#ffd84a)!important}
  /* Richtungs-Kasten neben der Legende */
  .ctitle{flex-wrap:wrap}
  .dirbox{border:1.5px solid #6b5578;border-radius:10px;padding:5px 11px;font-size:12.5px;line-height:1.45;color:var(--text);background:rgba(255,255,255,.03)}
  .dirbox:empty{display:none}
  .dirbox b{font-weight:900}
  .dirbox .sep{opacity:.45;margin:0 6px}
  /* Auswahl Kerzengröße / Heatmap-Quelle im Stil der Knöpfe */
  .csel{background:#1a0e20;color:var(--gold);border:1px solid #6b5578;border-radius:12px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
  .csel:hover{border-color:var(--gold)}
  .csnote{font-size:11.5px;color:#ffb86b;align-self:center}
  .csnote:empty{display:none}
  /* „Was das jetzt heißt“: Aktion schmaler, Tendenz größer, „TENDENZ:“ fetter */
  body.v-vss .actrow .action:not(.tend){padding:10px 16px 10px 14px;gap:10px}
  body.v-vss .action.tend{padding:8px 18px!important;min-width:150px}
  body.v-vss .action.tend small{font-size:13px;font-weight:900;opacity:.9;letter-spacing:.06em}
  body.v-vss .action.tend b{font-size:20px}
  /* Ticker: ganz einklappen (nur der Reiter bleibt), wahlweise oben */
  .ticker.collapsed{border-top:0;border-bottom:0;background:transparent}
  .ticker.collapsed>div{display:none!important}
  .ticker.attop{top:0;bottom:auto;border-top:0;border-bottom:1px solid #1d3a33}
  .ticker.attop .tcol{top:auto;bottom:-26px;border-radius:0 0 8px 8px;border-top:0;border-bottom:1px solid #2b4a42}
  .ticker.attop .tgrip{top:auto;bottom:-6px}
  /* ===== V16 ===== */
  /* Statuszeile in der Bedienleiste */
  .vstat{flex:1;min-width:0;margin:0 14px;font-size:12.5px;color:var(--muted);line-height:1.35}
  .vstat b{color:var(--text)}
  .vstat a{color:var(--gold);font-weight:800;cursor:pointer;white-space:nowrap}
  .vstat a:hover{text-decoration:underline}
  /* Hinweis „neue Version“ */
  .newver{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#2a1a0a;border:1.5px solid var(--gold);color:var(--gold);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-weight:700}
  /* Trend & Einschätzung: Kästen und Labels deutlicher */
  body.v-vss .tbox{border:2px solid #7d7389}
  body.v-vss.frames .tbox{border-color:var(--fc,#8b8f99)}
  body.v-vss .verdict{position:relative;border:2px solid currentColor;overflow:hidden}
  body.v-vss .verdict::before{content:'';position:absolute;inset:0;background:currentColor;opacity:.13;pointer-events:none}
  /* Rahmen um die Tabellen (Vergleich, Signale, Methoden, Bausteine, Extreme / letzte Tage) */
  body.v-vss .tcard .tw{border:1.5px solid #4f4858;border-radius:12px;padding:2px 8px 4px;margin-top:8px}
  body.v-vss.frames .tcard .tw{border-color:var(--fc,#8b8f99)}
  /* Fear & Greed im Vergleich: gewählte Zeile umrahmt wie bei der Empfehlung */
  .ctab{border-collapse:separate;border-spacing:0}
  body .card .ctab tr.sel td{background:#22122b;border-top:1px solid #8a6aa0!important;border-bottom:1px solid #8a6aa0!important}
  body .card .ctab tr.sel td:first-child{border-left:1px solid #8a6aa0!important;border-radius:10px 0 0 10px}
  body .card .ctab tr.sel td:last-child{border-right:1px solid #8a6aa0!important;border-radius:0 10px 10px 0}
  /* Knopf-Gruppen (je ein Kasten wie Linie/Kerzen) und Auswahlmenüs mit Häkchen */
  .tgrp{display:inline-flex;align-items:center;gap:4px;border:1px solid #5d4768;border-radius:14px;padding:3px;background:rgba(255,255,255,.035)}
  .ddwrap{position:relative;display:inline-block}
  .ddmenu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:220px;background:#1a0e21;border:1px solid var(--line2);border-radius:12px;padding:8px 10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .ddmenu.open{display:block}
  .ddmenu label{display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:13px;cursor:pointer;white-space:nowrap}
  .ddmenu .lh{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:6px 0 2px}
  /* Beschriftung „Zeitraum:“ */
  .seglbl{font-size:12.5px;color:var(--dim);padding:0 6px 0 8px;align-self:center;white-space:nowrap}
  /* Divergenz-Knopf mit fester Breite (springt nicht in die nächste Zeile) */
  #togDiv{min-width:var(--divw,250px)}
  /* Titel: $ und € mit gleich breiten Ziffern, Zeichen bleiben untereinander */
  #hPrice,#hEur{font-variant-numeric:tabular-nums;display:inline-block;text-align:right;min-width:6.6ch}
  /* Richtungs-Kasten: Abstand vor der Klammer */
  .dirbox b+.muted{margin-left:8px}
  /* Ticker: zweiter Reiter oben/unten */
  .tcol.tposb{right:64px;font-size:12px}
  /* Was das jetzt heißt: beide Knöpfe gleich groß (je halbe Breite, Platz für zwei Zeilen – in allen Sprachen gleich) */
  body.v-vss .actrow{flex-wrap:nowrap!important;align-items:stretch}
  body.v-vss .actrow .action{flex:1 1 0;min-width:0;min-height:70px;margin:14px 0 8px!important;justify-content:center;white-space:normal!important;text-align:center;line-height:1.15;padding:10px 12px!important;font-size:21px!important;gap:10px}
  body.v-vss .action.tend{align-items:center!important}
  body.v-vss .action.tend small{font-size:12px;font-weight:900;opacity:.9;letter-spacing:.06em}
  body.v-vss .action.tend b{font-size:19px}
  /* Alarm-Fenster (bleiben stehen, bis man sie schließt) und Verlauf */
  .alstack{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:10px;max-width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 140px);overflow:auto}
  .alcard{background:#1d1026f7;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .alcard .at{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .alcard .at b{font-size:14px}
  .alcard .ax{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
  .alcard .ab{margin-top:6px;white-space:pre-line}
  .alcard .af{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--dim)}
  .alog .row{border-bottom:1px solid var(--line);padding:8px 2px}
  .alog .row .h2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}
  .alog .row .b2{font-size:13px;white-space:pre-line;margin-top:3px}
  .alog .ok{color:#33d39a} .alog .open{color:#ffb86b}
  .alsnd{display:grid;grid-template-columns:1fr 110px 34px 110px 60px;gap:6px;align-items:center;font-size:13px;margin-top:6px}
  /* Ticker: alle Spalten mit demselben schmalen Rand oben/unten, ₿, Pfeile und Kurse größer */
  @media (min-width:900px){
    .ticker>div.price,.ticker>div.liqtitle{padding-top:5px;padding-bottom:5px}
    .ticker>div.price{align-items:stretch}
    .ticker .price{font-size:clamp(26px,1.95vw,38px)}
    .price .b{font-size:clamp(56px,4.5vw,88px);line-height:1;display:flex;align-items:center}
    .price .pp{justify-content:center}
    .ticker .trow .flag.sm{width:.78em;height:.52em}
    .ticker .arr{justify-content:space-between;gap:0;margin-bottom:0}
    .ticker .arr small{font-size:clamp(12px,.8vw,15px);line-height:1.1}
    .ticker .arr b{font-size:clamp(44px,3.4vw,68px);line-height:.9}
    .ticker .arr.tick{align-self:stretch;justify-content:flex-start}
    .ticker .arr.tick b{margin-top:auto;margin-bottom:auto}
    .ticker .arr.day{align-self:stretch;padding-bottom:8px}
    .arr.day .pct{font-size:clamp(14px,.95vw,18px)}
    .pcts{font-size:clamp(17px,1.15vw,21px)}
  }
  /* ===== V17 ===== */
  /* Knöpfe über dem Chart: alle Knöpfe und Kästen in allen Reihen gleich hoch (Breite bleibt frei) */
  .ctools{--cth:44px;align-items:center}
  .ctools>.tog,.ctools>.seg,.ctools>.tgrp,.ctools>.csel,.ctools>.layers>.tog{height:var(--cth);box-sizing:border-box}
  .ctools>.tog,.ctools>.layers>.tog{display:inline-flex;align-items:center;justify-content:center;padding-top:0;padding-bottom:0}
  .ctools>.seg,.ctools>.tgrp{align-items:stretch;padding:3px}
  .ctools>.seg>button,.ctools>.tgrp>.tog,.ctools>.tgrp>.ddwrap>.tog{display:inline-flex;align-items:center;justify-content:center;padding-top:0;padding-bottom:0;height:100%;box-sizing:border-box}
  .ctools>.tgrp>.ddwrap{display:flex;height:100%}
  .ctools>.seg>.seglbl{display:inline-flex;align-items:center}
  .ctools>.csel{padding-top:0;padding-bottom:0}
  #togDiv{min-width:0}
  /* Ticker: $ und € genau untereinander, Pfeile als Grafik (exakt mittig), Größen und Abstände einstellbar (leer = automatisch) */
  .tpx{font-variant-numeric:tabular-nums;text-align:right}
  .ticker .price .pp{display:grid;grid-template-columns:auto auto;column-gap:8px;align-content:center;align-items:center}
  .ticker .price .pp>.trow{display:contents}
  .ticker .arr b{display:flex;align-items:center;justify-content:center}
  .ticker .arr b svg{display:block;width:.6em;height:.76em;overflow:visible}
  @media (min-width:900px){
    .ticker .arr.tick{padding-right:4px}
    .ticker .arr small:first-child{font-size:var(--tk-lbl,clamp(12px,.8vw,15px));margin-top:var(--tk-lt,6px)}
    .ticker .arr b{font-size:var(--tk-arr,clamp(44px,3.4vw,68px))}
    .ticker .arr.day{padding-bottom:var(--tk-pb,8px)}
    .arr.day .pct{font-size:var(--tk-pct,clamp(14px,.95vw,18px))}
    .liq .sd{font-size:var(--tk-ls,clamp(22px,1.6vw,30px))!important}
    .pcts{font-size:var(--tk-lsp,clamp(20px,1.35vw,25px))}
    .segbar{height:var(--tk-sq,16px)!important}
  }
  /* Reiter „Extreme der letzten 12 Monate / Die letzten 12 Tage“: aktiver Reiter gelb gefüllt */
  body:not(.v-smc) .tabs button{border:1.5px solid var(--hfc,#f6b860);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--htc,#f6b860)}
  body:not(.v-smc) .tabs button:not(.on){opacity:.6}
  body:not(.v-smc) .tabs button:not(.on):hover{opacity:1}
  body:not(.v-smc) .tabs button.on,body.frames:not(.v-smc) .tabs button.on{background:var(--hfc,#f6b860)!important;color:#1a0b1c!important;border-color:var(--hfc,#f6b860)!important;opacity:1}
  /* „Was das jetzt heißt“: Pulsieren je Knopf an/aus, Schriftgrößen einstellbar */
  html.nopulseA body.v-vss #action{animation:none}
  html:not(.nopulseT) body.v-vss #tend{animation:apulse 2.4s ease-in-out infinite}
  body.v-vss .actrow .action:not(.tend){font-size:var(--actF,21px)!important}
  body.v-vss .action.tend small{font-size:var(--tendL,15px)}
  body.v-vss .action.tend b{font-size:var(--tendV,19px)}
  /* Einschätzung: 1 / 2 / 3 als Nummern, Urteile genau untereinander */
  .csum .egrid{display:grid;grid-template-columns:auto 1fr;column-gap:16px}
  .csum .egrid .erow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;gap:0 16px}
  /* Tabellen „Fear & Greed im Vergleich“ und „Methoden-Vergleich“ ohne waagerechte Bildlaufleiste: Überschriften dürfen umbrechen, weniger Sperrung */
  body.v-vss .tcard .tw th,body.v-vss .sstats th{white-space:normal;letter-spacing:.03em;line-height:1.2;vertical-align:bottom}
  body.v-vss .ctab th,body.v-vss .ctab td,body.v-vss .tcard .tw th,body.v-vss .tcard .tw td{padding-left:4px;padding-right:4px}
  body.v-vss .ctab td:last-child{min-width:84px}
  body.v-vss .tcard .tw{padding-left:5px;padding-right:5px}
  body.v-vss .mtab td:first-child{white-space:normal;line-height:1.25;min-width:130px}
  body.v-vss .sstats table td,body.v-vss .sstats table th{padding-left:5px;padding-right:5px}
  .csum .enum{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--htc,#f6b860);color:#1a0b1c;font-weight:900;font-size:13px;margin-inline-end:8px;vertical-align:1px}
</style>

<body>
<div class="loading" id="loading"><div class="spin"></div><div id="loadTxt">Lade Daten…</div></div>

<div class="page">

    </button>
    </div>
  </div>

  <!-- ======= Kopfzeile ======= -->

rer","hFrom":"Alarm ab","hMid":"Mitte L1/S1","hPrice":"Kurs jetzt","hAlarmPct":"Alarm-Abstand {p} %","al_lines":"Eigene Alarmlinien","al_div":"Divergenz (Bull/Bear)","al_off":"Signale offizieller Index","chipPick":"Anklicken = als Linie im Chart zeigen","chipGapAvg":"Abstand zum Ø offiziell","sig_peak_fear":"Extrempunkt Boden","sig_peak_greed":"Extrempunkt Top","mTitle":"Methoden-Vergleich (Backtest)","mNote":"seit Beginn der Daten, Stufe 1","mCol":"Methode","mN":"Kauf/Verk.","mBuyOk":"Kauf ✓","mSellOk":"Verk. ✓","mTops":"Tops","mBottoms":"Böden","mHelp":"Kauf ✓ / Verk. ✓ = Kurs 30 Tage später in Signalrichtung. Tops/Böden = große Wendepunkte (Kursbewegung ≥ 20 %), die ein passendes Signal innerhalb ±21 Tagen erwischt hat. Vergangene Ergebnisse sind keine Garantie.","st_bellColor":"Alarmlinien (Glocke)","st_midColor":"Mitte M","st_ownColor":"Eigene Linien","st_sigOffColor":"Signale offiziell","st_divBull":"Divergenz Bull","st_divBear":"Divergenz Bear","introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p>\n<h3>Worum geht es?</h3>\n<p>Die bekannten Fear &amp; Greed Indizes (z. B. alternative.me, CoinMarketCap) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen. Smart Money Crypto hat in seinen Livestreams („Jetzt wackelt der (letzte) Boden“ und „Unsere Longs sind aufgegangen! Was jetzt? Live Trading“, beide 16.10.2026) einen eigenen Index gezeigt, der stattdessen misst, was er für aussagekräftiger hält: wie Futures-Trader, große Geldflüsse und das Makro-Umfeld gerade positioniert sind. Laut seinem Video dreht dieser Index früher als der offizielle – z. B. Juli 2026: extreme Gier Wochen, bevor der offizielle Index folgte. Deshalb hält er die offiziellen Indizes für weniger brauchbar. Diese Seite baut seinen Index aus frei verfügbaren Daten nach. <i>Keine offizielle Seite, keine Anlageberatung.</i></p>\n<h3>So wird gerechnet</h3>\n<ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li>\n<li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li>\n<li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen.</li>\n<li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li><li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert. Smart Money zählt standardmäßig doppelt, weil er laut Video früher dreht – im Zahnrad 1:1, 2:1 oder 3:1.</li></ul>\n<h3>Signale im Chart (ohne Repaint)</h3>\n<ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über 75 bzw. unter 25). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li>\n<li><b>Signale als Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt (3. Tag in der Zone), voll = Wende bestätigt (5 Punkte vom Extrem zurück), voll mit weißem Rand = Zone wieder verlassen. Im Zahnrad wählbar: Signal beim Eintritt, beim Austritt oder beides.</li>\n<li><b>Stufen</b> 75/25 (wie im Video) und 85/15 – Werte und Farben im Zahnrad.</li>\n<li><b>Methode</b> (Zahnrad → Signale): Standard, Tageswert, 90 + 365 Tage, Kurs-Bestätigung oder Extrempunkt (△/▽ hohl).</li>\n<li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b> (Long-Signal), Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b> (Short-Signal). Ein Tief/Hoch ist bestätigt, wenn es danach X Tage hält (Standard 5); das Label erscheint am Bestätigungstag und wandert nie mehr.</li>\n<li><b>Signale offiziell:</b> dieselben Punkte und Signale für den offiziellen Index, in Türkis.</li>\n<li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Ehrlich: Keine Methode trifft alles. Im Backtest war die bullische Divergenz für Böden am treffsichersten, Tops sind schwieriger.</li></ul>\n<h3>Liquidations-Heatmap und Alarme</h3>\n<ul><li>Schätzung aus Binance-Daten der letzten ~21 Tage, wo Positionen liquidiert würden. <b>L1/S1</b> = stärkster Long-/Short-Cluster (durchgezogen), <b>L2/S2</b> = nächster (gestrichelt), <b>L3…</b> = weitere (gepunktet). Heller Bereich = Zone um den Cluster.</li>\n<li><b>🔔 Goldene gepunktete Linie</b> = Alarmstufe (Standard 1 % vor dem Cluster). <b>M</b> = Mitte zwischen L1 und S1 (optional). Rechts am Label stehen Preis und Volumen in Mio. $, der stärkste Cluster hat ein ★.</li><li><b>LF/SF</b> = weit entferntester starker Cluster je Seite: mindestens 50 % des Volumens des stärksten Clusters und höchstens 20 % vom Kurs entfernt (beides im Zahnrad änderbar). Zeigt, wo die nächste große Liquidität liegt, wenn L1/S1 abgeholt sind.</li><li><b>Reaktions-Alarm:</b> Wird ein Cluster angelaufen, merkt sich die Seite Zeit und Volumen. Entfernt sich der Kurs danach um 1 % in Gegenrichtung (innerhalb von 24 Std.), kommt „angelaufen → Reaktion“; läuft er 1 % über den Cluster hinaus, kommt „durchbrochen“. Beide Meldungen nennen den nächsten Cluster in Bewegungsrichtung mit Abstand und Volumen. Alle Werte im Zahnrad änderbar.</li>\n<li><b>Eigene Alarmlinien</b> (A1, A2 …): Knopf „Eigene Linien“, mit der Maus verschieben oder im Zahnrad eintragen. Alarm beim Kreuzen.</li>\n<li>Alarme kommen im Browser (Ton + Meldung, solange die Seite offen ist) und per <b>Telegram</b> (über das Programm auf dem PC, auch wenn die Seite zu ist). Jede Meldung erklärt die typischen Szenarien.</li></ul>\n<h3>Wo stelle ich was ein?</h3>\n<ul><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Zahlen, Index im Chart, Heatmap, Stufen, Signale, Signale offiziell, Divergenz, Alarmlinien, eigene Linien, <b>Ebenen ▾</b> (alles einzeln an/aus), Zeitraum.</li>\n<li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen (auch im Index-Chart), Doppelklick = zurück, Trennleiste ziehen = Höhe der Charts.</li>\n<li><b>Zahnrad:</b> Ansicht, Handy, Sprache, Währung, offizieller Index, Stufen, Signal-Methode, Divergenz, Heatmap &amp; Alarme, eigene Linien, Programm (Autostart, Intervalle, Online), API-Keys, Telegram, Knöpfe, Farben.</li>\n<li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul>\n<p class=\"muted\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});

w (hollow △/▽). Catches most tops, with many false signals.","m_div":"Divergence (settings)","m_div365":"Divergence 365 days","m_off":"Official index (phase + turn)","m_offdiv":"Divergence official index","divHead":"Divergence (like RSI on TradingView)","divLeft":"Days left (before the low/high)","divRight":"Confirmed after days (right)","divMin":"Min. distance of the two lows/highs (days)","divMax":"Max. distance (days)","divSrc":"Source","divSrc7":"7-day average","divSrcD":"Daily value","divWin":"Comparison window","divWinSub":"\"like chart\" follows 365 / 90 above","divAuto":"like chart","div_hidden":"Hidden divergence (H bull/H bear)","div_zone":"Only in fear/greed range (≤ 40 / ≥ 60)","div_official":"Also for the official index","divHelp":"Bull = price lower low, index higher low → long signal. Bear = price higher high, index lower high → short signal. A low/high counts as confirmed once it holds for the set days; the label appears on the confirmation day and never moves.","linesHead":"Own alert lines","linesNone":"No own lines yet.","lineAdd":"+ Line","lineDel":"Delete","linesHelp":"Prices in US dollars. Drag up/down in the chart (\"Own lines\" on). Alert when price crosses the line – in the browser and via Telegram.","hExtra":"More clusters","hExtraU":"per side","hCool":"Cooldown per alert","hOpt_alarmExtra":"Alerts for more clusters too","hHelp":"L1/S1 = strongest long/short cluster (solid), L2/S2 = nearest (dashed), L3… = more (dotted). 🔔 gold = alert level. The cooldown applies per cluster and price – once a cluster is taken and recalculated, the new one alerts immediately. Colours under \"Chart appearance\".","hk_top":"strongest","hk_near":"nearest","hk_extra":"further","hFrom":"alert from","hMid":"middle L1/S1","hPrice":"price now","hAlarmPct":"alert distance {p} %","al_lines":"Own alert lines","al_div":"Divergence (bull/bear)","al_off":"Official index signals","chipPick":"Click = show as line in the chart","chipGapAvg":"Gap to official avg.","sig_peak_fear":"Extreme point bottom","sig_peak_greed":"Extreme point top","mTitle":"Method comparison (backtest)","mNote":"since start of data, level 1","mCol":"Method","mN":"Buy/sell","mBuyOk":"Buy ✓","mSellOk":"Sell ✓","mTops":"Tops","mBottoms":"Bottoms","mHelp":"Buy ✓ / sell ✓ = price 30 days later in signal direction. Tops/bottoms = major turns (price move ≥ 20 %), caught = matching signal within ±21 days. Past results are no guarantee.","st_bellColor":"Alert lines (bell)","st_midColor":"Middle M","st_ownColor":"Own lines","st_sigOffColor":"Official signals","st_divBull":"Divergence bull","st_divBear":"Divergence bear","introHtml":"<p class=\"lead\">Welcome to the <b>VrilyaSS Fear &amp; Greed INDEX</b> – a rebuild of the \"Smart Money Fear &amp; Greed\" by <b>Smart Money Crypto</b> (YouTube), with own extensions.</p>\n<h3>What is it?</h3>\n<p>The well-known Fear &amp; Greed indices (alternative.me, CoinMarketCap …) measure sentiment mostly from spot volume, volatility, social media and surveys. In his live streams (16 Oct 2026) Smart Money Crypto showed his own index that measures what he considers more meaningful: how futures traders, large flows and the macro backdrop are positioned. According to his video it turns earlier than the official one (e.g. July 2026). This page rebuilds his index from freely available data. <i>Not an official page, not investment advice.</i></p>\n<h3>Calculation</h3>\n<ul><li>10 building blocks: funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility, ETF flows, stablecoin inflow, Coinbase premium, VIX, DXY trend.</li>\n<li>Each block is ranked against its own last 90 or 365 days (0 = fear, 100 = greed); the index is the average, shown as 7-day average.</li>\n<li>Zones as in the video: 0–24 extreme fear · 25–44 fear · 45–54 neutral · 55–74 greed · 75–100 extreme greed.</li></ul>\n<h3>Signals (no repaint)</h3>\n<ul><li>Dots = peak of an extreme phase (hollow = still running). Triangles: ▲ below price = long, ▼ above = short; hollow = phase confirmed on day 3, filled = turn confirmed, white border = zone left (trigger selectable: entry, exit, both).</li>\n<li>Method (settings → signals): standard, daily, 90 + 365, price confirmation, extreme point. Divergence like RSI on TradingView (Bull/Bear label on the confirmation day). Official signals in teal.</li>\n<li>The backtest table under \"Trend &amp; assessment\" shows hit rates and how many major tops/bottoms each method caught.</li></ul>\n<h3>Heatmap and alerts</h3>\n<ul><li>L1/S1 strongest, L2/S2 nearest, L3… further clusters; 🔔 gold line = alert level (1 % before the cluster); M = middle; own lines A1, A2 … can be dragged.</li><li>LF/SF = farthest strong cluster (at least 50 % of the strongest volume, at most 20 % away). Reaction alert: after a cluster is hit, a 1 % move the other way within 24 h triggers hit → reaction; 1 % beyond the cluster triggers break – both with the next cluster.</li>\n<li>Alerts in the browser and via Telegram (through the PC program), each with typical scenarios.</li></ul>\n<h3>Controls</h3>\n<ul><li>Buttons above the chart and <b>Layers ▾</b>; mouse wheel = zoom time, drag = pan, drag right scale = zoom height, double-click = reset; gear = all settings.</li></ul>\n<p class=\"muted\">Open this window any time via \"Manual\".</p>"});

ney Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube-Kanal ↗</a>) hat in seinen Livestreams einen eigenen, selbst gebauten Index gezeigt. Er misst stattdessen, was er für aussagekräftiger hält: wie die <b>Futures-Trader</b> positioniert sind (Funding, Open Interest, Long/Short, Liquidationen), wohin die <b>großen Geldflüsse</b> gehen (ETF-Flows, Stablecoins, Coinbase-Premium) und wie das <b>Makro-Umfeld</b> aussieht (VIX, Dollar).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – „⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!“<br>Hier geht er <b>erstmals auf den Bau</b> seines Index ein: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">ab Minute 11:57 ↗</a></li>\n<li><b>16.10.2026</b> – „⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING“<br>Hier erklärt er die <b>verbesserte Version</b> vom Vortag genauer: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">ab Minute 8:21 ↗</a></li></ul>\n<p>Laut seinem Video und seinen Aussagen dreht sein Index <b>früher</b> als der offizielle: Im Juli 2026 zeigte er schon extreme Gier, Wochen bevor der offizielle Index folgte – für Privatanleger viel zu spät, um noch nützlich zu sein.</p>\n<p class=\"opinion\"><b>Meinung des Seitenbetreibers:</b> Die offiziellen Indizes reagieren erfahrungsgemäß deutlich später – für Privatanleger kommen ihre Signale oft Wochen zu spät, um noch nützlich zu sein. Sie sind für die breite Masse gemacht, nicht für frühe Signale. Dazu kommt ein Interessenkonflikt: Mehrere Anbieter stehen Börsen nahe (CoinMarketCap gehört z. B. zu Binance), und Börsen verdienen am Handel der Masse – egal, ob diese gewinnt oder verliert. Für echte Investitionen sollte man sich deshalb nicht allein auf diese Indizes verlassen.</p>\n<p>Diese Seite baut seinen Index aus frei verfügbaren Daten nach <i>(keine offizielle Seite, keine Anlageberatung)</i>.</p></div><div class=\"ibox\"><h3>So wird gerechnet</h3><ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li>\n<li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li>\n<li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen.</li>\n<li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li>\n<li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert (Smart Money zählt standardmäßig doppelt, im Zahnrad 1:1, 2:1 oder 3:1). Neben „Was das jetzt heißt“ steht die <b>Tendenz</b> aus den letzten Wochen.</li></ul></div><div class=\"ibox\"><h3>Signale im Chart (ohne Repaint)</h3><ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über/unter der Stufe). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li>\n<li><b>Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt, voll = Wende bestätigt (5 Punkte vom Extrem zurück), voll mit weißem Rand = Zone wieder verlassen.</li>\n<li><b>Einstellbar</b> (Zahnrad → Signale): Auslöser (Eintritt / Austritt / beides), <b>Signal ab Tag</b> (1 = schon beim ersten Berühren der 30/70, 3 = wie bisher) und <b>Berührung ± Punkte</b> (z. B. 1: Index 31 zählt schon als Berührung der 30).</li>\n<li><b>Stufen</b> 75/25 (wie im Video) und 85/15 – Werte und Farben im Zahnrad. <b>Methode:</b> Standard, Tageswert, 90 + 365 Tage, Kurs-Bestätigung oder Extrempunkt.</li>\n<li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b> (Long), Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b> (Short). Das Label erscheint am Bestätigungstag und wandert nie mehr.</li>\n<li><b>Signale offiziell:</b> dieselben Punkte und Signale für den offiziellen Index, in Türkis.</li>\n<li><b>Tops/Böden (rückwirkend):</b> große ▼ Top / ▲ Boden an den höchsten Hochs und tiefsten Tiefs eines Zyklus (Bewegung danach mindestens 35 %, einstellbar). Sie stehen erst fest, wenn die Gegenbewegung gelaufen ist – kein Live-Signal.</li>\n<li><b>Pivot:</b> waagerechte Linien am höchsten Hoch und am tiefsten Tief danach, mit Preis rechts.</li>\n<li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Keine Methode trifft alles.</li></ul></div><div class=\"ibox\"><h3>Liquidations-Heatmap und Alarme</h3><ul><li>Schätzung aus Binance-Daten der letzten ~21 Tage, wo Positionen liquidiert würden. <b>L1/S1</b> = stärkster Cluster (★, durchgezogen), <b>L2/S2</b> = nächster (gestrichelt), <b>LF/SF</b> = weit entferntester starker Cluster (mind. 50 % des stärksten, max. 20 % vom Kurs), <b>L3…</b> = weitere. Rechts stehen Preis und Volumen in Mio. $.</li>\n<li><b>🔔 Goldene gepunktete Linie</b> = Alarmstufe (Standard 1 % vor dem Cluster). <b>M</b> = Mitte zwischen L1 und S1. <b>Eigene Alarmlinien</b> (A1, A2 …) mit der Maus verschieben.</li>\n<li><b>Reaktions-Alarm:</b> Wird ein Cluster angelaufen und läuft der Kurs danach 1 % zurück, kommt „angelaufen → Reaktion“; läuft er 1 % darüber hinaus, kommt „durchbrochen“ – jeweils mit dem nächsten Cluster.</li>\n<li>Alarme kommen im Browser (solange die Seite offen ist) und per <b>Telegram</b> (über das Programm auf dem PC). Jede Meldung erklärt die typischen Szenarien.</li></ul></div><div class=\"ibox\"><h3>Wo stelle ich was ein?</h3><ul><li><b>Knöpfe über dem Chart:</b> Linie/Kerzen, Zahlen, Index im Chart, Heatmap, Stufen, Signale, Signale offiziell, Divergenz, Tops/Böden, Pivot, Alarmlinien, Cluster, eigene Linien, Mitte, <b>Ebenen ▾</b>, Zeitraum.</li>\n<li><b>Chart bedienen:</b> Mausrad = Zeit zoomen, ziehen = verschieben, rechte Skala ziehen = Höhe zoomen, Doppelklick = zurück. Ende des Charts vom Rand verschieben und automatisch ans Ende scrollen wie in MT4.</li>\n<li><b>Oben rechts:</b> Binance/Multi-Source, 365/90 Tage, $/€, <b>Rahmen</b> (Kästen deutlicher), Handbuch, Zahnrad. Sprache: DE · EN · AR.</li>\n<li><b>Zahnrad:</b> Ansicht, Handy, Sprache, Währung, offizieller Index, Stufen, Signale, Divergenz, Heatmap &amp; Alarme, eigene Linien, Empfehlungen, Rahmen, Programm (Autostart, Intervalle, Online), API-Keys, Telegram, Farben.</li>\n<li><b>Neu in V13:</b> Ansicht <b>SMC 2</b> (SMC mit Flaggen, Euro und Ticker-Erweiterungen; SMC bleibt Original), <b>MA</b> (EMA 200/50 im Kurs-Chart, SMA 20 im Index-Chart), <b>Fibo</b> (Fibonacci zwischen Pivot-Hoch und -Tief, Schnellwahl 61,8/38,2 bei den Stufen), <b>Trendfilter</b> für Kauf-Signale (EMA / ADX / MACD Woche, markieren ⚠ oder ausblenden), <b>L/S-Labels</b> an den Punkten, <b>Pivot-Zeitraum</b> (Sicht · 7T · 1M · 3M · 6M · 12M · Alles), <b>⛶ Vollbild</b> je Fenster (Esc = zurück), <b>Ticker</b> oben ziehen = Größe, ▾ = einklappen.</li><li><b>Daten:</b> am PC jede Minute neu (einstellbar), online alle 10 Minuten. Der Stand steht unten in der Fußzeile.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Dieses Fenster lässt sich jederzeit über „Handbuch“ öffnen.</p>"});

lank\" rel=\"noopener\">YouTube channel ↗</a>) showed his own, self-built index in his live streams. It measures what he considers more meaningful: how <b>futures traders</b> are positioned, where <b>big money flows</b> go and what the <b>macro backdrop</b> looks like.</p>\n<ul class=\"vids\"><li><b>15 Oct 2026</b> – \"⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!\"<br>First mention of building the index: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">from 11:57 ↗</a></li>\n<li><b>16 Oct 2026</b> – \"⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING\"<br>Explains the improved version from the day before: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">from 8:21 ↗</a></li></ul>\n<p>According to his video his index turns <b>earlier</b> than the official one: in July 2026 it showed extreme greed weeks before the official index followed.</p>\n<p class=\"opinion\"><b>Opinion of the site owner:</b> the official indices tend to react much later – for retail investors their signals often come weeks too late. They are made for the masses, not for early signals. There is also a conflict of interest: several providers are close to exchanges (e.g. CoinMarketCap belongs to Binance), and exchanges earn from retail trading whether it wins or loses. Do not rely on these indices alone for real investments.</p>\n<p>This page rebuilds his index from freely available data <i>(not an official page, not investment advice)</i>.</p></div><div class=\"ibox\"><h3>Calculation</h3><ul><li>10 building blocks: funding, open interest change, long/short ratio, liquidations, RSI &amp; volatility, ETF flows, stablecoin inflow, Coinbase premium, VIX, DXY trend.</li>\n<li>Each block is ranked against its own last 90 or 365 days (0 = fear, 100 = greed); the index is the average, shown as 7-day average.</li>\n<li>Zones as in the video: 0–24 extreme fear · 25–44 fear · 45–54 neutral · 55–74 greed · 75–100 extreme greed. Assessment: ① Smart Money, ② official (textbook), ③ combined; plus a tendency label.</li></ul></div><div class=\"ibox\"><h3>Signals (no repaint)</h3><ul><li>Dots = peak of an extreme phase. Triangles: ▲ below price = long, ▼ above = short; hollow = phase confirmed, filled = turn, white border = zone left.</li>\n<li>Settings: trigger (entry / exit / both), signal from day (1 = on first touch), touch tolerance ± points, method, divergence, official signals.</li>\n<li>Tops/bottoms (retrospective): cycle highs/lows after a move of at least 35 % – no live signal. Pivot: lines at the highest high and the lowest low after it.</li></ul></div><div class=\"ibox\"><h3>Heatmap and alerts</h3><ul><li>L1/S1 strongest (★), L2/S2 nearest, LF/SF farthest strong cluster, L3… further; labels show price and volume. 🔔 gold line = alert level; M = middle; own lines A1, A2 … can be dragged.</li>\n<li>Reaction alert: cluster hit → 1 % move back = reaction, 1 % beyond = break – each with the next cluster. Alerts in the browser and via Telegram.</li></ul></div><div class=\"ibox\"><h3>Controls</h3><ul><li>Buttons above the chart and <b>Layers ▾</b>; wheel = zoom, drag = pan, drag right scale = zoom height, double-click = reset; <b>Frames</b> button top right; gear = all settings. Language: DE · EN · AR.</li></ul></div><p class=\"muted\" style=\"text-align:center\">Open this window any time via \"Manual\".</p>"});

\"⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING\"<br>هنا يشرح <b>النسخة المحسّنة</b> من اليوم السابق بتفصيل أكبر: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">من الدقيقة 8:21 ↗</a></li></ul>\n<p>حسب الفيديو ينعطف مؤشره <b>أبكر</b> من المؤشر الرسمي: في يوليو 2026 أظهر طمعاً شديداً قبل أسابيع من المؤشر الرسمي.</p>\n<p class=\"opinion\"><b>رأي صاحب الموقع:</b> المؤشرات الرسمية تتفاعل عادةً متأخرة كثيراً – وإشاراتها تصل للمستثمر الصغير غالباً بعد فوات الأوان. هي مصممة للجمهور العام وليست للإشارات المبكرة. ويوجد تضارب مصالح: عدة مزودين قريبون من المنصات (مثلاً CoinMarketCap مملوكة لـ Binance)، والمنصات تربح من تداول الجمهور سواء ربح أم خسر. لذلك لا تعتمد على هذه المؤشرات وحدها في استثماراتك الحقيقية.</p>\n<p>هذه الصفحة تعيد بناء مؤشره من بيانات متاحة مجاناً <i>(ليست صفحة رسمية، وليست نصيحة استثمارية)</i>.</p></div><div class=\"ibox\"><h3>طريقة الحساب</h3><ul><li><b>10 عناصر:</b> Funding، تغيّر الفائدة المفتوحة، نسبة Long/Short، التصفيات، RSI والتقلب، تدفقات ETF، تدفق العملات المستقرة، علاوة Coinbase، VIX، اتجاه DXY.</li>\n<li>يُقارن كل عنصر بآخر <b>90 أو 365 يوماً</b> له (0 = خوف، 100 = طمع)، والمؤشر هو المتوسط ويُعرض كمتوسط 7 أيام.</li>\n<li>المناطق كما في الفيديو: 0–24 خوف شديد (شراء) · 25–44 خوف (شراء على دفعات) · 45–54 محايد (انتظار) · 55–74 طمع (احتفاظ) · 75–100 طمع شديد (جني الأرباح). التقييم: ① Smart Money، ② الرسمي، ③ مجمّع، مع ملصق الاتجاه.</li></ul></div><div class=\"ibox\"><h3>الإشارات في الرسم (بدون إعادة رسم)</h3><ul><li><b>النقاط:</b> ذروة المرحلة القصوى. <b>المثلثات:</b> ▲ تحت السعر = لونغ، ▼ فوق السعر = شورت؛ مفرغ = تأكيد المرحلة، ممتلئ = انعطاف، بإطار أبيض = مغادرة المنطقة.</li>\n<li>في الإعدادات: المُشغّل (دخول / خروج / كلاهما)، <b>الإشارة من اليوم</b> (1 = عند أول لمس للـ 30/70)، <b>هامش اللمس ± نقاط</b>، الطريقة، الانفراج (Bull/Bear)، الإشارات الرسمية.</li>\n<li><b>القمم/القيعان (بأثر رجعي):</b> أعلى القمم وأدنى القيعان في الدورة بعد حركة 35 % على الأقل – ليست إشارة مباشرة. <b>Pivot:</b> خطوط أفقية عند أعلى قمة وأدنى قاع بعدها.</li></ul></div><div class=\"ibox\"><h3>خريطة التصفيات والتنبيهات</h3><ul><li>L1/S1 الأقوى (★)، L2/S2 الأقرب، LF/SF أبعد تجمّع قوي، L3… إضافية؛ الملصقات تُظهر السعر والحجم. 🔔 الخط الذهبي = مستوى التنبيه؛ M = المنتصف؛ خطوطك الخاصة A1، A2 … قابلة للسحب.</li>\n<li>تنبيه رد الفعل: لمس تجمّع ← رجوع 1 % = رد فعل، تجاوز 1 % = اختراق – مع التجمّع التالي. التنبيهات في المتصفح وعبر تيليغرام.</li></ul></div><div class=\"ibox\"><h3>أين أضبط ماذا؟</h3><ul><li>الأزرار فوق الرسم و<b>الطبقات ▾</b>؛ عجلة الفأرة = تكبير، سحب = تحريك، سحب المقياس الأيمن = تكبير الارتفاع، نقر مزدوج = إعادة؛ زر <b>الإطارات</b> في الأعلى؛ الترس = كل الإعدادات. اللغة: DE · EN · AR.</li></ul></div><p class=\"muted\" style=\"text-align:center\">يمكن فتح هذه النافذة في أي وقت عبر \"الدليل\".</p>"};

Object.assign(T.de, {"introHtml":"<p class=\"lead\">Willkommen beim <b>VrilyaSS Fear &amp; Greed INDEX</b> – einem Nachbau des „Smart Money Fear &amp; Greed“ von <b>Smart Money Crypto</b> (YouTube), mit eigenen Erweiterungen.</p><div class=\"ibox\"><h3>Worum geht es?</h3><p>Die bekannten Fear &amp; Greed Indizes (alternative.me, CoinMarketCap, CFGI.io, CoinGlass, CoinAnk) messen die Stimmung vor allem über Spot-Volumen, Volatilität, Social Media und Umfragen.</p>\n<p>Der YouTuber mit dem Kanal <b>Smart Money Crypto</b> (<a href=\"https://www.youtube.com/@Smart_Money_Crypto\" target=\"_blank\" rel=\"noopener\">YouTube-Kanal ↗</a>) hat in seinen Livestreams einen eigenen, selbst gebauten Index gezeigt. Er misst stattdessen, was er für aussagekräftiger hält: wie die <b>Futures-Trader</b> positioniert sind (Funding, Open Interest, Long/Short, Liquidationen), wohin die <b>großen Geldflüsse</b> gehen (ETF-Flows, Stablecoins, Coinbase-Premium) und wie das <b>Makro-Umfeld</b> aussieht (VIX, Dollar).</p>\n<ul class=\"vids\"><li><b>15.10.2026</b> – „⚠️🚨 Bitcoin: JETZT wackelt der letzte Boden!! Wir gehen unsere Limit Entrys durch!“<br>Hier geht er <b>erstmals auf den Bau</b> seines Index ein: <a href=\"https://www.youtube.com/live/mPPvxVOjsJU?t=717\" target=\"_blank\" rel=\"noopener\">ab Minute 11:57 ↗</a></li><li><b>16.10.2026</b> – „⚠️🚨 UNSERE LONGS SIND AUFGEGANGEN! WAS JETZT? LIVE TRADING“<br>Hier erklärt er die <b>verbesserte Version</b> vom Vortag genauer: <a href=\"https://www.youtube.com/live/yrPX37kjXhA?t=501\" target=\"_blank\" rel=\"noopener\">ab Minute 8:21 ↗</a></li></ul>\n<p>Laut seinem Video und seinen Aussagen dreht sein Index <b>früher</b> als der offizielle: Im Juli 2026 zeigte er schon extreme Gier, Wochen bevor der offizielle Index folgte – für Privatanleger viel zu spät, um noch nützlich zu sein.</p>\n<p class=\"opinion\"><b>Meinung des Seitenbetreibers:</b> Die offiziellen Indizes reagieren erfahrungsgemäß deutlich später – für Privatanleger kommen ihre Signale oft Wochen zu spät, um noch nützlich zu sein. Sie sind für die breite Masse gemacht, nicht für frühe Signale. Dazu kommt ein Interessenkonflikt: Mehrere Anbieter stehen Börsen nahe (CoinMarketCap gehört z. B. zu Binance), und Börsen verdienen am Handel der Masse – egal, ob diese gewinnt oder verliert. Für echte Investitionen sollte man sich deshalb nicht allein auf diese Indizes verlassen.</p>\n<p>Diese Seite baut seinen Index aus frei verfügbaren Daten nach <i>(keine offizielle Seite, keine Anlageberatung)</i>.</p></div><div class=\"ibox\"><h3>Die drei Ansichten: SMC · SMC 2 · VrilyaSS</h3><p>Oben links umschalten. Der Index und seine Berechnung sind in allen drei Ansichten gleich – es ändert sich nur, was angezeigt wird.</p>\n<h4>1 · SMC – 1:1-Nachbau</h4><p>So wie im Video von Smart Money Crypto (16.10.2026): Titel, Kurs in $, 24-Stunden-Änderung, Knöpfe Telegram / KI-Modelle / Warum dieser Index?, die 10 Bausteine mit dem Index in der Mitte, „Bitcoin in den nächsten 24 Stunden“, „Was das jetzt heißt“, der Chart „Wo Angst war und wo Gier“ mit Zahlen, Offiziellem Index, Zeiträumen und Punkten, unten der Liquidations-Ticker.</p>\n<h4>2 · SMC 2 – 1:1-Nachbau mit leichten Änderungen</h4><ul><li>Kurs in <b>$ und €</b> mit Flaggen <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 19 10\" preserveAspectRatio=\"none\"><rect width=\"19\" height=\"10\" fill=\"#b22234\"/><path d=\"M0 1.15h19M0 2.69h19M0 4.23h19M0 5.77h19M0 7.31h19M0 8.85h19\" stroke=\"#fff\" stroke-width=\".77\"/><rect width=\"7.6\" height=\"5.38\" fill=\"#3c3b6e\"/><g fill=\"#fff\"><circle cx=\"1.3\" cy=\"1\" r=\".35\"/><circle cx=\"3.2\" cy=\"1\" r=\".35\"/><circle cx=\"5.1\" cy=\"1\" r=\".35\"/><circle cx=\"2.2\" cy=\"2.2\" r=\".35\"/><circle cx=\"4.1\" cy=\"2.2\" r=\".35\"/><circle cx=\"6\" cy=\"2.2\" r=\".35\"/><circle cx=\"1.3\" cy=\"3.4\" r=\".35\"/><circle cx=\"3.2\" cy=\"3.4\" r=\".35\"/><circle cx=\"5.1\" cy=\"3.4\" r=\".35\"/><circle cx=\"2.2\" cy=\"4.5\" r=\".35\"/><circle cx=\"4.1\" cy=\"4.5\" r=\".35\"/></g></svg></span> <span style=\"display:inline-block;width:21px;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden\"><svg style=\"width:100%;height:100%;display:block\" viewBox=\"0 0 30 20\" preserveAspectRatio=\"none\"><rect width=\"30\" height=\"20\" fill=\"#003399\"/><g fill=\"#ffcc00\"><circle cx=\"15.00\" cy=\"4.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"4.80\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"21.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"20.20\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"18.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"15.00\" cy=\"16.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"15.20\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"13.00\" r=\"1.05\"/><circle cx=\"9.00\" cy=\"10.00\" r=\"1.05\"/><circle cx=\"9.80\" cy=\"7.00\" r=\"1.05\"/><circle cx=\"12.00\" cy=\"4.80\" r=\"1.05\"/></g></svg></span> – im Titel und im Ticker</li><li>Titel im <b>goldenen Kasten</b>, <b>Trennstriche</b> zwischen Titel, Kurs, 24 h, Knöpfen und Sprache</li><li>Ticker zusätzlich mit <b>24-h-Pfeil</b> und den <b>vier Cluster-Zeilen</b> (SF fernster Short, S1 stärkster Short, L1 stärkster Long, LF fernster Long) samt Alarm-Stufe</li><li>sonst alles wie SMC</li></ul>\n<h4>3 · VrilyaSS – SMC als Basis plus alle eigenen Erweiterungen</h4><ul><li><b>Anzeige:</b> $ und € mit Flaggen, alle offiziellen Indizes als Chips mit Abstand zum Smart-Money-Index, die letzten 7 Tage einzeln, <b>Tendenz</b> neben „Was das jetzt heißt“, <b>Empfehlung Spot &amp; Futures</b>, kombinierte <b>Einschätzung ①②③</b>, Trend &amp; Methoden-Vergleich (Backtest)</li><li><b>Chart:</b> Linie/Kerzen mit wählbarer Kerzengröße, Index im Chart, Liquidations-Heatmap (Binance / Bybit / OKX / kombiniert), Stufen, <b>Signale</b> mit Trendfilter ⚠, Signale offiziell, <b>Divergenzen</b>, <b>Tops/Böden</b>, <b>Pivot</b>, <b>Fibonacci</b>, <b>MA</b>, L/S-Labels, Alarm- und eigene Linien, Mitte, <b>Richtungs-Kasten</b>, Ebenen-Menü, Zoomen wie TradingView, Chart-Ende verschieben wie MT4, <b>⛶ Vollbild</b> je Fenster</li><li><b>Alarme</b> im Browser und per Telegram (Signale, Cluster, Reaktion, eigene Linien, Pivots, Divergenzen)</li></ul>\n<table class=\"vcmp\"><tr><th></th><th>SMC</th><th>SMC 2</th><th>VrilyaSS</th></tr><tr><td>Index, 10 Bausteine, 24 h, Chart wie im Video</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>$ und € mit Flaggen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Titel-Kasten und Trennstriche</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Ticker mit 24-h-Pfeil und 4 Cluster-Zeilen</td><td>–</td><td>✓</td><td>✓</td></tr><tr><td>Signale, Divergenzen, Tops/Böden, Pivot, Fibonacci, MA</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Heatmap-Cluster, Alarm- und eigene Linien, Richtungs-Kasten</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>alle offiziellen Indizes, letzte 7 Tage, Tendenz</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Empfehlung Spot &amp; Futures, Einschätzung ①②③</td><td>–</td><td>–</td><td>✓</td></tr><tr><td>Sprache DE · EN · AR, Rahmen, Handbuch, Zahnrad</td><td>✓</td><td>✓</td><td>✓</td></tr></table></div><div class=\"ibox\"><h3>Warum VrilyaSS?</h3><ul><li><b>Gleiche Basis</b> wie SMC – derselbe Index –, aber mit Werkzeugen, um ein Signal zu <b>prüfen</b>, statt ihm blind zu folgen.</li><li><b>Vergleich</b> mit allen offiziellen Indizes auf einen Blick: Wie weit liegt Smart Money vorne oder hinten?</li><li><b>Signale ohne Repaint</b> mit Auswertung (Trefferquote nach 30 Tagen); der <b>Trendfilter</b> markiert Käufe gegen den Trend mit ⚠.</li><li><b>Liquidations-Cluster</b> zeigen, wohin der Kurs gezogen werden kann – mit Alarm, bevor er dort ist.</li><li><b>Tops/Böden, Pivots, Fibonacci, MA und der Richtungs-Kasten</b> ordnen ein, wo der Kurs steht und wohin er gerade läuft.</li><li><b>Alarme</b> im Browser und per Telegram – man muss nicht ständig auf den Chart schauen.</li><li>Ehrlich gesagt: Kein Werkzeug trifft alles. Die Seite hilft beim Einordnen, sie ist <b>keine Anlageberatung</b>.</li></ul></div><div class=\"ibox\"><h3>So wird gerechnet</h3><ul><li><b>10 Bausteine:</b> Funding, Open-Interest-Änderung, Long/Short-Verhältnis, Liquidationen, RSI &amp; Volatilität (Futures-Markt) sowie ETF-Flows, Stablecoin-Zufluss, Coinbase-Premium, VIX und DXY-Trend (Flows und Makro).</li><li>Jeder Baustein wird mit seinen eigenen letzten <b>90 oder 365 Tagen</b> verglichen (0 = Angst, 100 = Gier; oben „365 T / 90 T“).</li><li>Der Index ist der Durchschnitt, angezeigt als <b>7-Tage-Mittel</b>. „Binance“ = nur Binance-Daten wie im Video, „Multi-Source“ = mehrere Börsen (Maus darüber zeigt die Erklärung).</li><li><b>Zonen</b> wie im Video: 0–24 Extreme Angst (kaufen) · 25–44 Angst (in Tranchen kaufen) · 45–54 Neutral (abwarten) · 55–74 Gier (halten) · 75–100 Extreme Gier (Gewinne sichern).</li><li><b>Einschätzung</b> unter dem Chart: ① Smart Money (Zone wie im Video), ② offizieller Index nach Lehrbuch (Angst = Kaufgelegenheit, Gier = Vorsicht), ③ kombiniert (Smart Money zählt standardmäßig doppelt, im Zahnrad 1:1, 2:1 oder 3:1). Neben „Was das jetzt heißt“ steht die <b>Tendenz</b> aus den letzten Wochen.</li></ul></div><div class=\"ibox\"><h3>Chart: Zeitraum, Kerzen, Kurslinie, Richtung</h3><ul><li><b>Zeitraum</b> (7 Tage, 1 Monat … Alles) = wie viel man sieht, <b>nicht</b> die Kerzengröße.</li><li><b>Kerze</b> (Auswahl neben Linie/Kerzen): <b>Auto</b> = bis 10 Tage Stundenkerzen, sonst Tageskerzen (wie bisher) · <b>15m / 1h / 4h</b> = Minuten-/Stundenkerzen direkt von Binance, nur am aktuellen Ende und so weit die Daten zurückreichen (15m ≈ 10 Tage, 1h ≈ 41 Tage, 4h ≈ 166 Tage) – reicht der Zeitraum weiter zurück, werden Tageskerzen gezeigt und daneben steht ein Hinweis · <b>1T</b> = immer Tageskerzen · <b>1W</b> = Wochenkerzen (Montag bis Sonntag).</li><li>Der <b>Index-Chart</b> unten bleibt immer <b>täglich</b> – den Index gibt es nur einmal pro Tag. Darum gibt es kein 1m und 5m: Unten würde sich nichts bewegen, oben wäre fast nur Rauschen.</li><li><b>Aktuelle Kurslinie</b> (bis zur Preisskala, wie TradingView): Standard weiß und gestrichelt. Im Zahnrad → Chart-Extras einstellbar: gepunktet / gestrichelt / durchgezogen, Dicke, Farbe und <b>Farbmodus grün/rot wie TradingView</b> – grün, wenn der Kurs über der Eröffnung der aktuellen Kerze liegt, rot, wenn er darunter liegt. Die Label-Farben (Modus fest) stehen unter „Farben“.</li><li><b>Richtungs-Kasten</b> neben der Legende: aktuelle Bewegung (Standard: letzte 24 h, umstellbar auf „Kurs über/unter EMA“ mit eigener Periode und Zeitrahmen 1h / 4h / 1T), dazu das <b>nächste Ziel</b> (nächstes Pivot in diese Richtung) und der <b>größte Cluster</b> Richtung Long (darunter) bzw. Richtung Short (darüber).</li><li><b>MA</b> (EMA 50/200 im Kurs-Chart, SMA 20 im Index-Chart): in € wird die EMA direkt aus den Euro-Kursen gerechnet und ist dadurch glatt. Beschriftung, Farbe (fest / grün-rot / abgestuft) und Verlängerung im Zahnrad; die Verlängerung endet am rechten Chart-Rand.</li><li><b>Überschriften</b> „Wo Angst war und wo Gier“ und „Index · 7-Tage-Mittel“ sind gelb und dicker umrahmt, damit sie sich von den Knöpfen abheben (Farbe im Zahnrad). Die Leiste zwischen den beiden Charts ziehen = Höhe ändern.</li></ul></div><div class=\"ibox\"><h3>Signale im Chart (ohne Repaint)</h3><ul><li><b>Punkte:</b> Spitze einer Extremphase (mindestens 3 Tage über/unter der Stufe). Voll = Phase vorbei, hohl = Phase läuft noch und kann wandern.</li><li><b>Dreiecke:</b> ▲ unter dem Kurs = Long (Kauf), ▼ über dem Kurs = Short (Verkauf). Hohl = Phase bestätigt, voll = Wende bestätigt, voll mit weißem Rand = Zone wieder verlassen. <b>⚠</b> = Kauf gegen den Trend (Trendfilter EMA 200 / ADX / MACD Woche).</li><li><b>Einstellbar</b> (Zahnrad → Signale): Auslöser, Signal ab Tag, Berührung ± Punkte, Methode, Trendfilter (aus / markieren / ausblenden).</li><li><b>Stufen</b> 75/25 (wie im Video) und 85/15, Schnellwahl auch 70/30 und Fibonacci 61,8/38,2. Die Stufen-Knöpfe stehen in VrilyaSS beim Index-Chart und schalten auch die Punkte im Kurs-Chart.</li><li><b>Divergenz</b> wie RSI bei TradingView: Kurs tieferes Tief + Index höheres Tief = <b>Bull</b>, Kurs höheres Hoch + Index tieferes Hoch = <b>Bear</b>. Das Label erscheint am Bestätigungstag und wandert nie mehr.</li><li><b>Auswertung</b> unter „Trend &amp; Einschätzung“: Trefferquote nach 30 Tagen und wie viele große Tops/Böden jede Methode erwischt hat. Keine Methode trifft alles.</li></ul></div><div class=\"ibox\"><h3>Tops/Böden (rückwirkend)</h3><p>Große Wendepunkte des Kurses, die erst <b>im Nachhinein</b> feststehen – kein Live-Signal, sondern Orientierung im Zyklus.</p><ul><li><b>So wird gezählt:</b> Ein Hoch zählt als <b>Top</b>, wenn der Kurs danach mindestens <b>X % fällt</b>, bevor er ein neues Hoch macht. Ein Tief zählt als <b>Boden</b>, wenn der Kurs danach mindestens <b>X % steigt</b>. Gerechnet wird mit Tagesschlusskursen.</li><li><b>Zwei Stufen:</b> <b>Zyklus</b> (Standard 35 %) = große ▲/▼. <b>Zwischen</b> (Standard 20 %) = kleinere, blassere ▲/▼ mit „Zw.“.</li><li><b>Knopf „Tops/Böden“:</b> 1× klicken = Zyklus, 2× = Zyklus + Zwischen, 3× = aus. Rechtsklick = zurück. Prozent-Werte im Zahnrad → Chart-Extras.</li><li><b>Beispiel:</b> Zwischen dem Boden am 21.11.2022 (15,8K) und dem Top am 06.10.2025 (124,7K) gab es keinen Rücksetzer von 35 % – die größten waren −28 % (Jan.–Apr. 2025) und −26 % (2024). Darum zählt die ganze Strecke als <b>ein</b> Anstieg. Der Boden vom 05.02.2026 (62,9K) stieg danach nur um 30,7 % – er erscheint als Zwischen-Boden (20 %), aber nicht bei 35 %. Die Hochs vom 14.07. und 13.08.2025 fielen danach nur 6 % bzw. 12 % – das sind kleine Zwischenhochs.</li><li>Je kleiner der Wert, desto mehr Punkte: seit 2020 sind es bei 35 % 9 Wendepunkte, bei 25 % 19, bei 20 % 31, bei 15 % 52.</li></ul></div><div class=\"ibox\"><h3>Pivot-Linien und Fibonacci</h3><ul><li><b>Höchstes Hoch</b> = das höchste Tageshoch im gewählten Zeitraum. <b>Tiefstes Tief</b> = das tiefste Tagestief <b>danach</b>; gibt es danach noch keins, das tiefste im ganzen Zeitraum. Im Zahnrad umstellbar auf „im ganzen Zeitraum“.</li><li><b>Knopf „Pivot“</b> schaltet durch: grau = aus → <b>P-Sicht</b> (was der Chart gerade zeigt) → <b>P-7T</b> → <b>P-1M</b> → <b>P-3M</b> → <b>P-6M</b> → <b>P-12M</b> → <b>Pivot</b> (ganzer Verlauf) → aus. Rechtsklick = zurück.</li><li><b>Fibonacci</b> (Knopf „Fibo“) zwischen Pivot-Hoch und -Tief, alle Stufen gestrichelt und einzeln an/aus mit eigener Farbe (Zahnrad): 38,2 % rot, 50 % weiß, 61,8 % grün, 78,6 % blau, 88,7 % rot (≈ Wurzel aus 78,6 %), 23,6 % standardmäßig aus.</li><li>Farben und Dicke der Pivot-Linien im Zahnrad. Eine 🔔 an der Linie heißt: Für diesen Zeitraum ist ein Pivot-Alarm scharf.</li></ul></div><div class=\"ibox\"><h3>Liquidations-Heatmap – so wird geschätzt</h3><ul><li>Die Heatmap ist eine <b>eigene Schätzung</b>, keine echte Positionsliste: Steigt das <b>Open Interest</b> (offene Positionen) in einer Stunde, sind neue Positionen dazugekommen. Sie werden nach dem Käufer-Anteil dieser Stunde auf Longs und Shorts verteilt und auf typische Hebel aufgeteilt (5×, 10×, 25×, 50×, 100× mit 10 / 30 / 30 / 20 / 10 %). Daraus ergibt sich je Teil ein Liquidationspreis (bei 10× etwa 10 % vom Einstieg).</li><li>Hat der Kurs ein Level schon erreicht, gilt es als liquidiert und fällt weg. Sinkt das Open Interest, werden alle offenen Level anteilig kleiner. Betrachtet werden die letzten 500 Stunden (≈ 21 Tage).</li><li><b>Quelle wählbar</b> (Auswahl neben „Heatmap“): <b>Binance</b> (wie bisher), <b>Bybit</b>, <b>OKX</b> oder <b>kombiniert</b>. Kursverlauf und Käufer-Anteil kommen immer von Binance (der BTC-Kurs ist überall fast gleich), das Open Interest von der jeweiligen Börse. Die Wahl gilt auch für Cluster-Linien, Ticker und Alarme.</li><li><b>L1/S1</b> = stärkster Cluster (★), <b>L2/S2</b> = nächster, <b>LF/SF<
