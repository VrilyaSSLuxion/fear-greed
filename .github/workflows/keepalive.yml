# GitHub schaltet zeitgesteuerte Abläufe nach 60 Tagen ohne Commit ab.
# Dieser kleine Ablauf macht einmal im Monat einen leeren Commit, damit die Seite weiterläuft.
name: Wach halten

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Wach halten $(date -u +%F)"
          git push
